name: Weekly marketing review

# User standing directive (2026-07-26): continuously & periodically propose
# better marketing / exposure / inflow optimizations. Every Sunday evening a
# Claude strategist reviews REAL current data (GSC queries, traffic snapshot,
# coverage, channel states) and telegrams 3-5 prioritized suggestions in Korean.
on:
  schedule:
    - cron: '25 11 * * 0' # Sun 11:25 UTC = 20:25 KST (after the GSC weekly pull)
  workflow_dispatch:

jobs:
  review:
    # contents: write only to commit the Claude cost ledger (repo default is read).
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Every Claude call from here on lands in the cost ledger (scripts/lib/claude-meter.mjs).
      # Added 2026-09-25 so the daily report can state the site's whole Claude spend.
      - name: Name the Claude cost ledger
        run: echo "CLAUDE_COST_LEDGER=$GITHUB_WORKSPACE/data/claude-cost.jsonl" >> "$GITHUB_ENV"

      - name: Strategy review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/marketing-review.mjs

      # Committed on its own and last: a runner forgets everything, and this is the
      # only record of what this job spent on Claude.
      - name: Commit the Claude cost ledger
        if: always()
        run: |
          [ -f data/claude-cost.jsonl ] || exit 0
          git config user.name "content-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/claude-cost.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: claude cost ledger ($(date -u +%Y-%m-%d))"
          bash scripts/git-push-retry.sh
