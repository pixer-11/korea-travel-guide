name: Tests

# 이 저장소에는 테스트가 일곱 개 있었고, 그중 어느 것도 CI에서 돌지 않았다.
# 그래서 08-01에 고친 "부사 낀 closed" 버그가 08-04에 같은 모양으로 재발했다
# ('entirely'와 'both'는 넣고 'every'는 빠뜨린 채 통과) — 회귀 테스트의 존재
# 이유가 정확히 그것인데 아무도 실행하지 않으니 잡힐 수가 없었다.
#
# 이제 main에 닿는 모든 코드 변경이 전체 테스트를 통과해야 한다. 실패하면
# 한국어로 알린다: 봇이 매일 커밋하는 저장소에서 조용한 실패는 없는 것과 같다.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'src/lib/**'
      # Hand-written page/component code. lint-regex.test.mjs scans these for
      # lost backslashes and invisible characters, and the one dead regex it
      # found on 08-04 was in src/components — outside the original trigger.
      # src/content is deliberately absent: the bots rewrite it every night and
      # no test reads it.
      - 'src/components/**'
      - 'src/pages/**'
      # Subscribe endpoint and the Klook click relay live here — money paths.
      - 'worker/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'src/lib/**'
      - 'src/components/**'
      - 'src/pages/**'
      - 'worker/**'
  workflow_dispatch:

# 취소하지 않는다. GitHub 은 밀려난 실행을 run 단위에서 "failure" 로 집계해
# 소유자에게 메일을 보낸다 — 커밋을 연달아 올린 날이면 멀쩡한 테스트가
# "Run failed: Tests" 로 도착하고, 정작 진짜 실패가 왔을 때 구분할 수 없게 된다.
# 2026-08-06 밤에 정확히 그렇게 됐다: 세 커밋 연속으로 Tests 가 취소됐는데
# 로컬에서는 289개 전부 통과했다. 취소된 실행은 테스트를 한 번도 돌리지 않고
# 빨간 표시만 남기므로, 회귀를 잡으라고 만든 장치가 그날 아무것도 지키지 않았다.
# 공개 저장소라 실행 시간은 무료이고 취소로 아낄 것도 없다.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Every imported package must be declared
        # js-yaml was imported by 34 files and declared by none — it rode in as a
        # transitive dependency of gray-matter. That survives until gray-matter
        # drops it, and then 34 files die at once on a fresh npm ci (2026-08-06).
        run: node scripts/lint-deps.mjs

      # `astro check` had never run anywhere — not in CI, not in a script — so
      # 113 type errors had accumulated where nobody would see them, including
      # real ones (a prop the layout does not declare, a Map lookup that can be
      # undefined). Cleared to zero on 2026-08-06; this keeps it there, because
      # a count nobody enforces only goes back up.
      - name: Types must check
        run: npx astro check --minimumSeverity error

      - name: Run every *.test.mjs
        id: run
        run: |
          set -o pipefail
          fail=0
          # scripts/lib and worker were outside this glob, so the Places-budget
          # and Klook-relay tests written on 2026-08-05/06 would never have run
          # in CI — a test nobody runs is the exact shape this whole file exists
          # to prevent.
          for t in scripts/*.test.mjs scripts/lib/*.test.mjs src/lib/*.test.mjs worker/*.test.mjs; do
            [ -e "$t" ] || continue
            echo "── $t"
            # 테스트는 node:test를 쓰는 것과 자체 PASS/FAIL을 찍는 것이 섞여 있다.
            # 어느 쪽이든 비정상 종료 코드를 내면 실패로 센다.
            # Capture the output so the alert can NAME what broke. Three
            # identical "테스트 실패" messages arrived on 2026-08-06 and none of
            # them said which test — the log needs a login to read, and the suite
            # passed locally, so there was nothing to work from.
            if out=$(node "$t" 2>&1); then
              echo "   ✓"
            else
              echo "   ✗ FAILED"
              printf '%s\n' "$out" | tail -15
              {
                echo "── $t"
                printf '%s\n' "$out" | grep -E '^(FAIL|not ok|Error|AssertionError|✗)' | head -4
              } >> /tmp/test-failures.txt
              fail=1
            fi
          done
          exit $fail

      - name: Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] || exit 0
          DETAIL=$(head -c 1000 /tmp/test-failures.txt 2>/dev/null)
          [ -n "$DETAIL" ] || DETAIL="(어느 테스트인지 수집하지 못했습니다 — 로그 확인 필요)"
          TEXT=$(printf '%s\n\n%s\n%s\n\n%s\n\n%s' \
            "🧪 테스트 실패 — 방금 올라간 코드가 기존 검사를 깨뜨렸습니다" \
            "검사기가 잘못 판정하기 시작했을 수 있습니다(멀쩡한 글을 문제로 보거나, 진짜 문제를 놓치거나)." \
            "사이트 발행은 계속되지만, 다음 발행 전에 확인이 필요합니다." \
            "$DETAIL" \
            "실행 기록: ${URL}")
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg c "$TELEGRAM_CHAT_ID" --arg t "$TEXT" \
                  '{chat_id:$c, text:$t, disable_web_page_preview:true}')" > /dev/null
