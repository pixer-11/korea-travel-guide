name: check-mailerlite
# Temporary diagnostic: confirms the MAILERLITE_API_TOKEN secret is valid and can
# reach the MailerLite API. Prints only the HTTP status + subscriber COUNT and, on
# failure, a short error message (never the token, never subscriber PII). Remove
# after a successful run.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe MailerLite API and notify Telegram
        env:
          ML: ${{ secrets.MAILERLITE_API_TOKEN }}
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          code=$(curl -s -o /tmp/b.json -w "%{http_code}" \
            -H "Authorization: Bearer $ML" \
            -H "Accept: application/json" \
            "https://connect.mailerlite.com/api/subscribers?limit=1")
          echo "HTTP status: $code"
          if [ "$code" = "200" ]; then
            total=$(grep -o '"total":[0-9]*' /tmp/b.json | head -1 | grep -o '[0-9]*')
            echo "subscriber total: ${total:-0}"
            msg="✅ MailerLite 토큰 정상 작동 — 구독자 조회 성공 (현재 ${total:-0}명). 이제 자동 발송을 연결할 수 있어요."
            ok=1
          else
            echo "error body: $(head -c 200 /tmp/b.json)"
            msg="❌ MailerLite 토큰 확인 실패 (HTTP $code). 토큰 이름(MAILERLITE_API_TOKEN)/값을 다시 확인해주세요."
            ok=0
          fi
          curl -s -X POST "https://api.telegram.org/bot$TG/sendMessage" \
            --data-urlencode "chat_id=$CHAT" \
            --data-urlencode "text=$msg" >/dev/null
          [ "$ok" = "1" ]
