name: Backfill countries to target

# Bulk fill: publishes guides toward TARGET_PER_COUNTRY for every country that is
# still short, until each reaches the target. Once every country is full the
# queue is empty and a run publishes nothing, so it is safe to leave enabled.
#
# It does NOT run every day. The gate below checks whose turn it is
# (scripts/fill-phase.mjs): the daily Places budget fits one bulk job behind the
# daily publish, and this one only starts once the phone/hours backfill has
# reported three consecutive days with nothing left to fill.
#
# It also does not contain a pipeline of its own. It CALLS publish.yml. It used
# to be a parallel copy that generated and committed posts and stopped there —
# no content validation, no itinerary rebuild, no translation audit, and none of
# the follow-up translations (place names, country blurbs, region intros). Every
# guard added to publish.yml simply did not exist on this path, so this job was
# about to publish a batch a day for weeks through the unguarded one. Two copies
# of the same pipeline means the next fix lands in one of them; calling the real
# one is the only arrangement that stays true on its own.
on:
  # Chained to publish, not scheduled — same reason as backfill-details.yml:
  # publish must get the fresh Places window first, and GitHub has delayed the
  # publish cron by over three hours, which would let a fixed-time cron here run
  # first and eat the quota. The old '43 8 * * *' cron is gone for good.
  # CHAINED BEHIND backfill-details, not beside it (2026-08-05). All three
  # Places consumers — this, backfill-details and quality-audit — used to fire
  # on the same publish completion into the same `places-bulk` concurrency
  # group. GitHub does not queue three deep: when a third request arrives, the
  # one already WAITING is cancelled. So one of the three died every single day,
  # silently, and on 2026-08-04 it was backfill-details ("Canceling since a
  # higher priority waiting request for places-bulk exists"). That also meant
  # fill-phase.mjs never recorded a result, which is the counter that hands over
  # to country-fill — the handover could not have happened, ever.
  # Running them nose-to-tail costs a few minutes and cannot cancel anything.
  workflow_run:
    workflows: ['Backfill place details (phone/hours)']
    types: [completed]
  workflow_dispatch:
    inputs:
      count:
        description: 'Max posts this run (50 keeps phone/hours complete — see the ramp note below)'
        required: false
        default: '50'
      target:
        description: 'Guides per country to fill toward'
        required: false
        default: '58'

permissions:
  contents: write

# Shared with backfill-details.yml — see the note there.
concurrency: places-bulk

jobs:
  # Separate job so the whole batch is gated by one condition. No npm ci here:
  # fill-phase.mjs uses only Node built-ins, so the gate costs seconds on the
  # days the answer is "not your turn".
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.phase.outputs.run }}
      count: ${{ steps.phase.outputs.count }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check whose turn it is
        id: phase
        run: |
          PHASE=$(node scripts/fill-phase.mjs get)
          # Batch size comes from the calls that are rationed. A post costs 1 Text
          # Search and exactly 1 Place Details, taken once after the venue is
          # chosen, not per candidate. (This comment used to call Text Search
          # "75k/day — effectively free". On 2026-08-23 Google capped it at ~100
          # a day for this project too, and the 16:19 run spent all of it before
          # this run started — so Text Search is now budgeted in the same ledger,
          # publish 55 / fill 35: scripts/lib/places-budget.mjs.) Measured: 2026-07-27 left ~57 Details of
          # headroom after the 16-post publish, and 2026-07-28's post-publish run
          # spent 21 more with zero 429s. So the window holds ≥73 calls a day and
          # publish only claims 16 of them.
          #
          # The cap is deliberately ABOVE what a slow day can deliver, because
          # the quota enforces itself better than a guess does: on the first 429
          # generate.mjs breaks out of the loop, saves what it published, leaves
          # the unreached targets unmarked and exits 0 — so every step after it
          # (translations, itinerary rebuild, all four validators, the Korean
          # warnings) still runs on a short day exactly as on a full one. A number
          # picked to be safe just leaves budget unspent: 25 stretched the
          # 527-guide backlog from ~9 days to ~3 weeks for nothing.
          #
          # 75 leaves a small margin under the observed ceiling (16 + 75 = 91
          # against ~100) for the odd Places call elsewhere, and on a day the
          # window turns out smaller the run simply stops early.
          #
          # BUT quota is no longer the only ceiling (owner decision 2026-08-02):
          # Google's 2026-03 core update targets sudden publishing-VELOCITY
          # spikes on scaled AI content — monitored sites that jumped output
          # overnight took manual actions up to full de-indexing, and this
          # domain is two months old. So the batch RAMPS instead of jumping:
          # 25/day in week one after the handover, then 35, then 50.
          #
          # 50 is also where the Places quota stops being the binding
          # constraint. Details is hard-capped at 100 calls/day and split
          # publish 40 / backfill 25 / refresh 20 / quality 15. At 50 posts,
          # 40 get their phone and hours immediately and 10 wait one night,
          # which the backfill's 25/day clears easily. At the old ceiling of
          # 75 the arithmetic breaks: 35 posts a day arrive incomplete against
          # a backfill that can only absorb 25, so the gap grows by 10 every
          # day and never closes. Raising publish's share instead would take
          # it from closure detection — the only job that unpublishes a venue
          # that has shut — which is not a trade worth making for speed
          # (measured 2026-08-07). Manual dispatch keeps an explicit override.
          # The ramp above is overridden by data/publish-throttle.json when it sets
          # backfillPerRun to 0 or more (2026-08-27: 0, because Google had stopped
          # fetching us and 5,036 URLs were queued unread - see that file). -1 or a
          # missing file restores the ramp. One switch, read by publish.yml too.
          RAMP=$(node -e "
            const fs=require('fs');
            let t={};try{t=JSON.parse(fs.readFileSync('data/publish-throttle.json','utf8'))}catch{}
            if (typeof t.backfillPerRun === 'number' && t.backfillPerRun >= 0) { console.log(t.backfillPerRun); }
            else {
              let d={};try{d=JSON.parse(fs.readFileSync('data/fill-phase.json','utf8'))}catch{}
              const s=d.switchedAt?Date.parse(d.switchedAt):Date.now();
              const w=Math.floor((Date.now()-s)/(7*864e5));
              console.log([25,35][w] ?? 50);
            }
          ")
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "count=${{ github.event.inputs.count || '50' }}" >> "$GITHUB_OUTPUT"
            echo "run=1" >> "$GITHUB_OUTPUT"          # a person asked for this run
            exit 0
          fi
          echo "count=$RAMP" >> "$GITHUB_OUTPUT"
          # A throttled-to-zero run must not proceed: generate.mjs with a target of 0
          # would still spend Places queries deciding it has nothing to do.
          if [ "$RAMP" = "0" ]; then
            echo "run=0" >> "$GITHUB_OUTPUT"
            echo "대량발행이 잠시 꺼져 있습니다 (data/publish-throttle.json). 구글이 이미 쌓인 URL을 다 읽을 때까지입니다."
            exit 0
          fi
          # The upstream is now backfill-details, not publish (see the header).
          # 'skipped' is a normal outcome there — its gate can decide it is not
          # this phase's turn — and must NOT block the country fill, which was
          # the whole point of moving the trigger. Only a genuine failure, which
          # can leave the repo mid-change, is worth standing down for.
          if [ "${{ github.event.workflow_run.conclusion }}" = "failure" ] || [ "${{ github.event.workflow_run.conclusion }}" = "cancelled" ]; then
            echo "run=0" >> "$GITHUB_OUTPUT"
            echo "앞 단계(전화·영업시간 채우기)가 실패해서 이번 대량발행은 건너뜁니다."
          elif [ "$PHASE" != "country" ]; then
            echo "run=0" >> "$GITHUB_OUTPUT"
            echo "단계가 '$PHASE' 이므로 건너뜁니다 (전화·영업시간 채우기가 아직 진행 중)."
          else
            echo "run=1" >> "$GITHUB_OUTPUT"
          fi

  # The real pipeline: generate → translate (posts, place names, country blurbs,
  # region intros) → rebuild itineraries → re-sync leg distances → commit →
  # validate content, itineraries and translation language → Korean warnings.
  fill:
    needs: gate
    if: needs.gate.outputs.run == '1'
    uses: ./.github/workflows/publish.yml
    with:
      count: ${{ needs.gate.outputs.count }}
      target: '58'
      label: Backfill
    secrets: inherit
