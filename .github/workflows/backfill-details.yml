name: Backfill place details (phone/hours)

# Retro-fills reservation phone + openingHours on EXISTING posts (1 Places
# Details call per post; script skips posts that already have both, stops at
# --limit). i18n pages read place data from the EN frontmatter, so filling EN
# serves all 5 languages.
#
# CHAINED to the publish workflow rather than run on its own cron: publish must
# always get the fresh Places window first, and GitHub delays scheduled runs by
# hours under load (2026-07-27: publish's 16:19 KST cron actually fired at 19:52
# KST — a fixed 17:05 backfill cron would have run FIRST and eaten the quota,
# the exact starvation this ordering exists to prevent). workflow_run fires only
# after publish finishes, so the order holds no matter how late publish starts.
# Once the backlog is filled the runs turn into cheap near-no-ops; drop the
# trigger at that point (venues with no listed phone/hours get re-checked daily).
on:
  workflow_run:
    workflows: ['Auto-generate & publish posts']
    types: [completed]
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max posts to process this run (1 Details call each; 429-safe)'
        required: false
        default: '80'
      slugs:
        description: 'Comma-separated post ids (filename minus .md) to target — leave blank for all, alphabetical'
        required: false
        default: ''
  # No gh CLI on the dev box: committing data/backfill-trigger runs this on demand.
  # Needed because itinerary pages surface closed-day warnings from openingHours,
  # so a stop without hours silently loses the feature's headline differentiator.
  # The trigger file's FIRST line, when non-empty and not a '#' comment, is the
  # comma-separated slug list passed to --slugs= — same precision-targeting idea
  # as data/geocode-trigger's region line in geocode-placeless.yml.
  push:
    branches: [main]
    paths: ['data/backfill-trigger']

permissions:
  contents: write

# Shared with backfill.yml: both chain off the same publish run, so on the day
# the phase flips they would otherwise start together and spend the same Places
# budget twice. Queued, not cancelled (cancel-in-progress defaults to false), so
# the second one waits rather than being thrown away.
concurrency: places-bulk

jobs:
  # Separate gate job: one condition for the whole batch instead of an `if:` on
  # every step, where the one that gets forgotten produces an empty run that
  # still commits and still announces itself. fill-phase.mjs needs no deps, so
  # this costs seconds on the days the answer is "not your turn".
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.phase.outputs.run }}
      limit: ${{ steps.phase.outputs.limit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check whose turn it is
        id: phase
        run: |
          PHASE=$(node scripts/fill-phase.mjs get)
          # A manual dispatch or a trigger-file push is a person asking for this
          # run; only the daily chain defers to whose turn it is.
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"
            echo "limit=80" >> "$GITHUB_OUTPUT"
          elif [ "$PHASE" != "details" ]; then
            # The country phase used to skip this entirely — but bulk publishing
            # ADDS 25-75 small venues a day, exactly the posts whose phone/hours
            # Google lists late, so pausing the top-up for the 3-4 week fill
            # would pile up the very debt the handover said was paid (owner
            # caught it 2026-08-02). Run small instead: 25 keeps the top-up
            # alive while leaving Details quota for the bulk batch; on a tight
            # day the 429 guard no-ops gracefully like everywhere else.
            echo "run=1" >> "$GITHUB_OUTPUT"
            echo "limit=25" >> "$GITHUB_OUTPUT"
            echo "단계가 '$PHASE' — 신규 글 보충용 소량(25편)으로 계속 돕니다."
          else
            echo "run=1" >> "$GITHUB_OUTPUT"
            echo "limit=80" >> "$GITHUB_OUTPUT"
          fi

  details:
    needs: gate
    if: needs.gate.outputs.run == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Backfill phone/openingHours (quota-capped)
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          SLUGS="${{ github.event.inputs.slugs }}"
          # push-trigger path: the slug list comes from the trigger file's first
          # line, unless it's empty or a '#' comment (same convention as
          # data/geocode-trigger in geocode-placeless.yml).
          if [ -z "$SLUGS" ] && [ "${{ github.event_name }}" = "push" ] && [ -f data/backfill-trigger ]; then
            FIRST_LINE=$(head -1 data/backfill-trigger | tr -d '\r')
            case "$FIRST_LINE" in
              ''|'#'*) : ;;
              *) SLUGS="$FIRST_LINE" ;;
            esac
          fi
          args=(--apply --limit "${{ github.event.inputs.limit || needs.gate.outputs.limit || '80' }}")
          if [ -n "$SLUGS" ]; then args+=("--slugs=$SLUGS"); fi
          # pipefail: without it the pipeline's exit status is tee's, so a
          # crashed node (e.g. a missing import) reports SUCCESS with an empty
          # log. 2>&1 puts the crash reason in the committed log, since Actions
          # logs need auth to read (this exact failure mode already happened
          # once on the sibling geocode-placeless.yml workflow).
          set -o pipefail
          node scripts/backfill-place-details.mjs "${args[@]}" 2>&1 | tee /tmp/bf.log

      # The dev box has no gh CLI and Actions logs need auth, so the run's
      # BACKFILL RESULT line (and any per-post detail) is committed as an
      # artifact file for review — same pattern as data/logs/geocode-last-run.txt.
      # MUST be .txt, not .log: .gitignore ignores *.log.
      - name: Save backfill log to repo
        run: |
          mkdir -p data/logs
          cp /tmp/bf.log data/logs/backfill-last-run.txt

      # Records what this run achieved and, after three consecutive empty days,
      # hands the daily quota to country-fill. Only scheduled (chained) runs
      # count: a manual dispatch is someone poking at it, not evidence about the
      # backlog, and letting it move the streak would make the handover depend on
      # who ran what by hand.
      - name: Record progress (may hand over to country-fill)
        id: phaserec
        if: github.event_name == 'workflow_run'
        run: |
          UPDATED=$(grep -o 'updated [0-9]\+' /tmp/bf.log | head -1 | grep -o '[0-9]\+' || true)
          # Backlog fills only (posts older than 48h): the handover streak counts
          # THESE — daily publishing tops up its own fresh posts forever, and
          # counting that trickle postponed the country-fill switch indefinitely
          # (owner caught it 2026-08-02: 9 fills, all from that day's 20 posts).
          BACKLOG=$(grep -o 'backlog-updated [0-9]\+' /tmp/bf.log | head -1 | grep -o '[0-9]\+' || true)
          OUT=$(node scripts/fill-phase.mjs record --updated "$UPDATED" --backlog "${BACKLOG:-$UPDATED}")
          echo "$OUT"
          if printf '%s' "$OUT" | grep -q '^HANDOVER'; then
            echo "handover=1" >> "$GITHUB_OUTPUT"
            printf '%s' "$OUT" | tail -n +2 > /tmp/handover.txt
          fi

      # Hours arriving from Google can contradict prose that was written before
      # the venue had any. Chola Cafe (Little India) was published on 07-23 with
      # no openingHours and advice to arrive at 11:30am; this job filled in
      # 12:10pm–midnight on 08-14, and the article was left recommending a time
      # the kitchen is shut. The auditor noticed the same evening — but the
      # FIXER only ran in the weekly refresh, so the contradiction was a warning
      # the owner would relay for up to six more days.
      #
      # Scoped to what this run touched: a pre-existing contradiction elsewhere
      # is the weekly refresh's job, and rewriting posts this run never opened
      # would put an LLM near articles nothing here changed. Runs BEFORE the
      # commit, so the repair ships with the hours that caused it rather than
      # dying with the runner.
      - name: Correct prose the new hours contradict
        if: always()
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          CHANGED=$(git diff --name-only -- src/content/posts \
            | sed 's|^src/content/posts/||;s|\.md$||' | paste -sd, -)
          if [ -z "$CHANGED" ]; then
            echo "no posts touched by this run — nothing to check"
          else
            node scripts/fix-hours-claims.mjs --only="$CHANGED" 2>&1 | tail -20
          fi

      - name: Commit updated posts
        id: commit
        run: |
          git config user.name "content-bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/content/posts data/logs/backfill-last-run.txt data/fill-phase.json data/places-budget.json
          summary=$(tail -1 /tmp/bf.log)
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          if git diff --staged --quiet; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
          else
            echo "changed=1" >> "$GITHUB_OUTPUT"
            git commit -m "content: backfill phone/openingHours ($(date -u +%Y-%m-%d))"
            bash scripts/git-push-retry.sh
          fi

      - name: Notify Telegram (Korean)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUMMARY: ${{ steps.commit.outputs.summary }}
          CHANGED: ${{ steps.commit.outputs.changed }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            if [ "$CHANGED" = "1" ]; then head="📞 전화·영업시간 채우기 완료"; else head="📞 전화·영업시간 채우기 — 오늘은 새로 채울 것 없음"; fi
          else
            head="⚠️ 전화·영업시간 채우기 실패 — 로그 확인 필요"
          fi
          # The handover is the one thing here the owner must not miss: tomorrow's
          # automation does something different because of it.
          if [ -f /tmp/handover.txt ]; then
            head="$(printf '🔄 작업 전환 안내\n%s\n\n%s' "$(cat /tmp/handover.txt)" "$head")"
          fi
          # printf builds the line break — a literal newline inside this block
          # scalar would have to start at column 0, which ENDS the scalar and
          # makes the whole workflow file invalid YAML (that is exactly what
          # broke the first two runs of this workflow).
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="$(printf '%s\n결과: %s' "$head" "$(node scripts/ko-report.mjs --stat "${SUMMARY:-}")")" > /dev/null
