name: Backfill place details (phone/hours)

# Retro-fills reservation phone + openingHours on EXISTING posts (1 Places
# Details call per post; script skips posts that already have both, stops at
# --limit). i18n pages read place data from the EN frontmatter, so filling EN
# serves all 5 languages.
#
# CHAINED to the publish workflow rather than run on its own cron: publish must
# always get the fresh Places window first, and GitHub delays scheduled runs by
# hours under load (2026-07-27: publish's 16:19 KST cron actually fired at 19:52
# KST — a fixed 17:05 backfill cron would have run FIRST and eaten the quota,
# the exact starvation this ordering exists to prevent). workflow_run fires only
# after publish finishes, so the order holds no matter how late publish starts.
# Once the backlog is filled the runs turn into cheap near-no-ops; drop the
# trigger at that point (venues with no listed phone/hours get re-checked daily).
on:
  workflow_run:
    workflows: ['Auto-generate & publish posts']
    types: [completed]
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max posts to process this run (1 Details call each; 429-safe)'
        required: false
        default: '80'
      slugs:
        description: 'Comma-separated post ids (filename minus .md) to target — leave blank for all, alphabetical'
        required: false
        default: ''
  # No gh CLI on the dev box: committing data/backfill-trigger runs this on demand.
  # Needed because itinerary pages surface closed-day warnings from openingHours,
  # so a stop without hours silently loses the feature's headline differentiator.
  # The trigger file's FIRST line, when non-empty and not a '#' comment, is the
  # comma-separated slug list passed to --slugs= — same precision-targeting idea
  # as data/geocode-trigger's region line in geocode-placeless.yml.
  push:
    branches: [main]
    paths: ['data/backfill-trigger']

permissions:
  contents: write

concurrency: backfill-details

jobs:
  details:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Backfill phone/openingHours (quota-capped)
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          SLUGS="${{ github.event.inputs.slugs }}"
          # Trigger-file path: the slug list comes from the file's first line,
          # unless it's empty or a '#' comment (same convention as
          # data/geocode-trigger in geocode-placeless.yml). Read on the CHAINED
          # run too, not just on push: a push lands whenever the dev box commits,
          # which can be mid-day with the Places quota already drained (that is
          # exactly how the 2026-07-28 11:30 KST run filled zero posts). The
          # chained run is the one that lands right after the daily reset, so the
          # targeted list has to ride along with it or it never gets a good
          # window. The retire step below clears the line once it completes
          # without a 429, so the next chained run returns to the backlog.
          if [ -z "$SLUGS" ] && [ -f data/backfill-trigger ]; then
            FIRST_LINE=$(head -1 data/backfill-trigger | tr -d '\r')
            case "$FIRST_LINE" in
              ''|'#'*) : ;;
              *) SLUGS="$FIRST_LINE" ;;
            esac
          fi
          args=(--apply --limit "${{ github.event.inputs.limit || '80' }}")
          if [ -n "$SLUGS" ]; then args+=("--slugs=$SLUGS"); fi
          # pipefail: without it the pipeline's exit status is tee's, so a
          # crashed node (e.g. a missing import) reports SUCCESS with an empty
          # log. 2>&1 puts the crash reason in the committed log, since Actions
          # logs need auth to read (this exact failure mode already happened
          # once on the sibling geocode-placeless.yml workflow).
          set -o pipefail
          node scripts/backfill-place-details.mjs "${args[@]}" 2>&1 | tee /tmp/bf.log

      # The dev box has no gh CLI and Actions logs need auth, so the run's
      # BACKFILL RESULT line (and any per-post detail) is committed as an
      # artifact file for review — same pattern as data/logs/geocode-last-run.txt.
      # MUST be .txt, not .log: .gitignore ignores *.log.
      - name: Save backfill log to repo
        run: |
          mkdir -p data/logs
          cp /tmp/bf.log data/logs/backfill-last-run.txt

      # One-shot semantics for the targeted list: comment out the slug line once
      # the run got through it with ZERO failures of either kind — every listed
      # post got a real answer from Places (hours filled, or genuinely none
      # published). A run that hit the quota (429) or a key/permission problem
      # (api-error) leaves the line intact so the next chained run retries it;
      # an api-error run needs a human fix, and retiring the list would bury it.
      # Committed with GITHUB_TOKEN, which by design does NOT re-trigger this
      # workflow's own push filter — no loop.
      - name: Retire trigger line once its slugs are done
        run: |
          if [ -f data/backfill-trigger ] && grep -q 'quota-429 0, api-error 0' /tmp/bf.log; then
            FIRST_LINE=$(head -1 data/backfill-trigger | tr -d '\r')
            case "$FIRST_LINE" in
              ''|'#'*) : ;;
              *) sed -i "1s|^|# done $(date -u +%Y-%m-%d): |" data/backfill-trigger
                 echo "trigger retired" ;;
            esac
          fi

      - name: Commit updated posts
        id: commit
        run: |
          git config user.name "content-bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/content/posts data/logs/backfill-last-run.txt data/backfill-trigger
          summary=$(tail -1 /tmp/bf.log)
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          if git diff --staged --quiet; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
          else
            echo "changed=1" >> "$GITHUB_OUTPUT"
            git commit -m "content: backfill phone/openingHours ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main
            git push
          fi

      - name: Notify Telegram (Korean)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUMMARY: ${{ steps.commit.outputs.summary }}
          CHANGED: ${{ steps.commit.outputs.changed }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            if [ "$CHANGED" = "1" ]; then head="📞 전화·영업시간 채우기 완료"; else head="📞 전화·영업시간 채우기 — 오늘은 새로 채울 것 없음"; fi
          else
            head="⚠️ 전화·영업시간 채우기 실패 — 로그 확인 필요"
          fi
          # printf builds the line break — a literal newline inside this block
          # scalar would have to start at column 0, which ENDS the scalar and
          # makes the whole workflow file invalid YAML (that is exactly what
          # broke the first two runs of this workflow).
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="$(printf '%s\n결과: %s' "$head" "${SUMMARY:-—}")" > /dev/null
