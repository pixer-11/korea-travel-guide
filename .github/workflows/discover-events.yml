name: Discover current events (web search)

# Twice a week: web-search each active country for big upcoming events (concerts,
# sports, festivals, exhibitions) and publish timely guides for new ones.
# 주 2회(2026-09-28, 픽서님 승인): 최근 30일 실제 방문자 기준 행사 글은 1편당
# 0.90명으로 장소 글(0.22~0.28)의 3~4배인데, 발굴이 주 1회라 14일 새 글 316편 중
# 행사는 40편(13%)뿐이었다. 이미 다룬 행사는 생성 전에 건너뛰므로 중복은 안 생긴다.
on:
  schedule:
    - cron: '37 20 * * 3' # Wednesdays 20:37 UTC (off the hour)
    - cron: '37 20 * * 0' # Sundays 20:37 UTC = 월요일 05:37 KST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Every Claude call from here on is counted by scripts/lib/claude-meter.mjs
      # (each file that uses the SDK imports it; a test fails the build if one
      # forgets) and lands in this ledger as the process exits. Added 2026-09-25:
      # until then "what did the model switch cost?" had no answer short of the
      # bill. Not NODE_OPTIONS - GitHub refuses it in $GITHUB_ENV.
      - name: Name the Claude cost ledger
        run: |
          echo "CLAUDE_COST_LEDGER=$GITHUB_WORKSPACE/data/claude-cost.jsonl" >> "$GITHUB_ENV"
          echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"

      - name: Discover & write events
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          EVENTS_PER_COUNTRY: '4'
        run: node scripts/discover-events.mjs

      # Translate the new event guides into ko/ja/es/zh before committing (events
      # are posts too). Resumable + continue-on-error — see publish.yml.
      - name: Translate new events (ko/ja/es/zh)
        id: translate
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRANSLATE_CONCURRENCY: '8'
        # The batch (half price) gets whatever the 6-hour job limit can spare,
        # not a fixed 120 min. 2026-10-01: discovery took 88 min, the 216-request
        # batch was still running at 120 min, got cancelled, and every
        # translation went direct at full price (~$19 instead of ~$9.5). Nobody
        # waits on these posts. Reserved out of the 360: 30 min for collecting a
        # cancelled batch (claude-batch.mjs) and 70 for the direct fallback
        # (216 jobs took 22 min at concurrency 8) plus the steps after this one.
        # Too little left for a batch to be worth it -> skip it and go direct,
        # rather than run past the job limit.
        run: |
          ELAPSED=$(( ($(date +%s) - JOB_T0) / 60 ))
          WAIT=$(( 360 - 30 - 70 - ELAPSED ))
          if [ "$WAIT" -lt 30 ]; then
            echo "batch skipped: job at ${ELAPSED} min, only ${WAIT} min to spare"
            TRANSLATE_BATCH=0 node scripts/translate-posts.mjs 2>&1 | tee /tmp/translate.log
          else
            echo "batch wait budget: ${WAIT} min (job at ${ELAPSED} min)"
            TRANSLATE_BATCH_WAIT_MIN=$WAIT node scripts/translate-posts.mjs 2>&1 | tee /tmp/translate.log
          fi

      # The step above is continue-on-error, and until 2026-10-05 nothing said
      # when it failed: that morning the prepaid API credit ran out mid-run, three
      # translations were lost, and no message went anywhere. The next publish
      # re-queues them — but only once there is credit again, so say which wall
      # it was. Same wording as publish.yml's soft-fail note.
      - name: Warn on translation failures
        if: steps.translate.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          SUM=$(grep -ho "TRANSLATE_SUMMARY.*" /tmp/translate.log 2>/dev/null | tail -1)
          if grep -q "credit balance is too low" /tmp/translate.log 2>/dev/null; then
            WHY='원인: Anthropic API 선불 크레딧이 바닥났습니다. 저절로 풀리지 않으니 콘솔 Plans & Billing에서 충전(또는 자동 충전 켜기)해 주세요. 충전 뒤 다음 발행이 빠진 번역을 채웁니다.'
          elif grep -q "reached your specified API usage limits" /tmp/translate.log 2>/dev/null; then
            WHY='원인: Anthropic API 월 사용 한도에 도달했습니다. 한도가 풀리면 다음 실행이 자동으로 채웁니다.'
          else
            # A few gate refusals are the gate working (publish.yml stays quiet
            # about those too); the next publish retries them. Only a pile is news.
            FAILED=$(echo "$SUM" | grep -o "failed=[0-9]*" | cut -d= -f2)
            [ "${FAILED:-0}" -lt 5 ] && { echo "translate: ${FAILED:-0} failure(s), below the alert floor"; exit 0; }
            WHY='빠진 번역은 다음 발행(16:19)이 다시 시도합니다. 같은 경고가 이틀 연속이면 확인이 필요합니다.'
          fi
          TXT=$(printf '⚠️ 행사 발굴: 번역 일부 실패\n%s\n\n%s' "${SUM:-요약 없음}" "$WHY")
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$TXT" >/dev/null || true

      - name: Build hero photo-wall thumbnails
        run: node scripts/build-wall.mjs

      # Same gate publish.yml runs, same position: BEFORE the commit. This
      # workflow pushes to main on its own, and the night it was left ungated it
      # published four posts whose hero was the placeholder SVG — the exact
      # defect the gate quarantines. Every path that commits posts needs the
      # gate, or the gate is a fence with one panel missing.
      - name: Hold back defective posts (publish gate)
        id: gate
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/gate-new-posts.mjs --since=HEAD 2>&1 | tee /tmp/gate.log

      - name: Report held-back posts (Korean)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          grep -q 'HELD BACK' /tmp/gate.log 2>/dev/null || exit 0
          BODY=$(sed -n '/HELD BACK/,$p' /tmp/gate.log | node scripts/tg-clip.mjs 60)
          TXT=$(printf '🚧 문제가 있는 이벤트 글을 발행 직전에 걸러냈습니다\n%s' "$BODY")
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$TXT" >/dev/null || true

      # Only when the gate itself ran to completion — the same condition
      # publish.yml has carried since 2026-09-02 and this workflow never got.
      # continue-on-error above keeps a HELD post from failing the run (the gate
      # exits 0 for holds), so a non-success outcome here means one thing:
      # GATE-CHECKER-CRASHED, nothing was checked. Committing then is committing
      # an unchecked batch, which is exactly what the comment above the gate
      # calls "a fence with one panel missing". Event guides are this site's
      # highest-yield page type, so this is the last path that should ship
      # unchecked.
      - name: Commit new events
        if: steps.gate.outcome == 'success'
        run: |
          git config user.name "content-bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/content/posts src/content/i18n data/published.json public/wall data/wall.json
          if git diff --staged --quiet; then
            echo "No new events this run."
            exit 0
          fi
          git commit -m "content: discovered current events ($(date -u +%Y-%m-%d))"
          # This long-running job races with the daily-publish / venue-photo jobs and
          # manual pushes, so main often moves before we push. Rebase onto the latest
          # main (keeping our freshly generated files on the wholesale-regenerated JSON
          # via -X theirs) and retry with backoff.
          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            # --autostash is load-bearing: this job writes files it deliberately
            # does NOT stage (only the five paths above are committed), and
            # rebase refuses to start over any unstaged change — so all five
            # attempts failed identically on 2026-08-13 ("cannot rebase: You
            # have unstaged changes"). scripts/git-push-retry.sh learned this
            # on 08-04; this inline copy (kept for its -X theirs strategy on
            # wholesale-regenerated JSON) never got the fix. Same lesson as the
            # essentials translator tonight: a private copy of shared plumbing
            # is where a fixed bug goes to live on.
            if git rebase --autostash -X theirs origin/main; then
              if git push origin HEAD:main; then pushed=1; break; fi
            else
              git rebase --abort || true
            fi
            echo "Push attempt $attempt failed; syncing and retrying…"
            sleep $((attempt * 5))
          done
          if [ "$pushed" != 1 ]; then echo "Could not push after retries"; exit 1; fi

      # Measure the new events' hero widths now, not at the nightly scan. A
      # region whose only guide is a just-published event shared that event's
      # photo as og:image until the night's probe — 768px, 968px and 319px
      # heroes on Gurugram, Pushkar and Surin (10-05), Oaxaca the night
      # before. pickOgPhoto skips a hero only once it is MEASURED narrow. The
      # scan probes only posts it has not seen, so this costs a few requests.
      - name: Measure new hero widths
        if: steps.gate.outcome == 'success'
        continue-on-error: true
        run: |
          node scripts/scan-hero-widths.mjs | tail -5
          git config user.name "content-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/hero-width-queue.json data/visual-audit.json src/content/posts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: hero widths of new events ($(date -u +%Y-%m-%d))"
          bash scripts/git-push-retry.sh

      # Committed last and on its own: Claude calls keep happening after the main
      # commit step (repairs, translations), and a runner forgets everything.
      - name: Commit the Claude cost ledger
        if: always()
        run: |
          [ -f data/claude-cost.jsonl ] || exit 0
          git config user.name "content-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/claude-cost.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: claude cost ledger ($(date -u +%Y-%m-%d))"
          bash scripts/git-push-retry.sh

      - name: Validate content integrity
        id: validate
        continue-on-error: true
        # This run reports and repairs nothing. An event that ended yesterday
        # (UTC) is publish.yml's to repair at 07:19 UTC, after which that job
        # alerts on whatever is left — see ENDED_GRACE_DAYS in validate-content.
        env:
          ENDED_GRACE_DAYS: 1
        run: node scripts/validate-content.mjs

      - name: Warn on content issues
        if: steps.validate.outcome == 'failure'
        env:
          ENDED_GRACE_DAYS: 1
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          # `|| true`: don't let set -e/pipefail abort this warn step (validate
          # exits 1 by design) before the curl fires.
          MSG=$(node scripts/ko-report.mjs scripts/validate-content.mjs 2>&1 | node scripts/tg-clip.mjs 25 || true)
          TXT=$(printf '⚠️ 콘텐츠 검증 경고 (이벤트 발굴)\n%s' "$MSG")
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$TXT" >/dev/null || true
