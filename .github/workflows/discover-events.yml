name: Discover current events (web search)

# Weekly: web-search each active country for big upcoming events (concerts,
# sports, festivals, exhibitions) and publish timely guides for new ones.
on:
  schedule:
    - cron: '37 20 * * 3' # Wednesdays 20:37 UTC (off the hour)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Discover & write events
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          EVENTS_PER_COUNTRY: '2'
        run: node scripts/discover-events.mjs

      # Translate the new event guides into ko/ja/es/zh before committing (events
      # are posts too). Resumable + continue-on-error — see publish.yml.
      - name: Translate new events (ko/ja/es/zh)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRANSLATE_CONCURRENCY: '8'
        run: node scripts/translate-posts.mjs

      - name: Build hero photo-wall thumbnails
        run: node scripts/build-wall.mjs

      # Same gate publish.yml runs, same position: BEFORE the commit. This
      # workflow pushes to main on its own, and the night it was left ungated it
      # published four posts whose hero was the placeholder SVG — the exact
      # defect the gate quarantines. Every path that commits posts needs the
      # gate, or the gate is a fence with one panel missing.
      - name: Hold back defective posts (publish gate)
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/gate-new-posts.mjs --since=HEAD 2>&1 | tee /tmp/gate.log

      - name: Report held-back posts (Korean)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          grep -q 'HELD BACK' /tmp/gate.log 2>/dev/null || exit 0
          BODY=$(sed -n '/HELD BACK/,$p' /tmp/gate.log | head -30)
          TXT=$(printf '🚧 문제가 있는 이벤트 글을 발행 직전에 걸러냈습니다\n%s' "$BODY")
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$TXT" >/dev/null || true

      - name: Commit new events
        run: |
          git config user.name "content-bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/content/posts src/content/i18n data/published.json public/wall data/wall.json
          if git diff --staged --quiet; then
            echo "No new events this run."
            exit 0
          fi
          git commit -m "content: discovered current events ($(date -u +%Y-%m-%d))"
          # This long-running job races with the daily-publish / venue-photo jobs and
          # manual pushes, so main often moves before we push. Rebase onto the latest
          # main (keeping our freshly generated files on the wholesale-regenerated JSON
          # via -X theirs) and retry with backoff.
          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            # --autostash is load-bearing: this job writes files it deliberately
            # does NOT stage (only the five paths above are committed), and
            # rebase refuses to start over any unstaged change — so all five
            # attempts failed identically on 2026-08-13 ("cannot rebase: You
            # have unstaged changes"). scripts/git-push-retry.sh learned this
            # on 08-04; this inline copy (kept for its -X theirs strategy on
            # wholesale-regenerated JSON) never got the fix. Same lesson as the
            # essentials translator tonight: a private copy of shared plumbing
            # is where a fixed bug goes to live on.
            if git rebase --autostash -X theirs origin/main; then
              if git push origin HEAD:main; then pushed=1; break; fi
            else
              git rebase --abort || true
            fi
            echo "Push attempt $attempt failed; syncing and retrying…"
            sleep $((attempt * 5))
          done
          if [ "$pushed" != 1 ]; then echo "Could not push after retries"; exit 1; fi

      - name: Validate content integrity
        id: validate
        continue-on-error: true
        run: node scripts/validate-content.mjs

      - name: Warn on content issues
        if: steps.validate.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          # `|| true`: don't let set -e/pipefail abort this warn step (validate
          # exits 1 by design) before the curl fires.
          MSG=$(node scripts/ko-report.mjs scripts/validate-content.mjs 2>&1 | head -25 || true)
          TXT=$(printf '⚠️ 콘텐츠 검증 경고 (이벤트 발굴)\n%s' "$MSG")
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$TXT" >/dev/null || true
