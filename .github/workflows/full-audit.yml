name: Weekly full content audit

# Every live post, two AI passes (vision on the hero, editor on the body).
# Results commit to data/full-audit.json — the daily photo patrol reads the
# image failures, and the Korean Telegram summary reports new problem classes.
# This is the "AI reads/looks at everything weekly" guarantee.
on:
  schedule:
    - cron: '35 18 * * 6' # Sat 18:35 UTC = Sun 03:35 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Full audit (vision + editor)
        id: audit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CONCURRENCY: '6'
          # Ceiling on model calls per run. The audit is incremental (unchanged
          # posts keep their prior verdict), so in steady state this is barely
          # touched — a week's new and edited posts, ~70. It matters on the
          # first run after this change, when the store is empty and every post
          # looks new: the cap spreads that one-time seeding across a few weeks
          # instead of billing it in a single Sunday. Newest posts go first.
          LIMIT: '400'
        run: |
          set -o pipefail
          node scripts/full-content-audit.mjs | tee /tmp/audit.log
          set +e
          set +o pipefail
          s=$(awk '/AUDIT DONE/ {print}' /tmp/audit.log | tail -1)
          echo "img=$(echo "$s" | awk -F'image FAIL ' '{print $2+0}')" >> "$GITHUB_OUTPUT"
          echo "prose=$(echo "$s" | awk -F'prose issues ' '{print $2+0}')" >> "$GITHUB_OUTPUT"
          # How many posts were actually examined. The summary line has always
          # carried it and nothing read it — so "✅ 전 글 무결" was printed from two
          # counters that read zero whether the audit found nothing or LOOKED at
          # nothing. That is exactly the shape that let the link check report a
          # perfect site every week while scanning zero links (found 2026-08-05).
          posts=$(echo "$s" | awk -F'— ' '{print $2+0}')
          echo "posts=$posts" >> "$GITHUB_OUTPUT"
          if [ "${posts:-0}" -lt 1 ]; then
            echo "::error::audit examined $posts post(s) — it is not reading the content"
            exit 1
          fi
          true

      - name: Commit audit data
        run: |
          git config user.name "content-bot"
          git config user.email "bot@users.noreply.github.com"
          # full-audit-seen.json is the memory that makes the audit incremental.
          # It was never staged, so every weekly runner started from a six-entry
          # file, re-audited the same newest 400 posts and never reached the
          # other 970 (2026-09-02).
          git add data/full-audit.json data/full-audit-seen.json
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "data: weekly full content audit ($(date -u +%Y-%m-%d))"
            bash scripts/git-push-retry.sh
          fi

      # The Telegram line has promised "문장 수정 배치 대상" since day one, but
      # no schedule ever ran the batch — repair-prose.mjs existed and nothing
      # called it (owner received a 163-post count with no fixer behind it,
      # 2026-08-09). The audit's findings are the work queue; run it here,
      # gated by the same validators the publish pipeline trusts.
      - name: Repair flagged prose
        id: repair
        if: steps.audit.outputs.prose != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          # Cap per week. On 08-15 an uncapped run rewrote 240 posts in one
          # night and re-queued ~960 translations behind them. With the auditor
          # and writer now reading the same venue record the queue should be
          # small; if it ever isn't, a cap turns a runaway bill into a page.
          node scripts/repair-prose.mjs --limit 60 | tee /tmp/repair.log
          set +o pipefail
          fixed=$(awk -F'repaired=' '/PROSE_REPAIR_SUMMARY/ {print $2+0}' /tmp/repair.log | tail -1)
          echo "fixed=${fixed:-0}" >> "$GITHUB_OUTPUT"

      - name: Validate and commit repairs
        if: steps.audit.outputs.prose != '0'
        run: |
          # The gate is SCOPED to what the repair touched. Two weeks running
          # (08-15: 240 repairs, 08-22: 60) the whole batch was thrown away
          # because the site-wide validator flagged something the repair had
          # nothing to do with — card thumbnails not yet built for heroes
          # attached hours earlier, a duplicate event pair — and the money
          # spent on the rewrites was spent again the next week. Now: the
          # thumbnails are built here (same as every other job that touches
          # heroes), the validator runs over the whole site for the record,
          # and only a repaired file the validator names is reverted; the
          # rest of the batch is committed. Unrelated site-wide findings are
          # the daily jobs' business and are reported, not used as a veto.
          node scripts/build-wall.mjs || echo "build-wall: some thumbnails could not be fetched (Commons throttling) — the daily jobs rebuild them"
          set +e
          node scripts/validate-content.mjs > /tmp/validate.log 2>&1
          vrc=$?
          node scripts/audit-translations.mjs > /tmp/translations.log 2>&1
          trc=$?
          set -e
          cat /tmp/validate.log
          tail -n 20 /tmp/translations.log
          echo "validate-content exit=$vrc · audit-translations exit=$trc (site-wide findings are reported here, not used as a veto)"
          # An EMPTY log is a crashed validator, not a clean site — then nothing
          # below can be trusted and the batch must not be committed blind.
          [ -s /tmp/validate.log ] || { echo "validate-content produced no output — aborting before commit"; exit 1; }
          [ -s /tmp/translations.log ] || { echo "audit-translations produced no output — aborting before commit"; exit 1; }
          reverted=0
          for path in $(git diff --name-only -- src/content); do
            f=$(basename "$path")
            if grep -qF "$f" /tmp/validate.log; then
              echo "↩︎ $f — the validator flags this repaired file; reverting it (the rest of the batch stays)"
              git checkout -- "$path"
              reverted=$((reverted+1))
            fi
          done
          echo "reverted=$reverted"
          git add src/content data/full-audit.json data/full-audit-seen.json public/wall data/wall.json
          if git diff --staged --quiet; then
            echo "No repairs to commit."
          else
            git commit -m "fix: weekly prose repair batch ($(date -u +%Y-%m-%d))"
            bash scripts/git-push-retry.sh
          fi

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          IMG: ${{ steps.audit.outputs.img }}
          PROSE: ${{ steps.audit.outputs.prose }}
          POSTS: ${{ steps.audit.outputs.posts }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          {
            echo "🔍 Wander Atlas — 주간 전수 감사 (전 글 AI 검사)"
            if [ "$JOB_STATUS" != "success" ]; then
              echo "❌ 감사 실행 실패 — GitHub Actions 로그 확인 필요."
            else
              echo "🖼️ 사진 불합격: ${IMG:-0}편 → 내일 새벽 자동 교체 시도"
              echo "✍️ 본문 지적: ${PROSE:-0}편 → 문장 수정 배치 대상"
              if [ "${IMG:-0}" = "0" ] && [ "${PROSE:-0}" = "0" ]; then
                echo "✅ 검사한 ${POSTS:-0}편 전부 무결 상태입니다."
              fi
            fi
          } > /tmp/msg.txt
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode "text@/tmp/msg.txt" >/dev/null || true
