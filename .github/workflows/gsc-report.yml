name: gsc-report
# Weekly Google Search Console digest → Korean Telegram. Surfaces the "near-miss"
# queries (page 2) that are the highest-leverage list for improving rankings, and
# then the cohort watch: whether the pages that WERE earning impressions still are.
# Both run in one job — same secrets, same runner, one weekly wake-up.
# Skips itself cleanly until the owner adds the two secrets.
on:
  schedule:
    - cron: '23 22 * * 0'   # Mondays 07:23 KST (Sun 22:23 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '20' }
      - run: node scripts/gsc-report.mjs
        env: &gsc
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # Posts to Telegram only when the cohort actually falls — a weekly "all fine"
      # message would train the owner to stop reading the channel.
      - run: node scripts/audit-impression-cohort.mjs
        env: *gsc

      # The ledger is the point: a few months of these turn the alarm thresholds
      # from one observation into a measured baseline.
      - name: commit the two gsc ledgers
        run: |
          git config user.name  "content-bot"
          git config user.email "bot@users.noreply.github.com"
          # Absent only if the script bailed on a missing secret; adding it then
          # would fail the job over nothing.
          [ -f data/impression-cohort.json ] || exit 0
          # BOTH ledgers this job writes. Staging only the cohort one left
          # data/gsc-page-performance.json unstaged, and `git pull --rebase`
          # refuses to start with unstaged changes — which is how this job died
          # on 2026-09-14 after doing all of its work. It also meant the
          # performance ledger, refreshed here every day and read by
          # backfill-photos-alt to queue photos in earnings order, was thrown
          # away with the runner: the committed copy had stood still since
          # 2026-09-07.
          git add data/impression-cohort.json data/gsc-page-performance.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: gsc ledgers ($(date -u +%Y-%m-%d))"
          # The shared helper, which rebases with --autostash and retries five
          # times. Its own header documents this exact failure from 2026-08-04.
          bash scripts/git-push-retry.sh
