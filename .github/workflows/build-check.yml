name: Build check (deploy guard)

# Cloudflare's build failing leaves the site silently stuck on the previous
# version — the ONLY signal was a dashboard badge nobody watches (today a
# schema-enum miss froze deploys for ~40 min). This runs the same build on
# every push to main and telegrams in Korean the moment a commit can't build.
#
# It also DEPLOYS the site now (2026-08-10). Cloudflare's own Workers Builds ran
# this very same build a second time, and that second run was what shipped the
# site — until it ran out: "You have used all 3,000 included build minutes for
# the month". Eight commits in a row came back `skipped`, the site sat three
# hours on a version from before that evening's repairs, and nothing alerted,
# because a SKIPPED build is not a FAILED one. At ~20 commits a day over 6,600
# pages the free allowance is spent by the 10th of every month, so this was
# never going to be a one-off.
#
# The repo is public, so Actions minutes are free. Building once here and
# shipping that same dist costs nothing and removes the monthly cliff.
# ⚠️ Cloudflare's automatic builds must be switched OFF in the dashboard before
# its allowance resets on Sep 1, or both will deploy.
on:
  # Ship the current main on demand — the button that used to be Cloudflare's
  # "Retry build". Also the only way to redeploy after a change that touches
  # nothing in `paths` below (this file, for one).
  workflow_dispatch:
  # The bots' own commits never woke this workflow. GitHub does not start
  # workflows for pushes made with GITHUB_TOKEN (loop protection), so every
  # `content: auto-generated posts` commit since the 08-10 move to Actions
  # deploys sat on main until a HUMAN or the local og-mirror patrol happened
  # to push something else — the last 12 deploys were all such pushes, and
  # the day's posts went live ~10 hours late (next patrol at 05:30 KST).
  # Found 2026-08-22: Cambodia's first ten guides were on main for 3 hours
  # while /destinations still said "coming soon". workflow_run is exempt from
  # that rule, so the content producers hand off here when they finish.
  workflow_run:
    workflows:
      - 'Auto-generate & publish posts'
      - 'Backfill countries to target'
      - 'Discover current events (web search)'
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-check.yml'
      - 'src/**'
      - 'data/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      # Now that this workflow is what ships the site, whatever the DEPLOY needs
      # has to wake it too — not just what the BUILD reads. These three never
      # mattered while Cloudflare rebuilt on every push regardless.
      - 'public/**'
      - 'worker/**'
      - 'wrangler.jsonc'
      # data/ holds two different kinds of file. Some of it the build reads
      # (countries, country-facts, esim-facts, hero-width-queue, wall); the
      # rest is bookkeeping the bots rewrite all day — tokens, cursors, run
      # logs, audit output. Measured over 2026-07-31..08-07, the bookkeeping
      # accounted for most data/ commits, and every one of them woke a build
      # that could not possibly break. Excluded by NEGATION rather than by
      # listing the five that matter: a new data file the build starts reading
      # is then covered automatically, and the cost of forgetting to update
      # this list is a harmless extra build, never a missed breakage.
      - '!data/logs/**'
      - '!data/pinterest-token.enc'
      # The file pinterest.yml actually commits is data/pinterest.json — this
      # entry said "pinterest-state.json", a file that has never existed, so
      # every pin run (08:35 + 20:35 KST) woke a full 14-minute build+deploy
      # that shipped nothing. 22 such deploys between 08-01 and 08-13.
      - '!data/pinterest.json'
      - '!data/pinterest-analytics.json'
      # Weekly audit output and the newsletter send log: bookkeeping the build
      # never reads, each worth one pointless deploy per write.
      - '!data/full-audit.json'
      - '!data/newsletter-sent-log.json'
      - '!data/visual-audit.json'
      - '!data/published.json'
      - '!data/threads-daily.json'
      - '!data/fill-phase.json'
      - '!data/photo-retry.json'
      - '!data/places-budget.json'
      - '!data/topic-yield.json'
      - '!data/refresh-cursor.json'
      - '!data/performance-log.json'
      - '!data/indexnow-state.json'
      - '!data/reddit-scout-seen.json'

# NOT cancel-in-progress. Cancelling looks free but it is not: GitHub reports a
# superseded run as a FAILED run and emails the owner about it, so a busy push
# day filled the inbox with "Run failed: Build check" for builds that were never
# broken — and the one alert that matters, the site frozen on an old version,
# became indistinguishable from the noise. The repo is public, so Actions
# minutes cost nothing and there is nothing to save by killing runs. Queued runs
# finish in order and every commit gets a verdict of its own.
concurrency:
  group: build-check
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A producer that failed or was cancelled pushed nothing worth shipping;
    # pushes and manual runs are unaffected by this condition.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # workflow_run checks out the triggering run's commit, which can be
          # older than main by the time the chain finishes — always ship main.
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # The sitemaps and RSS only exist once the build has run, so this is the
      # only place the check can live. It asks one question: does every feed
      # agree with what the pages themselves tell crawlers? A page carrying its
      # own noindex that a feed still submits costs a fetch to be refused, and
      # crawl budget is this site's scarce resource (2026-08-25 audit).
      #
      # NEVER blocks the deploy. A stale site is the worse failure — eight
      # commits sat unshipped on 2026-08-10 and nothing alarmed — so a feed
      # inconsistency reports and the ship still goes out.
      - name: Feed / noindex consistency
        id: feedaudit
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/audit-feed-noindex.mjs 2>&1 | tee /tmp/feed-audit.log

      - name: Report feed inconsistency
        if: steps.feedaudit.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          {
            echo "⚠️ 피드가 색인 거부 페이지를 구글에 제출하고 있습니다 (배포는 정상 진행됨)"
            echo "커밋: ${GITHUB_SHA:0:7}"
            echo
            tail -c 1200 /tmp/feed-audit.log
            echo
            echo "클로드에게 '피드 감사 고쳐줘'라고 말하면 원인을 찾아 수정합니다."
          } > /tmp/feed-msg.txt
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode "text@/tmp/feed-msg.txt" >/dev/null || true

      # Ships the dist that was just verified above. Same wrangler command
      # Cloudflare's own builder ran ("npx wrangler deploy"), same wrangler.jsonc,
      # so the result is byte-identical to what it used to publish.
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        # Keep the output: the Actions log needs a GitHub login to read, so the
        # alert below is the only place the reason ever reaches anyone.
        # pipefail so tee cannot mask wrangler's exit code.
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy 2>&1 | tee /tmp/deploy.log

      # Covers the build AND the deploy: the whole point is that the site not
      # being current must never again be a silent state.
      - name: Alert on build or deploy failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          {
            echo "🚨 사이트 빌드/배포 실패 — 배포가 이전 버전에 멈춰 있습니다!"
            echo "커밋: ${GITHUB_SHA:0:7}"
            if [ -s /tmp/deploy.log ]; then
              echo
              echo "— 배포 단계 마지막 출력 —"
              tail -c 1200 /tmp/deploy.log
              echo
            fi
            echo "클로드에게 '빌드 실패 고쳐줘'라고 말하면 원인을 찾아 수정합니다."
          } > /tmp/msg.txt
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode "text@/tmp/msg.txt" >/dev/null || true
