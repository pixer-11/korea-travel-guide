name: Build check (deploy guard)

# Cloudflare's build failing leaves the site silently stuck on the previous
# version — the ONLY signal was a dashboard badge nobody watches (today a
# schema-enum miss froze deploys for ~40 min). This runs the same build on
# every push to main and telegrams in Korean the moment a commit can't build.
#
# It also DEPLOYS the site now (2026-08-10). Cloudflare's own Workers Builds ran
# this very same build a second time, and that second run was what shipped the
# site — until it ran out: "You have used all 3,000 included build minutes for
# the month". Eight commits in a row came back `skipped`, the site sat three
# hours on a version from before that evening's repairs, and nothing alerted,
# because a SKIPPED build is not a FAILED one. At ~20 commits a day over 6,600
# pages the free allowance is spent by the 10th of every month, so this was
# never going to be a one-off.
#
# The repo is public, so Actions minutes are free. Building once here and
# shipping that same dist costs nothing and removes the monthly cliff.
# The Sep 1 allowance reset was the deadline for switching Cloudflare's own
# builds off, or both would deploy. Checked in the dashboard on 2026-09-01:
# Settings -> Builds -> Git repository offers a bare "Connect" button, so no
# repository is attached and Cloudflare cannot build this Worker at all. The
# Versions list agrees — every entry reads "Manually deployed / Wrangler",
# which is this workflow; a Cloudflare build would stamp a commit and branch.
# Nothing to switch off. Re-check only if a repository ever appears there.
on:
  # Ship the current main on demand — the button that used to be Cloudflare's
  # "Retry build". Also the only way to redeploy after a change that touches
  # nothing in `paths` below (this file, for one).
  workflow_dispatch:
  # The bots' own commits never woke this workflow. GitHub does not start
  # workflows for pushes made with GITHUB_TOKEN (loop protection), so every
  # `content: auto-generated posts` commit since the 08-10 move to Actions
  # deploys sat on main until a HUMAN or the local og-mirror patrol happened
  # to push something else — the last 12 deploys were all such pushes, and
  # the day's posts went live ~10 hours late (next patrol at 05:30 KST).
  # Found 2026-08-22: Cambodia's first ten guides were on main for 3 hours
  # while /destinations still said "coming soon". workflow_run is exempt from
  # that rule, so the content producers hand off here when they finish.
  #
  # Every scheduled job that commits SITE content belongs here, not just the
  # three content producers. Until 2026-10-01 fourteen did not — photo
  # backfills, the freshness refresh, hero-width upgrades, galleries, the
  # quality and visual audits, country facts — so their fixes, photo
  # QUARANTINES included, sat on main until the next publish or patrol push
  # (found when two UK hubs kept a too-narrow share image hours after the width
  # was recorded). audit-automation's UNDEPLOYED-PUSH now fails CI when a job
  # that pushes src/, public/ or site data is missing from this list. A run that
  # pushed nothing is turned away by the gate job below, so listing a job costs
  # no build on the days it has nothing to ship.
  # Not listed: 'Quality audit (intl venues)'. It runs fourth in a workflow_run
  # chain, past the depth GitHub will follow, so it dispatches this workflow
  # itself after it pushes.
  workflow_run:
    workflows:
      - 'Auto-generate & publish posts'
      - 'Backfill countries to target'
      - 'Discover current events (web search)'
      - 'Alt-source photo backfill'
      - 'Backfill place details (phone/hours)'
      - 'Backfill real venue photos'
      - 'Gallery patrol (weekly in-body photo retry)'
      - 'Geocode placeless posts'
      - 'Hero width upgrade (Discover)'
      - 'In-body gallery photos'
      - 'Refresh country facts (climate + holidays)'
      - 'Refresh essentials (web check)'
      - 'Refresh existing posts (freshness)'
      - 'Weekly full content audit'
      - 'attach-placeless-photos'
      - 'visual-audit'
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-check.yml'
      - 'src/**'
      - 'data/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      # Now that this workflow is what ships the site, whatever the DEPLOY needs
      # has to wake it too — not just what the BUILD reads. These three never
      # mattered while Cloudflare rebuilt on every push regardless.
      - 'public/**'
      - 'worker/**'
      - 'wrangler.jsonc'
      # data/ holds two different kinds of file. Some of it the build reads
      # (countries, country-facts, esim-facts, hero-width-queue, wall); the
      # rest is bookkeeping the bots rewrite all day — tokens, cursors, run
      # logs, audit output. Measured over 2026-07-31..08-07, the bookkeeping
      # accounted for most data/ commits, and every one of them woke a build
      # that could not possibly break. Excluded by NEGATION rather than by
      # listing the five that matter: a new data file the build starts reading
      # is then covered automatically, and the cost of forgetting to update
      # this list is a harmless extra build, never a missed breakage.
      - '!data/logs/**'
      - '!data/pinterest-token.enc'
      # The file pinterest.yml actually commits is data/pinterest.json — this
      # entry said "pinterest-state.json", a file that has never existed, so
      # every pin run (08:35 + 20:35 KST) woke a full 14-minute build+deploy
      # that shipped nothing. 22 such deploys between 08-01 and 08-13.
      - '!data/pinterest.json'
      - '!data/pinterest-analytics.json'
      # Weekly audit output and the newsletter send log: bookkeeping the build
      # never reads, each worth one pointless deploy per write.
      - '!data/full-audit.json'
      - '!data/newsletter-sent-log.json'
      - '!data/visual-audit.json'
      - '!data/published.json'
      - '!data/threads-daily.json'
      - '!data/fill-phase.json'
      - '!data/photo-retry.json'
      - '!data/places-budget.json'
      - '!data/topic-yield.json'
      - '!data/refresh-cursor.json'
      - '!data/performance-log.json'
      - '!data/indexnow-state.json'
      - '!data/reddit-scout-seen.json'
      # The Claude spend ledger — read by reports, never by the site (2026-10-01).
      - '!data/claude-cost.jsonl'

# NOT cancel-in-progress. Cancelling looks free but it is not: GitHub reports a
# superseded run as a FAILED run and emails the owner about it, so a busy push
# day filled the inbox with "Run failed: Build check" for builds that were never
# broken — and the one alert that matters, the site frozen on an old version,
# became indistinguishable from the noise. The repo is public, so Actions
# minutes cost nothing and there is nothing to save by killing runs. Queued runs
# finish in order and every commit gets a verdict of its own.
# The group lives on the `build` job, not here (moved 2026-09-28): see there.

jobs:
  # Did the producer that woke us actually do anything? The evening schedule
  # publish arrives after the afternoon batch already went out, its slot guard
  # skips `generate`, and it still completes "success" — which used to ship the
  # same main a second time. Since 2026-09-28 the afternoon batch hands off to
  # this workflow itself (publish.yml deploy-handoff), so that evening deploy
  # would be pure duplicate. Idle = every job other than a guard was skipped.
  #
  # Second test (2026-10-01): did the run push anything at all? A producer
  # checks out main at head_sha and, if it commits, moves main past it. If main
  # still sits on head_sha when the run is over, it shipped nothing — the usual
  # day for most of the patrol jobs listed above, which is why listing them
  # costs no builds. If main moved for some other reason, we build anyway; that
  # only ships what the other push left waiting.
  #
  # The producer's conclusion no longer decides. A multi-step job can push and
  # THEN fail (alt-photos pushes its quarantines before later steps run), and
  # "failed ⇒ nothing worth shipping" left those fixes undeployed. What is on
  # main gets shipped; only a cancelled run is ignored.
  #
  # Fails open: if the API cannot be read, idle stays empty and we build — a
  # stale site is the worse failure.
  gate:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      idle: ${{ steps.look.outputs.idle }}
    steps:
      - id: look
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Guards are `slot` (publish) and `gate` (backfill), also as "fill / slot".
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${{ github.event.workflow_run.id }}/jobs?per_page=100" \
                --jq '[.jobs[] | select((.name | test("(^|/ )(slot|gate)$")) | not) | select(.conclusion != "skipped")] | length') || n=""
          echo "producer jobs that did work: ${n:-unknown}"
          if [ "$n" = "0" ]; then echo "idle=true" >> "$GITHUB_OUTPUT"; echo "nothing new to ship — skipping the deploy"; exit 0; fi
          main=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha) || main=""
          head="${{ github.event.workflow_run.head_sha }}"
          echo "main=${main:-unknown} producer head=$head"
          [ -n "$main" ] || exit 0                       # unreadable → build (fail open)
          if [ "$main" = "$head" ]; then echo "idle=true" >> "$GITHUB_OUTPUT"; echo "the run pushed nothing — skipping the deploy"; exit 0; fi
          # main moved. Ship only if something the SITE is built from changed —
          # the same `paths:` filter the push trigger below uses, read from this
          # very file at main so the two can never drift. A run that only
          # committed its ledger (data/logs/, published.json, …) builds nothing.
          gh api "repos/$GITHUB_REPOSITORY/compare/$head...$main" > /tmp/cmp.json || exit 0
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/build-check.yml?ref=$main" --jq .content | base64 -d > /tmp/self.yml || exit 0
          node - <<'JS' || exit 0
          const fs = require('fs');
          const cmp = JSON.parse(fs.readFileSync('/tmp/cmp.json', 'utf8'));
          // Only "main moved forward from what the producer started on" can be
          // read as a diff. behind/diverged (a revert, a force-push) prove nothing
          // about what the live site still serves — build.
          if (cmp.status !== 'ahead') { console.log(`compare status ${cmp.status} — building`); process.exit(0); }
          // A rename counts on both sides: moving a post OUT of src/ still has to
          // take the old page down.
          const files = (cmp.files ?? []).flatMap((x) => [x.filename, x.previous_filename]).filter(Boolean);
          const lines = fs.readFileSync('/tmp/self.yml', 'utf8').split(/\r?\n/);
          // The `paths:` list under `push:` — the first list after "  push:".
          const start = lines.findIndex((l) => /^  push:\s*$/.test(l));
          const pats = [];
          let inPaths = false;
          for (const l of lines.slice(start + 1)) {
            if (/^\S/.test(l) || /^  \S/.test(l)) break;          // left the push: block
            if (/^\s+paths:\s*$/.test(l)) { inPaths = true; continue; }
            const m = inPaths && l.match(/^\s+-\s+'([^']+)'/);
            if (m) pats.push(m[1]);
          }
          const re = (g) => new RegExp('^' + g.replace(/[.+^${}()|[\]\\]/g, '\\$&').replace(/\*\*/g, '\u0000').replace(/\*/g, '[^/]*').replace(/\u0000/g, '.*') + '$');
          const inc = pats.filter((p) => !p.startsWith('!')).map(re);
          const exc = pats.filter((p) => p.startsWith('!')).map((p) => re(p.slice(1)));
          // The compare API lists at most 300 files; a list that long, or a
          // filter that did not parse, is not evidence of "nothing" — build.
          if (!inc.length || (cmp.files ?? []).length >= 300) process.exit(0);
          const hit = files.filter((f) => inc.some((r) => r.test(f)) && !exc.some((r) => r.test(f)));
          console.log(`changed ${files.length} file(s); site-relevant ${hit.length}: ${hit.slice(0, 5).join(' ')}`);
          if (!hit.length) fs.appendFileSync(process.env.GITHUB_OUTPUT, 'idle=true\n');
          JS

  build:
    needs: gate
    runs-on: ubuntu-latest
    # On the JOB, not the workflow, so a run the gate turns away never enters the
    # queue. GitHub keeps one pending run per group and a newcomer replaces it —
    # at workflow level an idle evening run would displace a real pending deploy
    # and then ship nothing (codex review, 2026-09-28).
    concurrency:
      group: build-check
      cancel-in-progress: false
    # A cancelled producer is ignored; otherwise the gate above decides whether
    # the run left anything on main to ship (it may have pushed and then failed).
    # Pushes and manual runs skip the gate; !cancelled() lets build run past it.
    if: ${{ !cancelled() && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion != 'cancelled' && needs.gate.outputs.idle != 'true')) }}
    steps:
      - uses: actions/checkout@v5
        with:
          # workflow_run checks out the triggering run's commit, which can be
          # older than main by the time the chain finishes — always ship main.
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # Which commit the live site is serving, and when that commit was made:
      # the scheduled live checks list pages from their own checkout, and a
      # page committed after this deploy is not a broken page yet (Germany's
      # essentials, 10-02: committed 14:44 UTC, live 15:47, checked 15:03).
      # scripts/live/lib.mjs deployLag() reads this. Public and harmless: the
      # repository is public.
      - name: Stamp the build
        run: printf '%s %s\n' "$(git rev-parse HEAD)" "$(git log -1 --format=%ct)" > dist/build.txt

      # The sitemaps and RSS only exist once the build has run, so this is the
      # only place the check can live. It asks one question: does every feed
      # agree with what the pages themselves tell crawlers? A page carrying its
      # own noindex that a feed still submits costs a fetch to be refused, and
      # crawl budget is this site's scarce resource (2026-08-25 audit).
      #
      # NEVER blocks the deploy. A stale site is the worse failure — eight
      # commits sat unshipped on 2026-08-10 and nothing alarmed — so a feed
      # inconsistency reports and the ship still goes out.
      # The share image of the HOME PAGE and the hubs is picked from among their
      # children, so one child with a 1024px hero disqualifies the whole hub from
      # Discover's large card. scan-hero-widths covers posts and runs nightly;
      # nothing covered the hubs, and this audit sat unwired since 2026-08-06.
      # 37 audits in scripts/ read the INPUTS — frontmatter, translation JSON,
      # data files. Three read dist/. So a defect that only exists once the
      # templates have run is invisible to all of them, and the only thing that
      # ever finds one is a person opening the live site. That is why an
      # outside review keeps returning "new" defects that have shipped for
      # weeks: five of the eight P0 items in the 2026-09-10 diagnosis were this
      # shape, and every one of them had passed a green CI.
      #
      # Runs on every push to main, mine included — the point is to catch what
      # a change to a template does to the 6,600 pages it renders.
      - name: Finished pages, not just their ingredients
        id: rendered
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/audit-rendered-pages.mjs 2>&1 | tee /tmp/rendered.log

      - name: Report a defect that only exists after rendering
        if: steps.rendered.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          {
            echo "🧾 렌더된 페이지 검사에서 결함이 나왔습니다 (배포는 정상 진행됨)"
            echo "소스가 아니라 완성된 HTML에서만 보이는 부류입니다 — 미치환 변수·빈 이미지·지난 날짜·h1 이상."
            echo "대개 템플릿 한 곳이 원인이고, 그 한 곳이 수백 페이지에 퍼집니다."
            echo "커밋: ${GITHUB_SHA:0:7}"
            echo
            tail -c 1400 /tmp/rendered.log
          } > /tmp/rendered-msg.txt
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode "text@/tmp/rendered-msg.txt" >/dev/null || true

      - name: Share-image width on home and hubs
        id: ogwidth
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/audit-og-width.mjs 2>&1 | tee /tmp/og-width.log

      # Wired 2026-09-08 without a voice: it failed on the first full build after
      # the WebP fix and the only place that said so was the log. Same shape as
      # the feed and sitemap reports below — report, never block the ship.
      - name: Report a narrow or unmeasurable share image
        if: steps.ogwidth.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          {
            echo "🖼 공유 이미지 폭 검사가 실패했습니다 (배포는 정상 진행됨)"
            echo "1200px 미만이면 구글 디스커버 큰 카드에서 빠지고, 못 잰 것이 많으면 검사가 아무것도 못 본 것입니다."
            echo "커밋: ${GITHUB_SHA:0:7}"
            echo
            tail -c 1200 /tmp/og-width.log
          } > /tmp/og-msg.txt
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"             --data-urlencode chat_id="$TELEGRAM_CHAT_ID"             --data-urlencode "text@/tmp/og-msg.txt" >/dev/null || true

      - name: Feed / noindex consistency
        id: feedaudit
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/audit-feed-noindex.mjs 2>&1 | tee /tmp/feed-audit.log

      - name: Report feed inconsistency
        if: steps.feedaudit.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          {
            echo "⚠️ 피드가 색인 거부 페이지를 구글에 제출하고 있습니다 (배포는 정상 진행됨)"
            echo "커밋: ${GITHUB_SHA:0:7}"
            echo
            tail -c 1200 /tmp/feed-audit.log
            echo
            echo "클로드에게 '피드 감사 고쳐줘'라고 말하면 원인을 찾아 수정합니다."
          } > /tmp/feed-msg.txt
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode "text@/tmp/feed-msg.txt" >/dev/null || true

      # The split sitemap is only a diagnostic while it is COMPLETE. A silent
      # classifier change that drops a page type would leave the site working
      # and that type simply never submitted — the kind of failure nobody goes
      # looking for. Same rule as the feed audit: report, never block the ship.
      - name: Sitemap split integrity
        id: splitaudit
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/audit-sitemap-split.mjs 2>&1 | tee /tmp/split-audit.log

      - name: Report sitemap split problem
        if: steps.splitaudit.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          {
            echo "⚠️ 사이트맵 분할에서 URL이 새고 있습니다 (배포는 정상 진행됨)"
            echo "커밋: ${GITHUB_SHA:0:7}"
            echo
            tail -c 1200 /tmp/split-audit.log
            echo
            echo "클로드에게 '사이트맵 분할 감사 고쳐줘'라고 말하면 원인을 찾아 수정합니다."
          } > /tmp/split-msg.txt
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode "text@/tmp/split-msg.txt" >/dev/null || true

      # Ships the dist that was just verified above. Same wrangler command
      # Cloudflare's own builder ran ("npx wrangler deploy"), same wrangler.jsonc,
      # so the result is byte-identical to what it used to publish.
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        # Keep the output: the Actions log needs a GitHub login to read, so the
        # alert below is the only place the reason ever reaches anyone.
        # pipefail so tee cannot mask wrangler's exit code.
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy 2>&1 | tee /tmp/deploy.log

      # Covers the build AND the deploy: the whole point is that the site not
      # being current must never again be a silent state.
      - name: Alert on build or deploy failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          {
            echo "🚨 사이트 빌드/배포 실패 — 배포가 이전 버전에 멈춰 있습니다!"
            echo "커밋: ${GITHUB_SHA:0:7}"
            if [ -s /tmp/deploy.log ]; then
              echo
              echo "— 배포 단계 마지막 출력 —"
              tail -c 1200 /tmp/deploy.log
              echo
            fi
            echo "클로드에게 '빌드 실패 고쳐줘'라고 말하면 원인을 찾아 수정합니다."
          } > /tmp/msg.txt
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode "text@/tmp/msg.txt" >/dev/null || true
