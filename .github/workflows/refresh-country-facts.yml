name: Refresh country facts (climate + holidays)

# Monthly refresh of data/country-facts.json (NASA POWER climate + Nager.Date
# public holidays). Commit → push → the daily builds render the fresh data on
# /essentials/<country> pages. Countries without post coordinates yet get
# climate automatically once their venue posts exist.
on:
  schedule:
    - cron: '45 17 3 * *' # 3rd of each month, 17:45 UTC = 02:45 KST (off the hour)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Fetch climate + holidays
        run: node scripts/refresh-country-facts.mjs

      # A wrong coordinate does not fail the fetch — it returns twelve perfectly
      # well-formed months of the wrong place, and that is how Hanoi published a
      # winterless January for weeks (2026-09-09). This reads the figures against
      # the latitude they were taken at. It does not block the commit: numbers a
      # human should look at are not a reason to freeze the whole file.
      - name: Are the climate figures plausible for their latitude?
        id: climate
        continue-on-error: true
        run: node scripts/check-climate-plausible.mjs 2>&1 | tee /tmp/climate.log

      - name: Warn on implausible climate
        if: steps.climate.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          {
            echo "🌡️ 기후 수치가 위도와 맞지 않는 나라가 있습니다"
            echo "그 나라 when-to-go 페이지의 기온이 다른 도시 값일 수 있습니다."
            echo
            tail -c 1000 /tmp/climate.log
          } > /tmp/climate-msg.txt
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"             --data-urlencode chat_id="$TELEGRAM_CHAT_ID"             --data-urlencode "text@/tmp/climate-msg.txt" >/dev/null || true

      - name: Commit
        run: |
          git config user.name "content-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/country-facts.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "data: monthly country-facts refresh ($(date -u +%Y-%m))"
            bash scripts/git-push-retry.sh
          fi
