name: Auto-generate & publish posts

# Runs unattended on a schedule. Generates new posts, commits them, and the
# push wakes build-check.yml, which builds AND deploys via wrangler. (This
# comment used to say "Cloudflare Pages / Vercel picks up the push" — false
# since 2026-08-10, when Cloudflare's build minutes ran out and the deploy
# moved to GitHub Actions.)
on:
  schedule:
    # 07:19 UTC = 16:19 KST — right AFTER Google's hidden facts-quota reset
    # (16:00 KST / midnight PT), so the daily run always starts on a fresh
    # quota window and manual afternoon runs can't starve it. Off the hour
    # because GitHub drops :00 crons.
    - cron: '19 7 * * *'
  workflow_dispatch: # lets you run it manually from the Actions tab
    inputs:
      count:
        # Blank on purpose. A default here is not a default — GitHub fills it in
        # for every manual run, so `inputs.count || <throttle>` never reaches the
        # throttle and a rescue dispatch silently published 50. Leave it empty to
        # follow data/publish-throttle.json; type a number only to override it.
        description: 'How many posts (blank = follow data/publish-throttle.json)'
        required: false
        default: ''
      country:
        description: 'Optional: fill ONE country only, e.g. Japan (blank = all active)'
        required: false
        default: ''
      target:
        description: 'Optional: stop each country at this many guides (blank = no cap)'
        required: false
        default: ''
  # backfill.yml calls THIS workflow instead of keeping its own copy of the
  # pipeline. It used to be a parallel copy that generated and committed posts
  # without any of the steps below it — no content validation, no itinerary
  # rebuild, no translation audit, none of the follow-up translations. So the
  # bulk job was about to publish 25 posts a day, for weeks, through a path where
  # every guard added here simply did not exist. One pipeline, called twice, is
  # the only version of this that stays true after the next fix lands in one
  # place and not the other.
  workflow_call:
    inputs:
      count:
        description: 'Posts to generate this run'
        required: false
        type: string
      country:
        required: false
        type: string
      target:
        description: 'Per-country guide cap (TARGET_PER_COUNTRY)'
        required: false
        type: string
      label:
        description: 'Telegram label: "Daily publish" or "Backfill"'
        required: false
        type: string

# Publish is the single largest Places-quota consumer, and it was the only
# consumer WITHOUT a concurrency group: a manual dispatch during the 16:19 KST
# scheduled run raced it for quota and for git pushes (automation audit,
# 2026-08-13). Same group as the other per-call quota jobs; queue, never
# cancel — a cancelled publish half-writes a day's batch.
concurrency:
  group: places-quota
  cancel-in-progress: false

permissions:
  contents: write
  # For the day guard in generate.mjs: a schedule run lists this workflow's own
  # runs to see whether today's KST batch already went out (2026-08-30 01:20).
  actions: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # ref: main, not the dispatch-time SHA — a run that queued or arrived
      # late must build from the tip (state ledgers, throttle, topic keys), not
      # from a snapshot taken when it was scheduled (stale-SHA class, 08-29).
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # How many posts a scheduled run may publish. Read from
      # data/publish-throttle.json so the number lives in ONE place - backfill.yml
      # reads the same file, and restoring normal output is one edit there rather
      # than a hunt through two workflows. A manual dispatch still wins: `count`
      # overrides the throttle, so a person can always publish on purpose.
      - name: Read publish throttle
        id: throttle
        run: |
          N=$(node -e "
            const fs=require('fs');
            const F='data/publish-throttle.json';
            if(!fs.existsSync(F)){console.log(16);process.exit(0)}   // no throttle configured
            let d;
            try{d=JSON.parse(fs.readFileSync(F,'utf8'))}
            catch(e){console.error('publish-throttle.json 을 읽을 수 없다: '+e.message);process.exit(1)}
            const n=d.postsPerRun??16;
            if(!Number.isInteger(n)||n<0||n>200){console.error('postsPerRun 값이 이상하다: '+JSON.stringify(d.postsPerRun));process.exit(1)}
            console.log(n);
          ")
          echo "posts=$N" >> "$GITHUB_OUTPUT"
          echo "이번 발행 편수: $N (data/publish-throttle.json)"

      - name: Generate posts
        env:
          # For the one-batch-per-KST-day guard (lib/slot-served.mjs).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          # Busy/quiet hours — the one dataset here that Google Maps does not
          # expose, and therefore the only fact on these pages an AI assistant
          # cannot answer from its own Maps grounding. generate.mjs has fetched it
          # since July, but the key was never passed in, and the code treats a
          # missing key as a silent no-op — so every post published since then
          # shipped without it and nothing reported a problem. Verified: 0 of the
          # 16 posts published 2026-07-28 carry busyness data.
          BESTTIME_API_KEY: ${{ secrets.BESTTIME_API_KEY }}
          # `inputs` covers both workflow_dispatch and workflow_call; it is empty
          # on the schedule, which is what the fallback is for.
          POSTS_PER_RUN: ${{ inputs.count || steps.throttle.outputs.posts }}
          # Which share of the day's ~100 Text Searches this run draws from:
          # the scheduled run is 'publish' (55), the bulk caller 'fill' (35).
          # Until 2026-08-23 Text Search was unbudgeted and the 16:19 run spent
          # the whole day's quota, so the bulk run got 429 on its first query.
          PLACES_JOB: ${{ inputs.label == 'Backfill' && 'fill' || 'publish' }}
          COUNTRY: ${{ inputs.country }}
          # Blank on the daily run (no cap); the bulk caller passes 58 so each
          # country stops at the target instead of the biggest one running away.
          TARGET_PER_COUNTRY: ${{ inputs.target }}
          MIN_RATING: '4.0'
          MIN_REVIEWS: '50'
        run: |
          set -o pipefail
          npm run generate 2>&1 | tee /tmp/gen.log

      # An exhausted BestTime account looks exactly like a quiet day unless someone
      # says so: the fetch fails softly by design, so publishing never blocks on it.
      # That softness is why a missing key went unnoticed for days. If the run was
      # locked out — no key, no credits, key rejected — the owner hears about it the
      # same morning, in Korean, because it is a paid account that needs a decision.
      - name: Warn if busy-times data was blocked
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          grep -q 'BUSYTIMES-BLOCKED' /tmp/gen.log 2>/dev/null || exit 0
          DETAIL=$(grep -m1 '📊 busy-times:' /tmp/gen.log | sed 's/.*busy-times: //')
          if grep -q 'BESTTIME_API_KEY not set' /tmp/gen.log; then
            CAUSE='BestTime API 키가 설정되지 않았습니다 (GitHub Secrets 확인 필요).'
          elif grep -q 'credits exhausted' /tmp/gen.log; then
            CAUSE='BestTime 크레딧이 소진되었습니다 — 충전이 필요합니다.'
          else
            CAUSE='BestTime 키가 거부되었습니다 — 키가 만료되었거나 잘못되었습니다.'
          fi
          TXT=$(printf '⚠️ 혼잡시간 데이터 누락\n%s\n\n오늘 발행된 글에 "한산한 시간" 정보가 들어가지 않았습니다. 이 항목은 구글 지도에 없는 우리만의 데이터입니다.\n집계: %s' "$CAUSE" "${DETAIL:-확인 불가}")
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$TXT" >/dev/null || true

      # Translate the newly-generated posts into ko/ja/es/zh BEFORE committing, so
      # every post ships with its translations in the same push (no English-only
      # window). Resumable: only untranslated posts are done. continue-on-error so
      # an API hiccup still ships the English + whatever translated — the rest are
      # picked up on the next run (the script skips what already exists).
      - name: Translate new posts (ko/ja/es/zh)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRANSLATE_CONCURRENCY: '8'
        # `|| echo` leaves a trace instead of vanishing. continue-on-error keeps
        # one dead step from binning a night's work, but it also leaves
        # job.status at 'success' — so an expired ANTHROPIC_API_KEY could ship 16
        # English-only posts with no itineraries and report "✅ 상태: 성공"
        # (found 2026-08-05). The final Telegram now names whatever failed.
        # Report the SIZE of the failure, not just its name. On 2026-08-06 this
        # sent "글 번역 실패" and all 18 posts were in fact translated in all
        # four languages — a handful of individual jobs had failed and the step
        # announced itself as broken. An alarm that overstates gets ignored,
        # and then the one that matters is ignored with it.
        run: |
          set -o pipefail
          node scripts/translate-posts.mjs 2>&1 | tee /tmp/translate.log || {
            S=$(grep -o 'TRANSLATE_SUMMARY .*' /tmp/translate.log | tail -1)
            F=$(echo "$S" | grep -o 'failed=[0-9]*' | grep -o '[0-9]*' || echo '?')
            J=$(echo "$S" | grep -o 'jobs=[0-9]*' | grep -o '[0-9]*' || echo '?')
            echo "글 번역 (${F}/${J}건 실패)" >> /tmp/soft-fail.txt
          }

      # The two sibling translators of translate-posts — the 5 essentials topic
      # hubs and the static pages (about/privacy/terms…). Until 2026-09-02 they
      # ran from nobody's workflow and skipped any file that existed, so an
      # English edit to a policy page or a visa hub never reached its four
      # translations. Same srcHash staleness queue as posts now, so the normal
      # night costs zero calls; same soft-fail trace so a failure is named.
      - name: Translate topic hubs and static pages (ko/ja/es/zh)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRANSLATE_CONCURRENCY: '8'
        run: |
          node scripts/translate-topics.mjs || echo "토픽 허브 번역" >> /tmp/soft-fail.txt
          node scripts/translate-static.mjs || echo "정적 페이지 번역" >> /tmp/soft-fail.txt

      # The translator's recurring tic (쯤→쯍 etc, non-wansung syllables) is
      # substituted right here, BEFORE the gate and the commit — detection was
      # automatic since 08-08 but the repair was a human every time (16 files
      # on 08-08, 20 on 08-09). Unknown shatters delete the file so the next
      # run retranslates it via the srcHash queue.
      - name: Repair broken Korean syllables
        run: node scripts/fix-broken-syllables.mjs

      # The Chinese translator's equivalent tic: a half-width comma between two
      # Han characters (中文,然后 instead of 中文，然后), which a native reader
      # reads as "translated from English" before reading a word. Found
      # 2026-08-16 on 506 of 1,007 live zh pages — and it was the mechanical
      # half of why the naturalness judge scored zh at 8% against 1-2% for the
      # other three languages. Re-judging the flagged pages after this repair
      # moved 25 of 80 down a score with zero model calls and none upward.
      # Deterministic, so it runs before the gate and costs nothing.
      - name: Repair half-width punctuation in Chinese prose
        run: node scripts/fix-cjk-punctuation.mjs --apply

      # Naturalness gate for the run's own translations: the owner read
      # English word order inside a Korean paragraph on 2026-08-15, and the
      # corpus audit measured 13% clearly translation-flavored. Every i18n
      # file this run touched is judged by the shared native-editor judge
      # (scripts/lib/translation-quality.mjs); score 2+ gets ONE rewrite
      # through the translator's rewrite prompt and a re-judge. Runs before
      # the commit so repairs ship the same day — a repair after the push
      # never happened (photo-identity strip, 2026-08-14).
      # WRONG-LANGUAGE gate, before the commit. audit-translations (the
      # korean-leak / kana-leak / broken-bold / lost-field check) already
      # existed — but at step ~730, AFTER the day's push, so on 2026-08-15 it
      # could only report that 106 Chinese pages were serving Korean once they
      # were already live. Same shape as every lesson this week: a check after
      # the push is a report, not a gate. Here, any post translation it flags
      # is DELETED before the commit; the srcHash queue re-translates it on the
      # next run, and the English page serves meanwhile. Only posts/ files are
      # deleted (the audit also scans essentials/static pages, which the daily
      # run does not write and which have no re-queue). Never fails the job.
      - name: Wrong-language gate (delete flagged post translations before commit)
        continue-on-error: true
        run: |
          # Exit 1 = "flags found" (expected, we act on them); exit 0 = clean.
          # Anything else, or an empty report, means the AUDIT ITSELF died —
          # say so loudly instead of reading emptiness as "nothing to remove".
          set +e
          node scripts/audit-translations.mjs > /tmp/lang-audit.txt 2>&1
          RC=$?
          set -e
          if [ "$RC" -gt 1 ] || ! grep -q "Translation language audit" /tmp/lang-audit.txt; then
            echo "::warning::wrong-language audit did not run to completion (exit $RC) — no translations removed"
            tail -20 /tmp/lang-audit.txt || true
            echo "LANG_GATE_SUMMARY removed=0 audit=broken"
            exit 0
          fi
          DEL=0
          while IFS= read -r line; do
            f=$(printf '%s' "$line" | sed -nE 's#^ *• posts/(ko|ja|es|zh)/([^:]+\.md):.*#src/content/i18n/\1/\2#p')
            [ -z "$f" ] && continue
            # Only pull translations this run created or changed; a legacy
            # flag on an untouched file is a report for the corpus audit.
            if git status --porcelain -- "$f" | grep -q .; then
              rm -f "$f"; DEL=$((DEL+1)); echo "  ✂ removed wrong-language translation: $f"
            fi
          done < /tmp/lang-audit.txt
          echo "LANG_GATE_SUMMARY removed=$DEL"

      - name: Translation naturalness gate
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/translation-quality-gate.mjs

      # The gate above only sees what THIS run touched. Everything else that
      # became judgeable since was nobody's job: a post released from
      # quarantine overnight, a translation an earlier run rewrote, and — until
      # 2026-08-16 — every text the judge had silently choked on. The corpus
      # audit could have caught all three, but it was a script a human had to
      # remember to run, so 230 live translations sat unjudged and the judge's
      # own 25% failure rate went unnoticed for a day. This is the standing
      # reader for it. Bounded: a backlog costs a few minutes a night instead
      # of one large bill, and once caught up it finds nothing and bills ~0.
      # WEEKLY, not nightly. Nightly at 120 would have re-judged everything the
      # gate above deliberately sampled away, cancelling that saving and adding
      # its own — a monitor that costs more than the thing it monitors. Once a
      # week is enough to keep the corpus picture honest (this is where the
      # flagged count and judgeFailed come from), and it is bounded so a bad
      # week costs 60 calls, not an open tab.
      - name: Translation quality catch-up (weekly corpus check)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          # Monday only. GitHub Actions expressions have no modulo and no date,
          # so the weekday test lives here rather than in an `if:`.
          if [ "$(date -u +%u)" != "1" ]; then
            echo "주간 전수 점검은 월요일에만 — 오늘은 건너뜁니다."
            exit 0
          fi
          set +e
          node scripts/audit-translation-quality.mjs --limit=60 2>&1 | tee /tmp/tq.log
          set -e
          S=$(grep -o 'TRANSLATION_QUALITY_SUMMARY .*' /tmp/tq.log | tail -1)
          # An empty summary means the AUDIT died, not that the corpus is
          # clean — the wrong-language gate learned this the same week. Read
          # emptiness as breakage, never as "nothing to do".
          if [ -z "$S" ]; then
            echo "::warning::translation quality catch-up did not finish"
            echo "번역 품질 심사 (감사 자체가 실패)" >> /tmp/soft-fail.txt
            exit 0
          fi
          FAILED=$(printf '%s' "$S" | sed -nE 's/.*judgeFailed=([0-9]+).*/\1/p')
          LEFT=$(printf '%s' "$S" | sed -nE 's/.*unjudged=([0-9]+).*/\1/p')
          echo "심사 못 한 채 남은 번역: ${LEFT:-?}건"
          # A judge that answers "unavailable" is the exact failure that hid for
          # a day. It reaches Telegram now, not just the log.
          if [ "${FAILED:-0}" -gt 0 ]; then
            echo "번역 품질 심사 (${FAILED}건 판정 불가)" >> /tmp/soft-fail.txt
          fi

      # Country/city NAMES for ko/ja/es/zh. Idempotent (skips what it already has),
      # so this only costs anything when a new country or city appears — without it
      # a newly added destination shows its English name on every localized page.
      - name: Translate new place names (ko/ja/es/zh)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/build-place-names.mjs || echo "장소명 번역" >> /tmp/soft-fail.txt

      # Country one-line blurbs. Also idempotent — only new countries (or an edited
      # English blurb) cost anything, so this is a no-op on a normal day.
      - name: Translate country blurbs (ko/ja/es/zh)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/translate-country-blurbs.mjs || echo "국가 소개 번역" >> /tmp/soft-fail.txt

      # Public-holiday name glosses. src/i18n/holidays.ts says in its own comment
      # "Never English on a localized page", and that was false for 216 of 329
      # holidays — /ko/tools/when-to-go/singapore/august/ printed "National Day",
      # Taiwan's February printed three English names in a row. The table was
      # hand-typed, had no generator, and ran in no workflow, so every country
      # added after it was written arrived uncovered and stayed that way.
      # Idempotent: only rows missing a language cost anything, so this is a
      # no-op until refresh-country-facts pulls in a holiday nobody has glossed.
      - name: Translate new holiday names (ko/ja/es/zh)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/translate-holidays.mjs || echo "공휴일명 번역" >> /tmp/soft-fail.txt

      # Region intro fact-boxes ("getting there / how long") for any city that
      # just got its FIRST post — web-search-grounded EN + 4 translations.
      # Idempotent: covered cities are skipped, so this is a no-op most days.
      - name: Generate region intros for new cities
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CONCURRENCY: '2'
        run: node scripts/gen-region-intros.mjs || echo "지역 소개" >> /tmp/soft-fail.txt

      # Climate/holiday facts and the country essentials guides are refreshed on
      # monthly crons, which is right for keeping them current and wrong for a
      # country that has just appeared: added on the 4th, it waits until the 3rd
      # of the next month for climate — and no climate means no when-to-go pages
      # at all, so twelve pages per language simply do not exist for a month.
      # That is not hypothetical: Taiwan, Malaysia, India and the Philippines
      # published their first guides on 2026-07-26, one day after the refresh ran,
      # and sat without climate data until it was noticed by hand three days later.
      #
      # So the gap is closed here rather than waited out. Both steps no-op when
      # nothing is missing: refresh-country-facts uses free APIs, and
      # build-essentials skips any country whose guide already exists.
      - name: Fill facts for newly added countries
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          MISSING=$(node -e "
            const cf = require('./data/country-facts.json').countries || {};
            const cs = require('./data/countries.json').countries.filter((c) => c.active);
            const fs = require('fs');
            const ess = fs.existsSync('src/content/essentials')
              ? fs.readdirSync('src/content/essentials').map((f) => f.replace('.md', ''))
              : [];
            const noClimate = cs.filter((c) => !((cf[c.name] || {}).climate || []).length);
            const noEssentials = cs.filter((c) => !ess.includes(c.slug));
            console.log(JSON.stringify({
              climate: noClimate.map((c) => c.name),
              essentials: noEssentials.map((c) => c.name),
            }));
          ")
          echo "누락 현황: $MISSING"
          if echo "$MISSING" | grep -q '"climate":\[\]'; then
            echo "기후·공휴일: 빠진 나라 없음 — 건너뜁니다."
          else
            node scripts/refresh-country-facts.mjs
          fi
          if echo "$MISSING" | grep -q '"essentials":\[\]'; then
            echo "나라 실용정보: 빠진 나라 없음 — 건너뜁니다."
          else
            node scripts/build-essentials.mjs
            # The guide alone is not the job. This step used to stop at the
            # English file, and the four translations waited for the MONTHLY
            # refresh-essentials cron — a country added on the 2nd shipped
            # English-only /ko /ja /es /zh essentials for up to four weeks
            # (automation audit, 2026-08-13). translate-essentials is
            # idempotent (skips what already exists), so this costs nothing on
            # days when nothing is new.
            node scripts/translate-essentials.mjs
          fi

      # Assembles/refreshes src/content/itineraries/<city>-<n>-days.md for any
      # region that clears the itinerary gates (src/lib/itinerary.mjs gateFor).
      # Self-validating (runs scripts/validate-itineraries.mjs on a temp file
      # before ever touching a real target — see that script's header) and
      # capped to ≤2 brand-new cities/7 days via data/itineraries-state.json,
      # so this can never spam new pages. continue-on-error so a bad Claude
      # response for one city can't block the rest of the daily publish.
      # set -o pipefail: without it, the pipeline's exit status is tee's, so a
      # crashed node still reports SUCCESS with a truncated log (same reasoning
      # as geocode-placeless.yml).
      - name: Build/refresh itinerary pages
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          node scripts/build-itineraries.mjs 2>&1 | tee /tmp/itin.log

      # AFTER the builder, on purpose. Parking an itinerary whose stop got
      # quarantined is correct; the missing half was the way back. Un-parking
      # only ever happened as a side effect of a SUCCESSFUL regeneration, so an
      # itinerary whose stops had all returned stayed down for as long as
      # regeneration kept failing for an unrelated reason. Bangkok — the
      # best-covered city on the site — sat behind a 301 for three days that
      # way, with a finished, validator-clean file on disk. This asks the only
      # question that decides it: are the stops live again?
      - name: Republish itineraries whose stops came back
        continue-on-error: true
        run: node scripts/unpark-itineraries.mjs 2>&1 | tee -a /tmp/itin.log

      # Prose-only translation (ko/ja/es/zh) of whatever itinerary files exist —
      # resumable, skips up-to-date files, re-translates when sourceHash differs.
      - name: Translate itineraries (ko/ja/es/zh)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/translate-itineraries.mjs || echo "일정표 번역" >> /tmp/soft-fail.txt

      # The phone/coords backfills correct post coordinates most days, which
      # leaves the itineraries' cached leg distances stale — and the validator
      # further down then sent the owner the same LEG-STALE warning every single
      # morning for a number nobody had to decide anything about. Re-syncing here
      # (before the commit, so the fix is actually saved) keeps that warning for
      # cases that need a human. It only rewrites `km`; a changed walk time or
      # travel mode is deliberately left to the validator, because the prose is
      # written against those two.
      - name: Re-sync itinerary leg distances to current coordinates
        continue-on-error: true
        run: node scripts/refresh-itinerary-legs.mjs --apply

      # The dev box has no gh CLI and Actions logs need auth, so the build run's
      # log is committed as an artifact file — same reasoning/pattern as
      # data/logs/geocode-last-run.txt in geocode-placeless.yml.
      - name: Save itinerary build log to repo
        run: |
          mkdir -p data/logs
          cp /tmp/itin.log data/logs/itinerary-last-run.txt 2>/dev/null || echo "(no itinerary log this run)" > data/logs/itinerary-last-run.txt

      - name: Build hero photo-wall thumbnails
        run: node scripts/build-wall.mjs

      # Runs BEFORE the commit on purpose. It sat after it for one day, and in
      # that position the queue it writes was destroyed with the runner every
      # single time — an audit that changed nothing and told nobody.
      - name: Audit hero file names
        id: heroaudit
        continue-on-error: true
        run: node scripts/audit-hero-titles.mjs --fix

      # THE GATE. Every validator below this file used to run AFTER the commit and
      # push, which meant a post with the wrong photo, or advice to visit a venue
      # on the day it is shut, went live first and produced a warning second. The
      # checks were real; their position made them a post-mortem.
      #
      # This runs before the commit and flips any offending post to draft, so it
      # never reaches the site. It does not fail the run — one bad post must not
      # throw away fifteen good ones and a day of Places quota. Scoped to posts
      # THIS run added, so a pre-existing defect is left to the repair patrol
      # rather than silently unpublishing a page that has been live for weeks.
      - name: Hold back defective posts (publish gate)
        id: gate
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/gate-new-posts.mjs --since=HEAD 2>&1 | tee /tmp/gate.log

      # The day's output must not shrink because the gate caught something. If it
      # held N posts back, generate exactly N replacements from the queue and put
      # THOSE through the same gate. One top-up round only — a queue that keeps
      # producing rejects is a problem to be told about, not to loop on.
      - name: Top up the held-back posts
        id: topup
        if: steps.gate.outputs.held != '' && steps.gate.outputs.held != '0'
        continue-on-error: true
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          BESTTIME_API_KEY: ${{ secrets.BESTTIME_API_KEY }}
          POSTS_PER_RUN: ${{ steps.gate.outputs.held }}
          COUNTRY: ${{ inputs.country }}
          TARGET_PER_COUNTRY: ${{ inputs.target }}
          MIN_RATING: '4.0'
          MIN_REVIEWS: '50'
        run: |
          set -o pipefail
          npm run generate 2>&1 | tee -a /tmp/gen.log
          node scripts/translate-posts.mjs || true
          # Replacement posts are generated AFTER the wall-thumbnail step ran,
          # so without this their cards rendered blank (bordeaux-miroir-d-eau,
          # first gated run).
          node scripts/build-wall.mjs || true
          # A crash of THIS gate round must reach the commit condition too; the
          # step is continue-on-error, so it is recorded as an output instead.
          node scripts/gate-new-posts.mjs --since=HEAD 2>&1 | tee -a /tmp/gate.log || echo "gate=crashed" >> "$GITHUB_OUTPUT"

      # The gate's Telegram message promises the held posts come back fixed;
      # this is the machinery behind that sentence. Hours-contradiction drafts
      # are rewritten against the real hours, re-audited, republished only when
      # clean, and their four translations refreshed. Photo quarantines are left
      # to the photo patrol, which has the API keys this step does not.
      - name: Repair and republish held posts
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/repair-held-posts.mjs 2>&1 | tee -a /tmp/gate.log

      - name: Report held-back posts (Korean)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          # A checker that DIED is more urgent than a post that was held: the gate
          # cannot have been applied, so tonight's batch went out unchecked. This
          # used to be invisible — a crashed checker contributed no findings and
          # the gate printed "every post passed" (2026-08-05).
          if grep -q 'GATE-CHECKER-CRASHED' /tmp/gate.log 2>/dev/null; then
            BODY=$(sed -n '/GATE-CHECKER-CRASHED/,$p' /tmp/gate.log | head -12)
            TXT=$(printf '🚨 발행 검사기가 죽었습니다 — 오늘 글은 제대로 검사되지 않았습니다\n%s\n\nGitHub Actions 로그를 확인해 주세요.' "$BODY")
            curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
              --data-urlencode "text=$TXT" >/dev/null || true
          fi
          grep -q 'HELD BACK' /tmp/gate.log 2>/dev/null || exit 0
          BODY=$(sed -n '/HELD BACK/,$p' /tmp/gate.log | head -30)
          TXT=$(printf '🚧 문제가 있는 글을 발행 직전에 걸러냈습니다\n%s' "$BODY")
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$TXT" >/dev/null || true

      # Self-repair BEFORE the commit, so the fixes ship with the batch and the
      # validation warning further down only ever names what a machine could
      # not fix on its own. Added 2026-08-07, after an evening spent hand-
      # running exactly these two on defects the daily report had flagged:
      # ended events still speaking in future tense, and CJK translations
      # showing literal asterisks. Both tools are idempotent and quiet when
      # there is nothing to fix; either dying must not block the publish.
      - name: Auto-repair known defect classes (ended-event tense, CJK bold, clipped descriptions)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node scripts/fix-ended-event-tense.mjs 2>&1 | tail -3 || true
          node scripts/repair-cjk-bold.mjs 2>&1 | tail -3 || true
          # --fix-truncated-only: repair descriptions that were clipped mid-
          # sentence and touch nothing else. Without the flag the same script
          # also adds the review badge to every eligible post, which would
          # dissolve the control group of the SERP badge pilot.
          node scripts/backfill-descriptions.mjs --fix-truncated-only --apply 2>&1 | tail -2 || true

      # Only when the gate itself ran to completion. continue-on-error keeps a
      # held post from failing the run (the gate exits 0 for holds), so a
      # non-success outcome here means GATE-CHECKER-CRASHED: nothing was
      # checked, and until 2026-09-02 the unchecked batch was committed anyway.
      - name: Commit new posts
        id: commit
        if: steps.gate.outcome == 'success' && steps.topup.outputs.gate != 'crashed'
        run: |
          git config user.name "content-bot"
          git config user.email "bot@users.noreply.github.com"
          # country-facts.json and the essentials guides are here because the
          # step above can create them for a newly added country; without them
          # staged, that work is generated and then thrown away on every run.
          # essentials-topics-i18n / static-pages-i18n: their translators joined
          # this workflow on 2026-09-02; unstaged, a re-translation would be
          # produced every night and dropped every night.
          git add data/places-budget.json data/topic-yield.json data/visual-audit.json data/translation-quality.json src/content/posts src/content/i18n data/published.json public/wall data/wall.json src/i18n/places.json src/i18n/country-blurbs.json src/i18n/regions.json src/i18n/holidays.json src/content/itineraries src/content/itineraries-i18n data/itineraries-state.json data/logs/itinerary-last-run.txt data/country-facts.json src/content/essentials src/content/essentials-i18n src/content/essentials-topics-i18n src/content/static-pages-i18n
          # Count PUBLISHED and HELD separately. The gate flips a defective new
          # post to draft before this commit, and format-post-list already skips
          # drafts — but this count didn't, so the report said "새 글 6개" over
          # five links and the owner rightly asked where the sixth went
          # (2026-08-28, kanazawa held by the crowd-claims gate).
          held=0; pub=0
          for f in $(git diff --cached --name-only --diff-filter=A -- src/content/posts | grep '\.md$' || true); do
            if grep -q '^draft: true' "$f"; then held=$((held+1)); else pub=$((pub+1)); fi
          done
          total=$(ls src/content/posts/*.md | wc -l | tr -d ' ')
          echo "new=$pub" >> "$GITHUB_OUTPUT"
          echo "held=$held" >> "$GITHUB_OUTPUT"
          echo "total=$total" >> "$GITHUB_OUTPUT"
          # Title + URL list of the newly-added posts, for the Telegram report.
          list=$(git diff --cached --name-only --diff-filter=A -- src/content/posts | grep '\.md$' | node scripts/format-post-list.mjs || true)
          {
            echo "list<<POSTS_EOF"
            echo "$list"
            echo "POSTS_EOF"
          } >> "$GITHUB_OUTPUT"
          if git diff --staged --quiet; then
            echo "No new posts this run."
          else
            git commit -m "content: auto-generated posts ($(date -u +%Y-%m-%d))"
            # Rebase on any commits pushed while this run was working, so a
            # concurrent push can't reject ours with a non-fast-forward.
            bash scripts/git-push-retry.sh
          fi

      # Asks Commons what each photo IS, rather than asking a model what it
      # looks like. The vision gate does not merely miss identity — it asserts
      # it: its own stored verdict for los-angeles-eggslut was MATCH, "Eggslut
      # storefront, branding visible", on a photo of the SINGAPORE branch, and
      # daegu-trendy-cafe was MATCH, "Modern café interior", on a café in
      # Mumbai. No model looking at a picture of a café can say which café. The
      # uploader already did, in the Commons record.
      #
      # --strip removes a hero the metadata places in another COUNTRY and leaves
      # the post published; a guide with no photo still answers its question,
      # and deleting posts is what cost 40% of the site's traffic on 07-26. A
      # different region inside the same country is only reported, never acted
      # on: the region list is flat, so it cannot tell that Puerto Princesa is
      # inside Palawan.
      - name: Verify photo identity against Commons
        continue-on-error: true
        run: node scripts/audit-photo-identity.mjs --strip 2>&1 | tail -30

      # --strip edits post files on the RUNNER — and the day's content
      # commit+push sits ABOVE this step, so for six days the strip removed
      # a Hong Kong congee-shop photo from the Gardena guide and the removal
      # evaporated with the runner (found 2026-08-14 via an unrelated
      # dark-tile alarm; daegu-trendy-cafe's Mumbai hero survived the same
      # way). Same lesson as the gate: a repair that runs after the push
      # never happened. Commit what the strip changed.
      #
      # A SEPARATE step, on purpose (Codex audit 2026-08-27): when this push
      # lived inside the continue-on-error step above, a push failure was
      # tolerated too — the strip's commit died with the runner and the job
      # stayed green. The audit may flake (Commons is a network away); losing
      # its committed repair may not. always() because a half-finished strip
      # is still a repair worth pushing; the diff guard makes it a no-op
      # when the strip did nothing.
      - name: Push what the photo strip changed
        if: always()
        run: |
          if ! git diff --quiet -- src/content/posts src/content/i18n; then
            git add src/content/posts src/content/i18n
            git commit -m "fix: strip wrong-place heroes (photo identity audit, $(date -u +%Y-%m-%d))"
            bash scripts/git-push-retry.sh
          fi

      - name: Validate content integrity
        id: validate
        continue-on-error: true
        run: node scripts/validate-content.mjs

      - name: Warn on content issues
        if: steps.validate.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          # `set -e -o pipefail` (GitHub default) would abort this step at the
          # failing command-substitution (validate exits 1 — the very case we warn
          # on), so the curl below never fires and the job goes red. `|| true`.
          MSG=$(node scripts/ko-report.mjs scripts/validate-content.mjs 2>&1 | head -25 || true)
          TXT=$(printf '⚠️ 콘텐츠 검증 경고 (일일 자동발행)\n%s' "$MSG")
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$TXT" >/dev/null || true

      # A hero can pass the vision gate and still be the wrong picture: "Chicago
      # from under the Cloud Gate" is a real photo of real skyscrapers, taken
      # while standing at the landmark, and it headed the Cloud Gate guide. Only
      # the file name gives that away, so it is read here and the failures are
      # queued into visual-audit.json for the next re-resolution run.
      - name: Warn if a hero photo was queued for replacement
        if: steps.heroaudit.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          MSG=$(node scripts/audit-hero-titles.mjs 2>&1 | grep -E '^(vantage|unusable)' | head -10 || true)
          TXT=$(printf '⚠️ 대표사진이 장소를 제대로 안 보여줍니다\n아래 글은 사진 교체 대기열에 넣었습니다.\n%s' "$MSG")
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$TXT" >/dev/null || true

      # English leaking into a localized page is the complaint the owner has
      # raised most often, and the audit that catches it existed for weeks
      # without anything running it — so it only ever ran when someone thought
      # to type the command. A check nobody triggers is not a check.
      # A regex that lost its backslashes is still valid and simply matches the
      # wrong thing, so it survives review and every diff. Four landed in one day;
      # one of them silently disabled a placeholder check for a week.
      - name: Lint regexes for lost backslashes
        continue-on-error: true
        run: node scripts/lint-regex.mjs

      # These two read the BUILT site, and CI never had one — the leak audit's
      # first scheduled run reported "빌드된 페이지가 없어 검사조차 못 했습니다"
      # for all four languages, which is a check that has never checked anything.
      # ~6 minutes of runner time buys the two audits only dist/ can answer.
      - name: Build site for output audits
        id: distbuild
        continue-on-error: true
        run: npm run build

      - name: Audit localized pages for English leaks
        id: i18nleaks
        if: steps.distbuild.outcome == 'success'
        continue-on-error: true
        run: node scripts/audit-i18n-leaks.mjs

      # Every /wall/ thumbnail the built pages reference must exist — the check
      # that would have caught the dark city tiles before any visitor did.
      - name: Check built pages' thumbnail references
        id: wallrefs
        if: steps.distbuild.outcome == 'success'
        continue-on-error: true
        run: node scripts/check-wall-refs.mjs

      # Does the photo belong to the place named beside it? The vision gate
      # checks a POST's hero against that post's venue and has never looked at
      # the images a COMPONENT assembles — the country tiles and the home
      # spotlight, which pick a photo by filtering posts. The spotlight took
      # its picture from the all-countries weekly rotation while its heading,
      # flag and links were hard-coded to Korea, so on 2026-08-06 the home page
      # showed the Alhambra captioned "South Korea". Three photo audits ran
      # that day; none could see it, because all three only read posts.
      - name: Check labels match their photos
        id: labelphoto
        if: steps.distbuild.outcome == 'success'
        continue-on-error: true
        run: node scripts/audit-label-photo-match.mjs

      - name: Warn on a label/photo mismatch
        if: steps.labelphoto.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then exit 0; fi
          TXT=$(printf '🖼 사진과 라벨이 어긋납니다\n\n어느 나라 이름 옆에 다른 나라 사진이 붙었습니다. 홈·목적지 페이지에서 바로 보이는 종류의 오류입니다.\n\nGitHub Actions 로그의 "Check labels match their photos" 단계를 확인하세요.')
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$TXT" >/dev/null || true

      # h1->h3 reads fine to the eye and as a broken outline to screen readers,
      # crawlers and page-quality scorers. 245 pages had it; every one traced to
      # a section label styled as text instead of written as a heading. Zero
      # today — this keeps the next component honest.
      - name: Check heading hierarchy
        if: steps.distbuild.outcome == 'success'
        continue-on-error: true
        run: node scripts/check-heading-skips.mjs

      # Each check in here is a design slip the owner once caught by eye. It was
      # written on 2026-08-09 to make them machine checks and then wired to
      # nothing, so it only ran when a session remembered it — and a session
      # runs it against whatever dist/ is lying around locally. Twice (08-11,
      # 08-12) that dist was days old and every finding was false; both evenings
      # were spent disproving fixes that were already live. This is the one place
      # a fresh dist exists daily, which is the only place the audit can tell the
      # truth. The script itself now refuses a stale dist rather than guessing.
      - name: Check design uniformity
        id: designuniform
        if: steps.distbuild.outcome == 'success'
        continue-on-error: true
        run: node scripts/audit-design-uniformity.mjs

      - name: Warn on a design regression
        if: steps.designuniform.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          MSG=$(node scripts/ko-report.mjs scripts/audit-design-uniformity.mjs 2>&1 | head -20 || true)
          TXT=$(printf '⚠️ 디자인이 예전 상태로 되돌아갔습니다\n%s' "$MSG")
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$TXT" >/dev/null || true

      - name: Warn on missing tile thumbnails
        if: steps.wallrefs.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          MSG=$(node scripts/check-wall-refs.mjs 2>&1 | head -12 || true)
          TXT=$(printf '⚠️ 일부 카드가 빈 상자로 보입니다 (썸네일 없음)\n%s' "$MSG")
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$TXT" >/dev/null || true

      - name: Warn on English leaks
        if: steps.i18nleaks.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          MSG=$(node scripts/ko-report.mjs scripts/audit-i18n-leaks.mjs 2>&1 | head -20 || true)
          TXT=$(printf '⚠️ 번역 페이지에 영어가 섞였습니다\n%s' "$MSG")
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$TXT" >/dev/null || true

      # Same accuracy gate scripts/build-itineraries.mjs already runs per-file
      # before ever renaming a temp file over a live target — this is the
      # belt-and-braces full sweep (catches a stale cache — e.g. DWELL-STALE/
      # LEG-STALE if the solver's math changed after a file was generated —
      # that a per-file pre-rename check can't see across the whole content set).
      - name: Validate itinerary content integrity
        id: validateitin
        continue-on-error: true
        run: node scripts/validate-itineraries.mjs

      - name: Warn on itinerary validation issues
        if: steps.validateitin.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          MSG=$(node scripts/ko-report.mjs scripts/validate-itineraries.mjs 2>&1 | head -25 || true)
          TXT=$(printf '⚠️ 일정 페이지 검증 경고 (일일 자동발행)\n%s' "$MSG")
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$TXT" >/dev/null || true

      # Announces a brand-new itinerary city the moment its page goes live —
      # scripts/build-itineraries.mjs prints "NEW_ITINERARY: <city> <days>d" to
      # stdout (captured in /tmp/itin.log above) only for a file that didn't
      # exist before this run. Never fails the job: guarded end to end, and not
      # gated on any earlier step's outcome (the build step is
      # continue-on-error, so a partial run can still have produced a real new
      # file worth announcing).
      - name: New itinerary city notice (Korean)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          [ -f /tmp/itin.log ] || exit 0
          grep -q '^NEW_ITINERARY:' /tmp/itin.log || exit 0
          # Derive "<Korean city name> <days>일 — <live URL>" lines the same way
          # the builder derives its own output filename (slugify(city) + "-" +
          # days + "-days") and using the same Korean city names already
          # localized for the site (src/i18n/places.json) — never re-guess or
          # hardcode a translation here.
          node -e '
            const fs = require("node:fs");
            import("./scripts/lib/slugify.mjs").then(({ slugify }) => {
              const log = fs.readFileSync("/tmp/itin.log", "utf8");
              let places = {};
              try { places = JSON.parse(fs.readFileSync("src/i18n/places.json", "utf8")); } catch {}
              const out = [];
              for (const m of log.matchAll(/^NEW_ITINERARY: (.+) (\d+)d$/gm)) {
                const [, city, days] = m;
                const ko = places[city]?.ko || city;
                const slug = `${slugify(city)}-${days}-days`;
                out.push(`🗺️ 새 일정 페이지 오픈: ${ko} ${days}일 — https://wanderatlasguides.com/itinerary/${slug}/`);
              }
              fs.writeFileSync("/tmp/newcity.txt", out.join("\n"), "utf8");
            }).catch(() => fs.writeFileSync("/tmp/newcity.txt", "", "utf8"));
          ' || true
          [ -s /tmp/newcity.txt ] || exit 0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
              --data-urlencode "text=$line" >/dev/null || true
          done < /tmp/newcity.txt || true

      - name: Audit translation language purity
        id: langaudit
        continue-on-error: true
        run: node scripts/audit-translations.mjs

      - name: Warn on language-mix issues
        if: steps.langaudit.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          MSG=$(node scripts/ko-report.mjs scripts/audit-translations.mjs 2>&1 | head -20 || true)
          TXT=$(printf '🌐 번역 언어 혼입 경고 (일일 자동발행)\n%s' "$MSG")
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$TXT" >/dev/null || true

      # How OLD is each open finding? Every defect fixed on 2026-08-06 had been
      # named correctly by one of these checkers for days — eleven unverified
      # photos, a duplicate event pair, a missing translation — and each daily
      # report read the same whether the finding was one day old or two weeks.
      # Ages make neglect visible; a finding that disappears is dropped from
      # the ledger. Never gates: it measures the other checks.
      - name: Track how long findings have been open
        id: ledger
        continue-on-error: true
        run: node scripts/track-issues.mjs | tee /tmp/ledger.log

      # The ledger IS the memory — a runner starts from a fresh checkout, so an
      # uncommitted ledger would report every finding as brand new every day
      # and nothing could ever age. Committed on its own, after the main commit
      # step, because it is written later in the run than that step executes.
      - name: Commit the issue ledger
        if: always()
        run: |
          if [ ! -f data/issue-ledger.json ]; then exit 0; fi
          git config user.name "Korea Travel Guide"
          git config user.email "bot@users.noreply.github.com"
          git add data/issue-ledger.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: issue ledger ($(date -u +%Y-%m-%d))"
          bash scripts/git-push-retry.sh

      - name: Escalate findings older than 3 days
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ ! -s /tmp/ledger.log ]; then exit 0; fi
          STALE=$(grep -o 'stale=[0-9]*' /tmp/ledger.log | head -1 | grep -o '[0-9]*$' || echo 0)
          if [ "${STALE:-0}" = "0" ]; then exit 0; fi
          {
            echo "🔴 Wander Atlas — 오래 방치된 지적 ${STALE}건"
            grep '🔴' /tmp/ledger.log || true
            echo ""
            echo "3일 넘게 같은 지적이 반복되고 있습니다. 클로드에게 '묵은 지적 처리해줘'라고 하세요."
          } > /tmp/stale.txt
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode "text@/tmp/stale.txt" >/dev/null || true

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          NEW: ${{ steps.commit.outputs.new }}
          HELD: ${{ steps.commit.outputs.held }}
          TOTAL: ${{ steps.commit.outputs.total }}
          NEW_LIST: ${{ steps.commit.outputs.list }}
        run: |
          # Explain a zero from what actually happened. The stock wording blames
          # the Places quota, and on 2026-08-05 that sent the owner to wait for a
          # reset which could not have helped: the queue was empty — every
          # region×topic combination had already been published — so the run had
          # nothing to attempt. A confident wrong diagnosis costs more than none.
          QUEUE=$(grep -o 'PUBLISH_SUMMARY queue=[0-9]*' /tmp/gen.log 2>/dev/null | head -1 | grep -o '[0-9]*$' || true)
          if [ "${QUEUE:-x}" = "0" ]; then
            export ZERO_NOTE="🚨 새 글 0개 — 발행 후보가 바닥났습니다(Places 한도와 무관). 지역×주제 조합을 모두 써서, data/countries.json 에 도시를 추가해야 다시 발행됩니다."
          elif [ -n "$QUEUE" ] && [ "$QUEUE" -lt 40 ] 2>/dev/null; then
            export ZERO_NOTE="⚠️ 남은 발행 후보 ${QUEUE}개 — 곧 바닥납니다. 도시 추가가 필요합니다."
          fi
          # Why the run stopped, in its own words (generate.mjs prints stop=…
          # since 2026-08-23, when a day of "한도 소진(또는 목표치 도달)" turned
          # out to be the Text Search quota — spent entirely by the 16:19 run
          # because that call was never budgeted). search-budget is NORMAL:
          # the run used its share and left the rest for the next job.
          STOP=$(grep -o 'PUBLISH_SUMMARY .*stop=[a-z0-9-]*' /tmp/gen.log 2>/dev/null | head -1 | grep -o 'stop=[a-z0-9-]*' | cut -d= -f2 || true)
          SEARCHES=$(grep -o 'searches=[0-9]*' /tmp/gen.log 2>/dev/null | head -1 | cut -d= -f2 || true)
          case "${STOP:-}" in
            search-budget) export ZERO_NOTE="${ZERO_NOTE:-}ℹ️ 오늘 이 작업 몫의 Places 검색 ${SEARCHES:-?}회를 다 써서 멈췄습니다(정상 — 남은 대상은 내일, 다음 작업 몫은 남아 있음). 검색 100회 중 글이 되는 건 약 13%라 하루 ~13편이 지금 상한입니다." ;;
            quota-429)     export ZERO_NOTE="${ZERO_NOTE:-}🚨 구글 Places가 429(한도 초과)로 거절 — 장부보다 먼저 바닥났습니다. 장부 밖에서 검색을 쓰는 작업이 있는지 확인 필요." ;;
          esac
          # The bulk-fill run has no Places share of its own — it lives on what
          # the four budgeted jobs leave over, which on a normal day is nothing.
          # "새 글 0개 ⚠️" every evening for that is noise the owner has to read
          # past to find real alarms (asked 2026-08-17: "한도를 잘 분배해둔거
          # 아니었어?" — it was; the report just made normal look like failure).
          # A bulk run that published nothing BECAUSE its share was 0 says
          # nothing; every other zero (queue empty, API dead) still reports.
          SHARE=$(grep -o 'Places 예산: publish 몫 [0-9]*회' /tmp/gen.log 2>/dev/null | head -1 | grep -o '[0-9]*회' | tr -d '회' || true)
          SSHARE=$(grep -o 'Places 검색 예산: [a-z]* 몫 [0-9]*회' /tmp/gen.log 2>/dev/null | head -1 | grep -o '[0-9]*회' | tr -d '회' || true)
          # The day guard (lib/slot-served.mjs) exits before generating when
          # today's KST batch already went out. Without a note the report fell
          # through to the stock "Places 한도 소진" line and the owner read a
          # working guard as a broken pipeline (2026-08-30, 7h-late cron).
          if grep -q "SLOT_SERVED: publish.yml" /tmp/gen.log 2>/dev/null; then
            export ZERO_NOTE="ℹ️ 새 글 0개 — 오늘(KST) 몫은 이미 발행됐습니다. 지각 배달된 예약 실행이라 중복 없이 건너뛰었습니다(정상)."
          fi
          # If the commit step did not succeed, the posts exist only inside this
          # runner and vanish with it. On 2026-08-27 a rebase conflict lost 36 of
          # them, and this report still announced "새 글 36개" with thirty links —
          # every one a 404. The counts come from steps.commit.outputs, which are
          # written before the push is attempted, so they outlive its failure.
          # Say what is true instead: nothing was saved.
          if [ "${{ steps.commit.outcome }}" != "success" ] && [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            TXT=$(printf '🚨 발행이 저장되지 않았습니다\n\n글 %s개를 만들었지만 저장(커밋)에 실패해서 사이트에는 하나도 올라가지 않았습니다.\n만든 글은 사라졌고 API 비용만 나갔습니다.\n\n대개 다른 작업과 같은 파일이 겹친 충돌입니다. 다음 실행에서 다시 만들어집니다.\n실행 기록: %s/actions/runs/%s' "${NEW:-?}" "${{ github.server_url }}/${{ github.repository }}" "${{ github.run_id }}")
            curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
              --data-urlencode "text=$TXT" >/dev/null || true
          elif [ "${{ inputs.label || 'Daily publish' }}" = "Backfill" ] && [ "${NEW:-0}" = "0" ] && { [ "${SHARE:-x}" = "0" ] || [ "${SSHARE:-x}" = "0" ]; } && [ "${QUEUE:-x}" != "0" ]; then
            echo "bulk run: Places share 0 today, nothing to attempt — no Telegram (normal)"
          else
            bash scripts/notify-telegram.sh "${{ inputs.label || 'Daily publish' }}"
          fi
          # Steps that failed softly get their own message rather than riding on
          # the zero-note, which only appears when nothing was published. A run
          # can publish 16 posts and still have lost every translation.
          if [ -s /tmp/soft-fail.txt ] && [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            SOFT=$(paste -sd', ' /tmp/soft-fail.txt)
            # Name the cause when the logs already state it. On 2026-08-30 all
            # 104 translation failures were one thing — the Anthropic account's
            # spend cap, which states its own reset time — and the stock line
            # ("대개 일시 오류… 이틀 연속이면 키 만료 의심") sent the owner looking
            # for a dead key instead of a limit that lifts on its own.
            WHY=""
            if grep -qh "reached your specified API usage limits" /tmp/translate.log /tmp/gen.log 2>/dev/null; then
              WHEN=$(grep -ho "regain access on [0-9-]* at [0-9:]* UTC" /tmp/translate.log /tmp/gen.log 2>/dev/null | head -1)
              WHY=$(printf '\n\n원인 확인: Anthropic API 사용 한도(월 상한)에 도달했습니다. 키 만료가 아니라 한도이며, 한도가 풀리면(%s) 다음 실행이 자동으로 채웁니다. 더 빨리 재개하려면 Anthropic 콘솔에서 상한을 올려 주세요.' "${WHEN:-콘솔의 리셋 시각}")
            fi
            TXT=$(printf '⚠️ 발행은 됐지만 일부 단계가 실패했습니다\n실패: %s\n\n번역·일정 등이 빠졌을 수 있습니다. 대개 API 일시 오류이고 다음 실행에서 채워지지만, 같은 단계가 이틀 연속이면 키 만료를 의심하세요.%s' "$SOFT" "$WHY")
            curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
              --data-urlencode "text=$TXT" >/dev/null || true
          fi
