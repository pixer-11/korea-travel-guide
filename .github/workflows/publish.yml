name: Auto-generate & publish posts

# Runs unattended on a schedule. Generates new posts, commits them,
# and the deploy (Cloudflare Pages / Vercel) picks up the push.
on:
  schedule:
    # 07:19 UTC = 16:19 KST — right AFTER Google's hidden facts-quota reset
    # (16:00 KST / midnight PT), so the daily run always starts on a fresh
    # quota window and manual afternoon runs can't starve it. Off the hour
    # because GitHub drops :00 crons.
    - cron: '19 7 * * *'
  workflow_dispatch: # lets you run it manually from the Actions tab
    inputs:
      count:
        description: 'How many posts to generate this run (daily auto uses 16)'
        required: false
        default: '50'
      country:
        description: 'Optional: fill ONE country only, e.g. Japan (blank = all active)'
        required: false
        default: ''
      target:
        description: 'Optional: stop each country at this many guides (blank = no cap)'
        required: false
        default: ''
  # backfill.yml calls THIS workflow instead of keeping its own copy of the
  # pipeline. It used to be a parallel copy that generated and committed posts
  # without any of the steps below it — no content validation, no itinerary
  # rebuild, no translation audit, none of the follow-up translations. So the
  # bulk job was about to publish 25 posts a day, for weeks, through a path where
  # every guard added here simply did not exist. One pipeline, called twice, is
  # the only version of this that stays true after the next fix lands in one
  # place and not the other.
  workflow_call:
    inputs:
      count:
        description: 'Posts to generate this run'
        required: false
        type: string
      country:
        required: false
        type: string
      target:
        description: 'Per-country guide cap (TARGET_PER_COUNTRY)'
        required: false
        type: string
      label:
        description: 'Telegram label: "Daily publish" or "Backfill"'
        required: false
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate posts
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          # Busy/quiet hours — the one dataset here that Google Maps does not
          # expose, and therefore the only fact on these pages an AI assistant
          # cannot answer from its own Maps grounding. generate.mjs has fetched it
          # since July, but the key was never passed in, and the code treats a
          # missing key as a silent no-op — so every post published since then
          # shipped without it and nothing reported a problem. Verified: 0 of the
          # 16 posts published 2026-07-28 carry busyness data.
          BESTTIME_API_KEY: ${{ secrets.BESTTIME_API_KEY }}
          # `inputs` covers both workflow_dispatch and workflow_call; it is empty
          # on the schedule, which is what the fallback is for.
          POSTS_PER_RUN: ${{ inputs.count || '16' }}
          COUNTRY: ${{ inputs.country }}
          # Blank on the daily run (no cap); the bulk caller passes 58 so each
          # country stops at the target instead of the biggest one running away.
          TARGET_PER_COUNTRY: ${{ inputs.target }}
          MIN_RATING: '4.0'
          MIN_REVIEWS: '50'
        run: |
          set -o pipefail
          npm run generate 2>&1 | tee /tmp/gen.log

      # An exhausted BestTime account looks exactly like a quiet day unless someone
      # says so: the fetch fails softly by design, so publishing never blocks on it.
      # That softness is why a missing key went unnoticed for days. If the run was
      # locked out — no key, no credits, key rejected — the owner hears about it the
      # same morning, in Korean, because it is a paid account that needs a decision.
      - name: Warn if busy-times data was blocked
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          grep -q 'BUSYTIMES-BLOCKED' /tmp/gen.log 2>/dev/null || exit 0
          DETAIL=$(grep -m1 '📊 busy-times:' /tmp/gen.log | sed 's/.*busy-times: //')
          if grep -q 'BESTTIME_API_KEY not set' /tmp/gen.log; then
            CAUSE='BestTime API 키가 설정되지 않았습니다 (GitHub Secrets 확인 필요).'
          elif grep -q 'credits exhausted' /tmp/gen.log; then
            CAUSE='BestTime 크레딧이 소진되었습니다 — 충전이 필요합니다.'
          else
            CAUSE='BestTime 키가 거부되었습니다 — 키가 만료되었거나 잘못되었습니다.'
          fi
          TXT=$(printf '⚠️ 혼잡시간 데이터 누락\n%s\n\n오늘 발행된 글에 "한산한 시간" 정보가 들어가지 않았습니다. 이 항목은 구글 지도에 없는 우리만의 데이터입니다.\n집계: %s' "$CAUSE" "${DETAIL:-확인 불가}")
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$TXT" >/dev/null || true

      # Translate the newly-generated posts into ko/ja/es/zh BEFORE committing, so
      # every post ships with its translations in the same push (no English-only
      # window). Resumable: only untranslated posts are done. continue-on-error so
      # an API hiccup still ships the English + whatever translated — the rest are
      # picked up on the next run (the script skips what already exists).
      - name: Translate new posts (ko/ja/es/zh)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRANSLATE_CONCURRENCY: '8'
        # `|| echo` leaves a trace instead of vanishing. continue-on-error keeps
        # one dead step from binning a night's work, but it also leaves
        # job.status at 'success' — so an expired ANTHROPIC_API_KEY could ship 16
        # English-only posts with no itineraries and report "✅ 상태: 성공"
        # (found 2026-08-05). The final Telegram now names whatever failed.
        run: node scripts/translate-posts.mjs || echo "글 번역" >> /tmp/soft-fail.txt

      # Country/city NAMES for ko/ja/es/zh. Idempotent (skips what it already has),
      # so this only costs anything when a new country or city appears — without it
      # a newly added destination shows its English name on every localized page.
      - name: Translate new place names (ko/ja/es/zh)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/build-place-names.mjs || echo "장소명 번역" >> /tmp/soft-fail.txt

      # Country one-line blurbs. Also idempotent — only new countries (or an edited
      # English blurb) cost anything, so this is a no-op on a normal day.
      - name: Translate country blurbs (ko/ja/es/zh)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/translate-country-blurbs.mjs || echo "국가 소개 번역" >> /tmp/soft-fail.txt

      # Region intro fact-boxes ("getting there / how long") for any city that
      # just got its FIRST post — web-search-grounded EN + 4 translations.
      # Idempotent: covered cities are skipped, so this is a no-op most days.
      - name: Generate region intros for new cities
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CONCURRENCY: '2'
        run: node scripts/gen-region-intros.mjs || echo "지역 소개" >> /tmp/soft-fail.txt

      # Climate/holiday facts and the country essentials guides are refreshed on
      # monthly crons, which is right for keeping them current and wrong for a
      # country that has just appeared: added on the 4th, it waits until the 3rd
      # of the next month for climate — and no climate means no when-to-go pages
      # at all, so twelve pages per language simply do not exist for a month.
      # That is not hypothetical: Taiwan, Malaysia, India and the Philippines
      # published their first guides on 2026-07-26, one day after the refresh ran,
      # and sat without climate data until it was noticed by hand three days later.
      #
      # So the gap is closed here rather than waited out. Both steps no-op when
      # nothing is missing: refresh-country-facts uses free APIs, and
      # build-essentials skips any country whose guide already exists.
      - name: Fill facts for newly added countries
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          MISSING=$(node -e "
            const cf = require('./data/country-facts.json').countries || {};
            const cs = require('./data/countries.json').countries.filter((c) => c.active);
            const fs = require('fs');
            const ess = fs.existsSync('src/content/essentials')
              ? fs.readdirSync('src/content/essentials').map((f) => f.replace('.md', ''))
              : [];
            const noClimate = cs.filter((c) => !((cf[c.name] || {}).climate || []).length);
            const noEssentials = cs.filter((c) => !ess.includes(c.slug));
            console.log(JSON.stringify({
              climate: noClimate.map((c) => c.name),
              essentials: noEssentials.map((c) => c.name),
            }));
          ")
          echo "누락 현황: $MISSING"
          if echo "$MISSING" | grep -q '"climate":\[\]'; then
            echo "기후·공휴일: 빠진 나라 없음 — 건너뜁니다."
          else
            node scripts/refresh-country-facts.mjs
          fi
          if echo "$MISSING" | grep -q '"essentials":\[\]'; then
            echo "나라 실용정보: 빠진 나라 없음 — 건너뜁니다."
          else
            node scripts/build-essentials.mjs
          fi

      # Assembles/refreshes src/content/itineraries/<city>-<n>-days.md for any
      # region that clears the itinerary gates (src/lib/itinerary.mjs gateFor).
      # Self-validating (runs scripts/validate-itineraries.mjs on a temp file
      # before ever touching a real target — see that script's header) and
      # capped to ≤2 brand-new cities/7 days via data/itineraries-state.json,
      # so this can never spam new pages. continue-on-error so a bad Claude
      # response for one city can't block the rest of the daily publish.
      # set -o pipefail: without it, the pipeline's exit status is tee's, so a
      # crashed node still reports SUCCESS with a truncated log (same reasoning
      # as geocode-placeless.yml).
      - name: Build/refresh itinerary pages
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          node scripts/build-itineraries.mjs 2>&1 | tee /tmp/itin.log

      # Prose-only translation (ko/ja/es/zh) of whatever itinerary files exist —
      # resumable, skips up-to-date files, re-translates when sourceHash differs.
      - name: Translate itineraries (ko/ja/es/zh)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/translate-itineraries.mjs || echo "일정표 번역" >> /tmp/soft-fail.txt

      # The phone/coords backfills correct post coordinates most days, which
      # leaves the itineraries' cached leg distances stale — and the validator
      # further down then sent the owner the same LEG-STALE warning every single
      # morning for a number nobody had to decide anything about. Re-syncing here
      # (before the commit, so the fix is actually saved) keeps that warning for
      # cases that need a human. It only rewrites `km`; a changed walk time or
      # travel mode is deliberately left to the validator, because the prose is
      # written against those two.
      - name: Re-sync itinerary leg distances to current coordinates
        continue-on-error: true
        run: node scripts/refresh-itinerary-legs.mjs --apply

      # The dev box has no gh CLI and Actions logs need auth, so the build run's
      # log is committed as an artifact file — same reasoning/pattern as
      # data/logs/geocode-last-run.txt in geocode-placeless.yml.
      - name: Save itinerary build log to repo
        run: |
          mkdir -p data/logs
          cp /tmp/itin.log data/logs/itinerary-last-run.txt 2>/dev/null || echo "(no itinerary log this run)" > data/logs/itinerary-last-run.txt

      - name: Build hero photo-wall thumbnails
        run: node scripts/build-wall.mjs

      # Runs BEFORE the commit on purpose. It sat after it for one day, and in
      # that position the queue it writes was destroyed with the runner every
      # single time — an audit that changed nothing and told nobody.
      - name: Audit hero file names
        id: heroaudit
        continue-on-error: true
        run: node scripts/audit-hero-titles.mjs --fix

      # THE GATE. Every validator below this file used to run AFTER the commit and
      # push, which meant a post with the wrong photo, or advice to visit a venue
      # on the day it is shut, went live first and produced a warning second. The
      # checks were real; their position made them a post-mortem.
      #
      # This runs before the commit and flips any offending post to draft, so it
      # never reaches the site. It does not fail the run — one bad post must not
      # throw away fifteen good ones and a day of Places quota. Scoped to posts
      # THIS run added, so a pre-existing defect is left to the repair patrol
      # rather than silently unpublishing a page that has been live for weeks.
      - name: Hold back defective posts (publish gate)
        id: gate
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/gate-new-posts.mjs --since=HEAD 2>&1 | tee /tmp/gate.log

      # The day's output must not shrink because the gate caught something. If it
      # held N posts back, generate exactly N replacements from the queue and put
      # THOSE through the same gate. One top-up round only — a queue that keeps
      # producing rejects is a problem to be told about, not to loop on.
      - name: Top up the held-back posts
        if: steps.gate.outputs.held != '' && steps.gate.outputs.held != '0'
        continue-on-error: true
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          BESTTIME_API_KEY: ${{ secrets.BESTTIME_API_KEY }}
          POSTS_PER_RUN: ${{ steps.gate.outputs.held }}
          COUNTRY: ${{ inputs.country }}
          TARGET_PER_COUNTRY: ${{ inputs.target }}
          MIN_RATING: '4.0'
          MIN_REVIEWS: '50'
        run: |
          set -o pipefail
          npm run generate 2>&1 | tee -a /tmp/gen.log
          node scripts/translate-posts.mjs || true
          # Replacement posts are generated AFTER the wall-thumbnail step ran,
          # so without this their cards rendered blank (bordeaux-miroir-d-eau,
          # first gated run).
          node scripts/build-wall.mjs || true
          node scripts/gate-new-posts.mjs --since=HEAD 2>&1 | tee -a /tmp/gate.log

      # The gate's Telegram message promises the held posts come back fixed;
      # this is the machinery behind that sentence. Hours-contradiction drafts
      # are rewritten against the real hours, re-audited, republished only when
      # clean, and their four translations refreshed. Photo quarantines are left
      # to the photo patrol, which has the API keys this step does not.
      - name: Repair and republish held posts
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/repair-held-posts.mjs 2>&1 | tee -a /tmp/gate.log

      - name: Report held-back posts (Korean)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          # A checker that DIED is more urgent than a post that was held: the gate
          # cannot have been applied, so tonight's batch went out unchecked. This
          # used to be invisible — a crashed checker contributed no findings and
          # the gate printed "every post passed" (2026-08-05).
          if grep -q 'GATE-CHECKER-CRASHED' /tmp/gate.log 2>/dev/null; then
            BODY=$(sed -n '/GATE-CHECKER-CRASHED/,$p' /tmp/gate.log | head -12)
            TXT=$(printf '🚨 발행 검사기가 죽었습니다 — 오늘 글은 제대로 검사되지 않았습니다\n%s\n\nGitHub Actions 로그를 확인해 주세요.' "$BODY")
            curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
              --data-urlencode "text=$TXT" >/dev/null || true
          fi
          grep -q 'HELD BACK' /tmp/gate.log 2>/dev/null || exit 0
          BODY=$(sed -n '/HELD BACK/,$p' /tmp/gate.log | head -30)
          TXT=$(printf '🚧 문제가 있는 글을 발행 직전에 걸러냈습니다\n%s' "$BODY")
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$TXT" >/dev/null || true

      - name: Commit new posts
        id: commit
        run: |
          git config user.name "content-bot"
          git config user.email "bot@users.noreply.github.com"
          # country-facts.json and the essentials guides are here because the
          # step above can create them for a newly added country; without them
          # staged, that work is generated and then thrown away on every run.
          git add data/visual-audit.json src/content/posts src/content/i18n data/published.json public/wall data/wall.json src/i18n/places.json src/i18n/country-blurbs.json src/i18n/regions.json src/content/itineraries src/content/itineraries-i18n data/itineraries-state.json data/logs/itinerary-last-run.txt data/country-facts.json src/content/essentials src/content/essentials-i18n
          new=$(git diff --cached --name-only --diff-filter=A -- src/content/posts | grep -c '\.md$' || true)
          total=$(ls src/content/posts/*.md | wc -l | tr -d ' ')
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "total=$total" >> "$GITHUB_OUTPUT"
          # Title + URL list of the newly-added posts, for the Telegram report.
          list=$(git diff --cached --name-only --diff-filter=A -- src/content/posts | grep '\.md$' | node scripts/format-post-list.mjs || true)
          {
            echo "list<<POSTS_EOF"
            echo "$list"
            echo "POSTS_EOF"
          } >> "$GITHUB_OUTPUT"
          if git diff --staged --quiet; then
            echo "No new posts this run."
          else
            git commit -m "content: auto-generated posts ($(date -u +%Y-%m-%d))"
            # Rebase on any commits pushed while this run was working, so a
            # concurrent push can't reject ours with a non-fast-forward.
            bash scripts/git-push-retry.sh
          fi

      - name: Validate content integrity
        id: validate
        continue-on-error: true
        run: node scripts/validate-content.mjs

      - name: Warn on content issues
        if: steps.validate.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          # `set -e -o pipefail` (GitHub default) would abort this step at the
          # failing command-substitution (validate exits 1 — the very case we warn
          # on), so the curl below never fires and the job goes red. `|| true`.
          MSG=$(node scripts/ko-report.mjs scripts/validate-content.mjs 2>&1 | head -25 || true)
          TXT=$(printf '⚠️ 콘텐츠 검증 경고 (일일 자동발행)\n%s' "$MSG")
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$TXT" >/dev/null || true

      # A hero can pass the vision gate and still be the wrong picture: "Chicago
      # from under the Cloud Gate" is a real photo of real skyscrapers, taken
      # while standing at the landmark, and it headed the Cloud Gate guide. Only
      # the file name gives that away, so it is read here and the failures are
      # queued into visual-audit.json for the next re-resolution run.
      - name: Warn if a hero photo was queued for replacement
        if: steps.heroaudit.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          MSG=$(node scripts/audit-hero-titles.mjs 2>&1 | grep -E '^(vantage|unusable)' | head -10 || true)
          TXT=$(printf '⚠️ 대표사진이 장소를 제대로 안 보여줍니다\n아래 글은 사진 교체 대기열에 넣었습니다.\n%s' "$MSG")
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$TXT" >/dev/null || true

      # English leaking into a localized page is the complaint the owner has
      # raised most often, and the audit that catches it existed for weeks
      # without anything running it — so it only ever ran when someone thought
      # to type the command. A check nobody triggers is not a check.
      # A regex that lost its backslashes is still valid and simply matches the
      # wrong thing, so it survives review and every diff. Four landed in one day;
      # one of them silently disabled a placeholder check for a week.
      - name: Lint regexes for lost backslashes
        continue-on-error: true
        run: node scripts/lint-regex.mjs

      # These two read the BUILT site, and CI never had one — the leak audit's
      # first scheduled run reported "빌드된 페이지가 없어 검사조차 못 했습니다"
      # for all four languages, which is a check that has never checked anything.
      # ~6 minutes of runner time buys the two audits only dist/ can answer.
      - name: Build site for output audits
        id: distbuild
        continue-on-error: true
        run: npm run build

      - name: Audit localized pages for English leaks
        id: i18nleaks
        if: steps.distbuild.outcome == 'success'
        continue-on-error: true
        run: node scripts/audit-i18n-leaks.mjs

      # Every /wall/ thumbnail the built pages reference must exist — the check
      # that would have caught the dark city tiles before any visitor did.
      - name: Check built pages' thumbnail references
        id: wallrefs
        if: steps.distbuild.outcome == 'success'
        continue-on-error: true
        run: node scripts/check-wall-refs.mjs

      # h1->h3 reads fine to the eye and as a broken outline to screen readers,
      # crawlers and page-quality scorers. 245 pages had it; every one traced to
      # a section label styled as text instead of written as a heading. Zero
      # today — this keeps the next component honest.
      - name: Check heading hierarchy
        if: steps.distbuild.outcome == 'success'
        continue-on-error: true
        run: node scripts/check-heading-skips.mjs

      - name: Warn on missing tile thumbnails
        if: steps.wallrefs.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          MSG=$(node scripts/check-wall-refs.mjs 2>&1 | head -12 || true)
          TXT=$(printf '⚠️ 일부 카드가 빈 상자로 보입니다 (썸네일 없음)\n%s' "$MSG")
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$TXT" >/dev/null || true

      - name: Warn on English leaks
        if: steps.i18nleaks.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          MSG=$(node scripts/ko-report.mjs scripts/audit-i18n-leaks.mjs 2>&1 | head -20 || true)
          TXT=$(printf '⚠️ 번역 페이지에 영어가 섞였습니다\n%s' "$MSG")
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$TXT" >/dev/null || true

      # Same accuracy gate scripts/build-itineraries.mjs already runs per-file
      # before ever renaming a temp file over a live target — this is the
      # belt-and-braces full sweep (catches a stale cache — e.g. DWELL-STALE/
      # LEG-STALE if the solver's math changed after a file was generated —
      # that a per-file pre-rename check can't see across the whole content set).
      - name: Validate itinerary content integrity
        id: validateitin
        continue-on-error: true
        run: node scripts/validate-itineraries.mjs

      - name: Warn on itinerary validation issues
        if: steps.validateitin.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          MSG=$(node scripts/ko-report.mjs scripts/validate-itineraries.mjs 2>&1 | head -25 || true)
          TXT=$(printf '⚠️ 일정 페이지 검증 경고 (일일 자동발행)\n%s' "$MSG")
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$TXT" >/dev/null || true

      # Announces a brand-new itinerary city the moment its page goes live —
      # scripts/build-itineraries.mjs prints "NEW_ITINERARY: <city> <days>d" to
      # stdout (captured in /tmp/itin.log above) only for a file that didn't
      # exist before this run. Never fails the job: guarded end to end, and not
      # gated on any earlier step's outcome (the build step is
      # continue-on-error, so a partial run can still have produced a real new
      # file worth announcing).
      - name: New itinerary city notice (Korean)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          [ -f /tmp/itin.log ] || exit 0
          grep -q '^NEW_ITINERARY:' /tmp/itin.log || exit 0
          # Derive "<Korean city name> <days>일 — <live URL>" lines the same way
          # the builder derives its own output filename (slugify(city) + "-" +
          # days + "-days") and using the same Korean city names already
          # localized for the site (src/i18n/places.json) — never re-guess or
          # hardcode a translation here.
          node -e '
            const fs = require("node:fs");
            import("./scripts/lib/slugify.mjs").then(({ slugify }) => {
              const log = fs.readFileSync("/tmp/itin.log", "utf8");
              let places = {};
              try { places = JSON.parse(fs.readFileSync("src/i18n/places.json", "utf8")); } catch {}
              const out = [];
              for (const m of log.matchAll(/^NEW_ITINERARY: (.+) (\d+)d$/gm)) {
                const [, city, days] = m;
                const ko = places[city]?.ko || city;
                const slug = `${slugify(city)}-${days}-days`;
                out.push(`🗺️ 새 일정 페이지 오픈: ${ko} ${days}일 — https://wanderatlasguides.com/itinerary/${slug}/`);
              }
              fs.writeFileSync("/tmp/newcity.txt", out.join("\n"), "utf8");
            }).catch(() => fs.writeFileSync("/tmp/newcity.txt", "", "utf8"));
          ' || true
          [ -s /tmp/newcity.txt ] || exit 0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
              --data-urlencode "text=$line" >/dev/null || true
          done < /tmp/newcity.txt || true

      - name: Audit translation language purity
        id: langaudit
        continue-on-error: true
        run: node scripts/audit-translations.mjs

      - name: Warn on language-mix issues
        if: steps.langaudit.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          MSG=$(node scripts/ko-report.mjs scripts/audit-translations.mjs 2>&1 | head -20 || true)
          TXT=$(printf '🌐 번역 언어 혼입 경고 (일일 자동발행)\n%s' "$MSG")
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$TXT" >/dev/null || true

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          NEW: ${{ steps.commit.outputs.new }}
          TOTAL: ${{ steps.commit.outputs.total }}
          NEW_LIST: ${{ steps.commit.outputs.list }}
        run: |
          # Explain a zero from what actually happened. The stock wording blames
          # the Places quota, and on 2026-08-05 that sent the owner to wait for a
          # reset which could not have helped: the queue was empty — every
          # region×topic combination had already been published — so the run had
          # nothing to attempt. A confident wrong diagnosis costs more than none.
          QUEUE=$(grep -o 'PUBLISH_SUMMARY queue=[0-9]*' /tmp/gen.log 2>/dev/null | head -1 | grep -o '[0-9]*$' || true)
          if [ "${QUEUE:-x}" = "0" ]; then
            export ZERO_NOTE="🚨 새 글 0개 — 발행 후보가 바닥났습니다(Places 한도와 무관). 지역×주제 조합을 모두 써서, data/countries.json 에 도시를 추가해야 다시 발행됩니다."
          elif [ -n "$QUEUE" ] && [ "$QUEUE" -lt 40 ] 2>/dev/null; then
            export ZERO_NOTE="⚠️ 남은 발행 후보 ${QUEUE}개 — 곧 바닥납니다. 도시 추가가 필요합니다."
          fi
          bash scripts/notify-telegram.sh "${{ inputs.label || 'Daily publish' }}"
          # Steps that failed softly get their own message rather than riding on
          # the zero-note, which only appears when nothing was published. A run
          # can publish 16 posts and still have lost every translation.
          if [ -s /tmp/soft-fail.txt ] && [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            SOFT=$(paste -sd', ' /tmp/soft-fail.txt)
            TXT=$(printf '⚠️ 발행은 됐지만 일부 단계가 실패했습니다\n실패: %s\n\n번역·일정 등이 빠졌을 수 있습니다. 대개 API 일시 오류이고 다음 실행에서 채워지지만, 같은 단계가 이틀 연속이면 키 만료를 의심하세요.' "$SOFT")
            curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
              --data-urlencode "text=$TXT" >/dev/null || true
          fi
