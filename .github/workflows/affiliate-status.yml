name: Check affiliate program status

# Once a day, follow every affiliate link the site ships (Travelpayouts
# shortlinks found in src/, the /go/klook hotel route, the partner widgets) and
# confirm each still reaches the partner with our marker 754088 attached.
# A broken link fails the job, and job-failure-alert.yml (which lists this
# workflow BY NAME — keep the name) sends the Telegram alert.
#
# Until 2026-09-29 this waited for the Hotellook widget to "go live" and opened
# a GitHub issue when it did. Hotellook closed on 2025-10-20 and the site stopped
# using it on 09-23, so that check could only ever print PENDING. The Kiwitaxi
# typo of 07-21 (six days of 404, found by chance) is the kind of break this
# catches now.
on:
  schedule:
    - cron: '11 7 * * *' # 07:11 UTC daily (off the hour)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Follow every affiliate link and check the marker
        run: node scripts/check-affiliate-status.mjs
