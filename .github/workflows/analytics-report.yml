name: Daily analytics report (Telegram)

# Pulls yesterday's Cloudflare Web Analytics and sends a summary to Telegram.
on:
  schedule:
    - cron: '7 0 * * *' # 00:07 UTC = 09:07 KST — so the report lands ~9am Korea time.
                        # Off the hour because GitHub drops/delays :00 crons. GitHub's
                        # own scheduling delay (10-40m) also lets yesterday's UTC data settle.
  workflow_dispatch:

# actions:read lets the slot guard (lib/slot-served.mjs) list this workflow's
# own runs — the report went out twice on 2026-08-29 when a watchdog rescue
# and GitHub's 6.8h-late original both ran the same slot.
permissions:
  contents: read
  actions: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Send analytics report to Telegram
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          # Plausible (cookieless) — detailed report incl. affiliate-click events.
          # PLAUSIBLE_SITE_ID = the domain you added in Plausible (e.g. wanderatlasguides.com).
          PLAUSIBLE_API_KEY: ${{ secrets.PLAUSIBLE_API_KEY }}
          PLAUSIBLE_SITE_ID: ${{ secrets.PLAUSIBLE_SITE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/analytics-report.mjs
