name: Threads daily material

# Every morning (07:25 KST) write 3 Threads snippet options from one blog post
# and Telegram them to the owner for copy-paste during the account warm-up
# phase. State (used slugs) is committed so posts don't repeat.
on:
  schedule:
    # Three attempts, not one. A GitHub scheduled run is best-effort — it is
    # dropped under load — and on 2026-08-07 this job silently did not fire
    # after six consecutive mornings of working. The owner noticed the missing
    # message; nothing in the repo did. Only the first attempt that actually
    # runs sends anything: threads-daily.mjs stamps the KST day it sent on and
    # the later attempts exit immediately.
    - cron: '25 22 * * *' # 22:25 UTC = 07:25 KST (next day)
    - cron: '25 23 * * *' # 08:25 KST — backup
    - cron: '25 1 * * *'  # 10:25 KST — last chance
  workflow_dispatch:
    inputs:
      force:
        description: 'true = send again today (fresh material + fresh posts)'
        required: false

permissions:
  contents: write

# One at a time, never cancelled: the day guard reads checkout-local state, so
# two overlapping runs both see "not sent yet" and both post — to the live
# Instagram/Threads accounts, where a duplicate is public. On 2026-08-27 the
# GitHub scheduler fired runs hours late and minutes apart (Codex audit B,
# same evening), so overlap is a real morning, not a theory. Queueing is safe:
# the second run checks out the first run's pushed state and exits on the guard.
concurrency:
  group: threads-daily
  cancel-in-progress: false

jobs:
  material:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate and send
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # The carousel's fallback photo sources. Commons has nothing for a café
          # or a restaurant, so venuePhotoCandidates() is what fills those posts'
          # slides — and with no keys it returns an empty array without logging
          # anything, so that half of the carousel has never run in CI. Same
          # shape as the BestTime key that went missing for days.
          FOURSQUARE_API_KEY: ${{ secrets.FOURSQUARE_API_KEY }}
          FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
          # Auto-posting (2026-08-27): bootstrap 60-day tokens + the owner-typed
          # AES key for data/social-token.enc, where the LIVE tokens persist
          # across refreshes (a workflow cannot write GitHub Secrets). CF pair
          # uploads the day's card images to R2 so Meta can fetch them by URL.
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          SOCIAL_TOKEN_KEY: ${{ secrets.SOCIAL_TOKEN_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: node scripts/threads-daily.mjs ${{ inputs.force == 'true' && '--force' || '' }}

      - name: Commit state
        # always(): the script now exits red when a channel failed to post,
        # but by then it has already saved what DID succeed (posted-channel
        # markers, refreshed tokens). Skipping this commit on failure would
        # forget a successful post and double-post it on the next attempt —
        # the exact opposite of what the red exit is for. The diff guard
        # below keeps failure-before-any-state runs a no-op.
        if: always()
        run: |
          git config user.name "content-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/threads-daily.json data/social-token.enc
          if git diff --staged --quiet; then
            echo "No state change."
          else
            git commit -m "chore: threads material state ($(date -u +%Y-%m-%d))"
            bash scripts/git-push-retry.sh
          fi
