name: Broken-link check

# Weekly crawl of the BUILT site for broken internal links (404s inside dist).
# External links are skipped — third-party flakiness (rate limits, geo-blocks)
# would drown real signal; our own 404s are what silently hurt readers + SEO.
on:
  schedule:
    - cron: '25 16 * * 2' # Tue 16:25 UTC = Wed 01:25 KST (off the hour)
  workflow_dispatch:

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build site
        env:
          NODE_OPTIONS: --max-old-space-size=8192   # default ~4 GB OOMs (10-27)
        run: npm run build

      - name: Crawl internal links
        id: crawl
        run: |
          set -o pipefail
          # Until 2026-11-04 this served dist with `serve` and crawled it with
          # linkinator over HTTP at 12-way concurrency. The site outgrew it:
          # 3 h → 3 h 41 m → 4 h 42 m, and the 11-04 run hit GitHub's 6-hour job
          # limit mid-crawl and reported nothing. `serve` said 200 exactly when
          # the file existed, so check-dist-links.mjs asks dist directly — same
          # verdict, every page in dist instead of only those reachable from the
          # home page, about three minutes. What the crawl learned is kept there:
          # internal links are absolute (https://wanderatlasguides.com/…) and
          # are resolved against dist; worker routes (/go, /api, /preferences,
          # /og/) are not in dist and are skipped — /og/ keeps its production
          # sample below; the canary (a missing path must read as missing) runs
          # before any result is written; an empty dist fails instead of
          # reporting clean. Passing urls stay in the csv so `total` is the
          # number actually examined.
          node scripts/check-dist-links.mjs dist > /tmp/links.csv
          # A checker that died writes nothing; emptiness is never "no breakages".
          if [ ! -s /tmp/links.csv ]; then
            echo "::error::check-dist-links produced no output — the check did not run"
            exit 1
          fi
          # CSV: url,status,state,parent — count real breakages.
          # Status 0 is reported separately from an HTTP status. A 0 means the
          # request never completed (the local server dropped it under load),
          # which is a fact about this runner, not about the site: every one
          # sampled returns 200 when fetched on its own. Rolling the two
          # together is how "110 broken links" hid the single genuine 404
          # underneath it.
          # 408 belongs with 0, and only learned that on 2026-09-23: the week's
          # report named five breakages, and four were 408s on the only photos
          # this site serves itself (/venue-photos, /editor-photos). All four
          # are present in dist and all four answer 200 in production in ~0.6s —
          # `serve` simply timed them out under the 12-way crawl, being the
          # largest files it had to hand back. A timeout carries a status here
          # instead of a 0, so it slipped past the rule above and pushed the one
          # genuine 404 to the bottom of a list of five. Same class, same bucket.
          # Counted by UNIQUE url, not by occurrence. linkinator emits one row
          # per place a link appears, and this site links a handful of things
          # (sitemap, logo, nav) from all 7,500 pages — so a single missing file
          # reads as "1,102 broken links" and buries anything else, the same way
          # the /go/klook rows used to. One bad url is one problem.
          broken=$(awk -F, 'NR>1 && $3=="BROKEN" && $2!=0 && $2!=408 {print $1}' /tmp/links.csv | sort -u | wc -l)
          unreached=$(awk -F, 'NR>1 && $3=="BROKEN" && ($2==0 || $2==408) {print $1}' /tmp/links.csv | sort -u | wc -l)
          total=$(awk -F, 'NR>1 {print $1}' /tmp/links.csv | sort -u | wc -l)
          echo "broken=$broken" >> "$GITHUB_OUTPUT"
          echo "unreached=$unreached" >> "$GITHUB_OUTPUT"
          echo "total=$total" >> "$GITHUB_OUTPUT"
          # A crawl that examined nothing is a broken crawl, not a clean site.
          # Reporting "all good" on an empty result set is how this hid for
          # weeks — the number of links checked has to be part of the verdict.
          # The floor is 1,000 because the two ways this has actually failed
          # both land far below it: 0 urls (crawl never ran) and 94 (home page
          # only, when every path served the same fallback html). A healthy
          # crawl of this site reads tens of thousands.
          if [ "$total" -lt 1000 ]; then
            echo "::error::crawl examined only $total url(s) — the crawler is not reading the site"
            exit 1
          fi
          # First 12 broken URLs for the report, one line per url. File first,
          # THEN head: `sort | head -12` lets head close the pipe after twelve
          # lines, sort dies of SIGPIPE ("write failed: Broken pipe"), and the
          # heredoc into $GITHUB_OUTPUT is left without its EOF_LIST delimiter —
          # which failed the whole job on 2026-08-26, the first week the broken
          # list was ever longer than twelve (1,187 urls). The week the check
          # has real news must not be the week it cannot deliver it.
          awk -F, 'NR>1 && $3=="BROKEN" && $2!=0 && $2!=408 {print $2" "$1}' /tmp/links.csv | sort -u > /tmp/broken-list.txt
          {
            echo "list<<EOF_LIST"
            head -12 /tmp/broken-list.txt
            echo "EOF_LIST"
          } >> "$GITHUB_OUTPUT"

      # The Telegram line names twelve urls; diagnosing a mass breakage needs
      # all of them, with the parent pages that link each one.
      - name: Keep the full crawl result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: links-csv
          path: /tmp/links.csv
          retention-days: 14
          if-no-files-found: ignore

      # The crawl answers "does this URL resolve". It does NOT answer "does this
      # link go where the page claims" — on 2026-09-06 a page existed in five
      # languages, answered 200 in all five, and sent every reader to the locale
      # root because it never declared itself localized. A person opening a
      # browser caught it. This runs on the same build the crawl just used.
      - name: Check where the localized links actually go
        id: dest
        run: |
          set -o pipefail
          node scripts/audit-link-destinations.mjs 2>&1 | tee /tmp/dest.log || true
          # An empty log means the audit DIED, not that every link is fine. The
          # translation-quality step learned this the hard way: emptiness read as
          # "nothing to do" hides the breakage for as long as it lasts.
          if [ ! -s /tmp/dest.log ]; then
            echo "dest_failed=1" >> "$GITHUB_OUTPUT"
            echo "dest_bad=0" >> "$GITHUB_OUTPUT"
            echo "dest_list<<EOF_DEST" >> "$GITHUB_OUTPUT"
            echo "EOF_DEST" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          n=$(grep -c '^LINK-DESTINATION:' /tmp/dest.log || true)
          echo "dest_failed=0" >> "$GITHUB_OUTPUT"
          echo "dest_bad=${n:-0}" >> "$GITHUB_OUTPUT"
          {
            echo "dest_list<<EOF_DEST"
            grep '^LINK-DESTINATION:' /tmp/dest.log | head -6 || true
            echo "EOF_DEST"
          } >> "$GITHUB_OUTPUT"

      # The static crawl cannot see /og/* (worker + R2), so probe PRODUCTION
      # with a deterministic daily sample instead — the skip above must not
      # become a blind spot the week the mirror actually breaks.
      - name: Sample /og/ mirrors on production
        id: ogsample
        run: |
          grep -rhoE '/og/[0-9a-f]{16}\.webp' dist --include='*.html' | sort -u > /tmp/og-urls.txt
          total=$(wc -l < /tmp/og-urls.txt)
          bad=0; sampled=0
          # Seeded rotation, not random: over weeks the sample walks the list.
          seed=$(date -u +%V)
          if [ "$total" -gt 0 ]; then
            for u in $(awk -v s="$seed" 'NR % 97 == s % 97' /tmp/og-urls.txt | head -15); do
              sampled=$((sampled+1))
              code=$(curl -s -o /dev/null -w '%{http_code}' "https://wanderatlasguides.com$u")
              [ "$code" != "200" ] && { bad=$((bad+1)); echo "og $code $u"; }
            done
          fi
          echo "og_total=$total" >> "$GITHUB_OUTPUT"
          echo "og_sampled=$sampled" >> "$GITHUB_OUTPUT"
          echo "og_bad=$bad" >> "$GITHUB_OUTPUT"

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BROKEN: ${{ steps.crawl.outputs.broken }}
          TOTAL: ${{ steps.crawl.outputs.total }}
          UNREACHED: ${{ steps.crawl.outputs.unreached }}
          LIST: ${{ steps.crawl.outputs.list }}
          OG_BAD: ${{ steps.ogsample.outputs.og_bad }}
          DEST_BAD: ${{ steps.dest.outputs.dest_bad }}
          DEST_FAILED: ${{ steps.dest.outputs.dest_failed }}
          DEST_LIST: ${{ steps.dest.outputs.dest_list }}
          OG_SAMPLED: ${{ steps.ogsample.outputs.og_sampled }}
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          # Message is assembled with echo lines (NOT a multiline string literal:
          # unindented continuation lines break the YAML block scalar and GitHub
          # then rejects the whole workflow file).
          {
            echo "🔗 Wander Atlas — 주간 링크 검사"
            if [ "$JOB_STATUS" != "success" ]; then
              echo "❌ 검사 실행 자체가 실패했습니다. GitHub Actions 로그를 확인해 주세요."
            elif [ "${BROKEN:-0}" = "0" ]; then
              echo "✅ 깨진 내부 링크 0개 (전체 ${TOTAL}개 검사) — 사이트 링크 상태 완벽합니다."
              # A connection the local server dropped is a runner limit, not a
              # site defect — mentioned, never counted as a breakage.
              [ "${UNREACHED:-0}" != "0" ] && echo "(참고: ${UNREACHED}개는 로컬 서버 과부하로 응답을 못 받았습니다 — 사이트 문제 아님)"
              if [ "${OG_BAD:-0}" != "0" ]; then
                echo "⚠️ 단, 공유 이미지(/og/) 실서버 표본 ${OG_SAMPLED}장 중 ${OG_BAD}장이 깨져 있습니다 — 미러 순찰 확인 필요."
              else
                echo "공유 이미지(/og/) 실서버 표본 ${OG_SAMPLED:-0}장 확인 — 정상."
              fi
            else
              echo "⚠️ 깨진 내부 링크 ${BROKEN}개 발견 (전체 ${TOTAL}개 중):"
              echo "$LIST"
              echo ""
              echo "클로드에게 '깨진 링크 고쳐줘'라고 말하면 수정합니다."
            fi
            # A separate question from "does it resolve": does the link go where
            # the page says it goes. Reported even on an otherwise clean week.
            if [ "${DEST_FAILED:-0}" = "1" ]; then
              echo ""
              echo "⚠️ 링크 목적지 검사가 실행되지 못했습니다 — 결과를 신뢰하지 마세요(로그 확인 필요)."
            elif [ "${DEST_BAD:-0}" != "0" ]; then
              echo ""
              echo "⚠️ 엉뚱한 곳으로 가는 링크 ${DEST_BAD}개 — 페이지가 안내하는 곳과 실제 목적지가 다릅니다:"
              echo "$DEST_LIST"
            fi
          } > /tmp/msg.txt
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode "text@/tmp/msg.txt" \
            -d disable_web_page_preview=true >/dev/null || true
