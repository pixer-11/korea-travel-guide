name: Accessibility check (pa11y)

# Weekly WCAG2AA scan of one page per template type on the LIVE site. Whole-site
# scans are noise; template-level coverage catches the regressions that matter
# (every post shares one template, every hub another, etc.).
on:
  schedule:
    - cron: '55 16 * * 2' # Tue 16:55 UTC = Wed 01:55 KST (after the link check)
  workflow_dispatch:

jobs:
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Scan representative pages
        id: scan
        run: |
          cat > /tmp/pa11y.json <<'CFG'
          {
            "defaults": { "standard": "WCAG2AA", "timeout": 45000, "chromeLaunchConfig": { "args": ["--no-sandbox"] } },
            "urls": [
              "https://wanderatlasguides.com/",
              "https://wanderatlasguides.com/ko/",
              "https://wanderatlasguides.com/destinations/",
              "https://wanderatlasguides.com/destinations/japan/",
              "https://wanderatlasguides.com/posts/amalfi-coast-positano/",
              "https://wanderatlasguides.com/events/",
              "https://wanderatlasguides.com/essentials/visa/",
              "https://wanderatlasguides.com/tools/best-time/",
              "https://wanderatlasguides.com/free/trip-checklist/"
            ]
          }
          CFG
          # `|| true` is required: pa11y-ci exits non-zero when it FINDS issues,
          # which is a result, not a failure. But it also exits non-zero when it
          # cannot start at all, and then this file is empty — so the difference
          # has to be checked here rather than assumed.
          npx --yes pa11y-ci --config /tmp/pa11y.json --json > /tmp/a11y.json || true
          if [ ! -s /tmp/a11y.json ]; then
            echo "::error::pa11y-ci produced no output — the scan did not run (Chrome launch, network, or config)"
            exit 1
          fi
          node -e '
            const r = JSON.parse(require("fs").readFileSync("/tmp/a11y.json","utf8"));
            const errs = r.errors ?? 0, total = r.total ?? 0, passes = r.passes ?? 0;
            let lines = [];
            for (const [url, issues] of Object.entries(r.results || {})) {
              for (const i of (issues || []).slice(0, 2)) {
                if (i.type === "error") lines.push(`- ${url.replace("https://wanderatlasguides.com","")}: ${i.message.slice(0, 90)}`);
              }
            }
            const fs = require("fs");
            fs.writeFileSync("/tmp/summary.txt", `errors=${errs}\npages=${total}\n`);
            // TRAILING NEWLINE IS LOAD-BEARING. join("\n") leaves the last line
            // unterminated, so the `echo "EOF_LIST"` that closes the heredoc
            // below landed glued to it — "…message.EOF_LIST" — and the runner
            // rejected the whole step with "Matching delimiter not found".
            // It only ever fired on a run that FOUND something: with zero
            // findings the file is empty and the delimiter sits on its own line.
            // So the check passed every week until the day it had news, and
            // then reported "실행이 실패했습니다" instead of the news (2026-08-05).
            const body = lines.slice(0, 10).join("\n");
            fs.writeFileSync("/tmp/list.txt", body ? body + "\n" : "");
          '
          errors=$(grep '^errors=' /tmp/summary.txt | cut -d= -f2)
          pages=$(grep '^pages=' /tmp/summary.txt | cut -d= -f2)
          # Zero pages scanned is a dead scanner, not an accessible site — and it
          # reads exactly like a clean run unless something says otherwise. The
          # config lists nine urls, so anything under that means pa11y-ci failed
          # to reach them (Chrome launch, DNS, a moved page) and the "✅ 오류 0건"
          # below would be a lie told with confidence.
          if [ "${pages:-0}" -lt 9 ]; then
            echo "::error::pa11y scanned only ${pages:-0} of 9 pages — the scan did not run properly"
            exit 1
          fi
          echo "errors=$errors" >> "$GITHUB_OUTPUT"
          echo "pages=$pages" >> "$GITHUB_OUTPUT"
          { echo "list<<EOF_LIST"; cat /tmp/list.txt; echo "EOF_LIST"; } >> "$GITHUB_OUTPUT"

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ERRORS: ${{ steps.scan.outputs.errors }}
          PAGES: ${{ steps.scan.outputs.pages }}
          LIST: ${{ steps.scan.outputs.list }}
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          # echo-assembled message — a multiline TXT="..." literal at column 0
          # breaks the YAML block scalar (GitHub rejects the workflow).
          {
            echo "♿ Wander Atlas — 주간 접근성 검사"
            if [ "$JOB_STATUS" != "success" ]; then
              echo "❌ 검사 실행이 실패했습니다. GitHub Actions 로그를 확인해 주세요."
            elif [ "${ERRORS:-0}" = "0" ]; then
              echo "✅ 대표 페이지 ${PAGES}종 모두 접근성 오류 0건 (WCAG 2.1 AA 기준)."
            else
              echo "⚠️ 접근성 오류 ${ERRORS}건 (대표 페이지 ${PAGES}종 검사):"
              echo "$LIST"
              echo ""
              echo "클로드에게 '접근성 오류 고쳐줘'라고 말하면 수정합니다."
            fi
          } > /tmp/msg.txt
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode "text@/tmp/msg.txt" \
            -d disable_web_page_preview=true >/dev/null || true
