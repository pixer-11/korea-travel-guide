name: Refresh existing posts (freshness)

# Weekly: re-check every post's venue against Google Places, update
# ratings/hours, and auto-unpublish anything that has closed.
on:
  schedule:
    - cron: '33 20 * * 0' # Sundays 20:33 UTC (off the hour)
  workflow_dispatch: {}

# Shares the daily Places Details budget with publish/backfill/quality-audit.
concurrency:
  group: places-quota
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Refresh data
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          # Caps Details calls per run; refresh.mjs also keeps a cursor
          # (data/refresh-cursor.json, committed below) so successive runs
          # rotate oldest-checked-first through the whole catalogue instead
          # of re-refreshing the same alphabetical head every week.
          REFRESH_LIMIT: '40'
        run: npm run refresh

      # The step above moves place.rating / place.userRatingsTotal. The meta
      # description quotes those same figures ("4.7★ (706 reviews)") and used
      # to keep quoting the day-of-publication snapshot forever — understated
      # while reviews accumulate, and false outright once the rating moves.
      # Runs right here, in the same commit, so the sentence and the data it
      # cites can never be a week apart. Figures only; no re-translation.
      - name: Resync rating badges in descriptions
        run: node scripts/resync-rating-badges.mjs

      # The badge above is only half the surface: 293 posts also write the
      # figure into a SENTENCE ("verified visitor ratings put it at 4.8 stars"),
      # and nothing reached those until 2026-08-17, when Ayutthaya shipped 4.8
      # in the prose above a fact box reading 4.7. Same slot, same reasoning as
      # the badge — the number and the data it cites cannot be a week apart.
      # Digits only, in English and its four translations, with each srcHash
      # re-stamped so a number-only edit queues no re-translation. Hedges
      # ("sits above 4.5") are deliberately left alone: they stay true across a
      # range, and rewriting one would make it false.
      - name: Resync ratings written into prose
        run: node scripts/resync-prose-ratings.mjs --apply

      # Opening hours move in that same refresh, and the PROSE quotes them:
      # "6pm to 9pm is noticeably quieter" on a museum that closes at 5:30,
      # "the market runs 7am to 11pm" on a market that shuts at 10. Both were
      # live on 2026-08-07 with nothing able to reach them — the publish gate
      # only inspects posts added in that run, and repair-held-posts only
      # touches quarantined drafts, so a LIVE post whose hours changed under it
      # had no repair path at all. Same reasoning as the badge resync above:
      # fix the sentence in the same commit that moved the fact it cites.
      # continue-on-error because this calls the writer model — a rewrite that
      # fails must not cost the venue-data commit below.
      - name: Correct prose that contradicts the new hours
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/fix-hours-claims.mjs

      # 362 fastly.4sqi.net hotlinks would rot silently (the old irs0/irs3
      # subdomains did exactly that) — weekly HEAD-check, no API keys needed.
      # Dead hero → visual-audit.json MISMATCH, so the nightly alt-photos
      # patrol replaces it through the vision gate; dead gallery entry →
      # removed in place. Transient errors (5xx/429/timeouts) flag nothing,
      # and a >30% failure wave is treated as a CDN-wide event: nothing
      # flagged, human decision requested. continue-on-error so a network
      # blip can never block the venue-data commit below.
      - name: Foursquare photo link check
        id: fsq
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/check-4sqi-health.mjs | tee /tmp/fsq.log
          s=$(grep '^FSQ_HEALTH_SUMMARY' /tmp/fsq.log | tail -1)
          echo "checked=$(echo "$s" | sed 's/.* checked=\([0-9]*\).*/\1/')" >> "$GITHUB_OUTPUT"
          echo "dead=$(echo "$s" | sed 's/.* dead=\([0-9]*\).*/\1/')" >> "$GITHUB_OUTPUT"
          echo "heroflagged=$(echo "$s" | sed 's/.* heroflagged=\([0-9]*\).*/\1/')" >> "$GITHUB_OUTPUT"
          echo "galleryremoved=$(echo "$s" | sed 's/.* galleryremoved=\([0-9]*\).*/\1/')" >> "$GITHUB_OUTPUT"
          echo "outage=$(echo "$s" | sed 's/.* outage=\([0-9]*\).*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Commit updates
        run: |
          git config user.name "content-bot"
          git config user.email "bot@users.noreply.github.com"
          # The cursor must be committed even when no post changed — otherwise
          # a no-change week forgets its progress and re-checks the same posts.
          # visual-audit.json carries the dead-hotlink flags for the nightly
          # patrol; losing it would silently drop the replacement queue.
          # src/content/i18n was missing here until 2026-08-17, and both resync
          # steps above write translations. Every translated file they fixed was
          # discarded on the runner — no refresh commit in the repo's history
          # contains a single i18n file — so the English figure moved while its
          # four translations kept the old one, and the srcHash re-stamp meant to
          # spare a re-translation never survived to be read.
          git add src/content/posts src/content/i18n data/translation-quality.json \
                  data/refresh-cursor.json data/visual-audit.json data/places-budget.json
          # A staged DELETION here is never this job's intent: it only rewrites
          # figures in files that already exist. Windows disk cleanup emptied a
          # worktree on 2026-08-13 and a directory-wide `git add` is exactly how
          # that becomes an unattended commit removing live posts.
          if git diff --staged --name-only --diff-filter=D | grep -q .; then
            echo "::error::Staged deletions in a figures-only job — refusing to commit."
            git diff --staged --name-only --diff-filter=D
            git reset
            exit 1
          fi
          if git diff --staged --quiet; then
            echo "Nothing to refresh."
          else
            git commit -m "content: refresh venue data ($(date -u +%Y-%m-%d))"
            bash scripts/git-push-retry.sh
          fi

      - name: Notify Telegram (photo link check)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FSQ_OUTCOME: ${{ steps.fsq.outcome }}
          CHECKED: ${{ steps.fsq.outputs.checked }}
          DEAD: ${{ steps.fsq.outputs.dead }}
          HEROFLAGGED: ${{ steps.fsq.outputs.heroflagged }}
          GALLERYREMOVED: ${{ steps.fsq.outputs.galleryremoved }}
          OUTAGE: ${{ steps.fsq.outputs.outage }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          {
            echo "🔗 Wander Atlas — 주간 포스퀘어 사진 링크 점검"
            if [ "$FSQ_OUTCOME" != "success" ]; then
              echo "❌ 점검 실행 실패 — GitHub Actions 로그를 확인해 주세요."
            elif [ "${OUTAGE:-0}" = "1" ]; then
              echo "🚨 확인 ${CHECKED:-0}개 중 ${DEAD:-0}개 접속 불가 — 광역 장애/정책 변경 의심이라 자동 조치는 보류했습니다. 다음 주에도 반복되면 사진 자체 호스팅 전환을 검토해 주세요."
            elif [ "${CHECKED:-0}" -lt 1 ]; then
              # "0개 전부 정상" is not good news — it is the check not running.
              # The site carries hundreds of Foursquare heroes, so zero here means
              # the cursor, the quota or the fetch broke. Say that instead of
              # printing a tick over it (2026-08-05).
              echo "❌ 확인한 사진이 0개입니다 — 점검이 돌지 않았습니다. GitHub Actions 로그를 확인해 주세요."
            elif [ "${DEAD:-0}" = "0" ]; then
              echo "✅ ${CHECKED:-0}개 전부 정상"
            else
              echo "⚠️ 확인 ${CHECKED:-0}개 중 깨진 링크 ${DEAD}개"
              if [ "${HEROFLAGGED:-0}" != "0" ]; then echo "🛠️ 대표사진 ${HEROFLAGGED}편 → 새벽 사진 교체 파이프라인에 등록(AI 시각 검증 후 교체)"; fi
              if [ "${GALLERYREMOVED:-0}" != "0" ]; then echo "🧹 본문 사진 ${GALLERYREMOVED}장 제거(추후 자동 보충)"; fi
            fi
          } > /tmp/msg.txt
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode "text@/tmp/msg.txt" >/dev/null || true
