name: Publish watchdog
# Did today's publish actually run?
#
# On 2026-08-27 it did not. The workflow was active, its cron unchanged, and six
# other scheduled workflows fired that morning — GitHub just dropped this one, and
# nothing noticed. job-failure-alert watches for runs that FAIL; a run that never
# starts has no failure to report. Publishing can stop dead and the only symptom
# is a site that quietly stops growing.
#
# It used to run three hours after the publish cron (07:19 UTC) — long enough for
# a merely-late schedule to have landed on its own, back when GitHub was half an
# hour late. Measured 2026-09-09 over 14 days: GitHub's own delivery of publish.yml
# is now 4-6 HOURS late every single day, so the rescue was what published, and it
# published at 19:35 KST instead of 16:19. Eleven minutes is the new grace: if
# GitHub is punctual the run is already there and this stays silent; if GitHub is
# late its run lands on publish's one-batch-per-KST-day guard and does nothing.
on:
  schedule:
    - cron: '30 7 * * *'   # 16:30 KST, 11 min after the publish cron
  workflow_dispatch:

permissions:
  actions: write   # to read the run history and to start a missed run

# Three things can start this: its own cron, the Cloudflare alarm five minutes
# later, and the schedule watchdog. Two landing within the ~30 s a run needs
# to reach the dispatch call would both see the slot unserved and both start
# publish — and a dispatched publish is outside the one-batch-a-day guard.
concurrency:
  group: publish-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '20' }
      - run: node scripts/check-publish-ran.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
