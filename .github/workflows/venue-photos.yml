name: Backfill real venue photos

# Gives every venue post (one with a Google place.id) a REAL, self-hosted Google
# Places photo of the actual place. Resumable: skips posts already done and stops
# on the Places Details daily quota, so daily runs converge. Also keeps future
# posts covered as they're added. Runs after the quota reset, off the hour, and
# spaced from backfill (08:43) / publish (21:19).
on:
  # schedule: (DISABLED 2026-07-26 — Google photos are billing-blocked; these crons only burned the hidden daily quota that the morning publish needs. Alt-photo pipeline replaces them. Dispatch still works.)
    # 08:05 UTC — right after the Places quota resets (~08:00) and BEFORE every
    # other Places job, so the full daily allowance goes to real venue photos
    # until the 162 mismatched heroes are cleared. backfill.yml is paused for this.
    #- cron: '5 8 * * *'
    # SAFETY NET. GitHub delays free scheduled runs under load — measured 2h21m on
    # 2026-07-24 — and can drop them entirely. This second slot re-runs the job;
    # it is idempotent (skips posts already self-hosted) and quota-capped, so a
    # duplicate run just continues the backlog instead of wasting the allowance.
    #- cron: '35 12 * * *'   # 21:35 KST
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max posts to photo this run (0 = no cap; stops on quota)'
        required: false
        default: '25'  # was '0' = UNCAPPED; accepting the shown default drained the window
      slugs:
        description: 'Comma-separated post slugs to process ONLY (priority run; blank = all)'
        required: false
        default: ''

# Shares the daily Places Details budget with publish/backfill/quality-audit —
# a manual run must queue behind them, never spend the window in parallel.
concurrency:
  group: places-quota
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  venue-photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Self-host venue photos
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          # Cap = 25/run so this job never drains the whole day's Places quota — the
          # daily auto-publish (generate.mjs) must keep enough headroom to run. The
          # script now fixes OFF-TOPIC / mismatched heroes FIRST, so even a capped
          # run clears the ugliest. Manual dispatch can override (limit 0 = no cap).
          # Stops cleanly on 429 and resumes next day.
          PHOTO_LIMIT: ${{ github.event.inputs.limit || '25' }}
          SLUGS: ${{ github.event.inputs.slugs || '' }}
          PLACES_DEBUG: '1'
        run: node scripts/backfill-venue-photos.mjs 2>&1 | tee /tmp/vp.log

      - name: Build hero photo-wall thumbnails
        run: node scripts/build-wall.mjs

      - name: Commit venue photos
        id: commit
        run: |
          git config user.name "content-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/venue-photos src/content/posts public/wall data/wall.json
          new=$(git diff --cached --name-only --diff-filter=A -- public/venue-photos | grep -c '.' || true)
          total=$(ls src/content/posts/*.md | wc -l | tr -d ' ')
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "total=$total" >> "$GITHUB_OUTPUT"
          if git diff --staged --quiet; then
            echo "No new venue photos this run."
          else
            git commit -m "content: self-hosted venue photos ($(date -u +%Y-%m-%d))"
            bash scripts/git-push-retry.sh
          fi

      # Tell the two failure modes apart. ZERO successful Details calls on a run that
      # starts right after the daily reset means the project is being refused outright
      # (billing/region), not that our other jobs ate the quota — same symptom, very
      # different fix. Anything above zero means it's just quota sharing, working.
      - name: Quota diagnosis
        if: always()
        id: diag
        run: |
          n=$(grep -o 'QUOTA_STOP after [0-9]*' /tmp/vp.log 2>/dev/null | head -1 | grep -o '[0-9]*' || true)
          nophoto=$(grep -c 'no Places photo' /tmp/vp.log 2>/dev/null || echo 0)
          if [ "${nophoto:-0}" -gt 5 ]; then
            echo "diag=진단: 구글 조회는 성공했지만 사진이 하나도 오지 않음 (${nophoto}건) — 한도 문제가 아니라 사진 접근 권한 문제입니다." >> "$GITHUB_OUTPUT"
          elif [ -z "$n" ]; then
            echo "diag=" >> "$GITHUB_OUTPUT"
          elif [ "$n" = "0" ]; then
            echo "diag=진단: 오늘 한도를 이미 다 써서 시작하자마자 멈춤 — 다음 리셋 후 재시도합니다." >> "$GITHUB_OUTPUT"
          else
            echo "diag=진단: $n건 성공 후 한도 소진 — 한도를 나눠 쓰는 문제(정상 동작)." >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          NEW: ${{ steps.commit.outputs.new }}
          TOTAL: ${{ steps.commit.outputs.total }}
          # Rides along in the free-text slot so a zero-photo run says WHY.
          NEW_LIST: ${{ steps.diag.outputs.diag }}
        run: bash scripts/notify-telegram.sh "Venue photos"
