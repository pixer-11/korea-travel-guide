name: Alt-source photo backfill

# Clears the wrong/quarantined-hero backlog with Foursquare + Flickr candidates,
# every one vision-verified before it is written. No Google quota involved.
# Green no-op until FOURSQUARE_API_KEY / FLICKR_API_KEY secrets exist.
on:
  schedule:
    - cron: '35 19 * * *' # 19:35 UTC = 04:35 KST daily (fast no-op once backlog is clear)
  workflow_dispatch:
    inputs:
      slugs:
        description: 'Comma-separated slugs ONLY (blank = full backlog)'
        required: false
        default: ''
      limit:
        description: 'Max posts this run'
        required: false
        default: '300'
      audit_all:
        description: 'true = vision-check EVERY venue post (full sweep), not just the known backlog'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Reports each source SEPARATELY, not just "at least one". The old test was
      # `A || B`, so a run with Foursquare and no Flickr looked identical to a
      # run with both, and a photo source could be absent for months without
      # anyone noticing — exactly how BESTTIME_API_KEY went missing and left
      # every new post with no crowd data until someone happened to check.
      # Measured 2026-08-07: 0 of 676 live heroes come from Flickr.
      - name: Check keys
        id: gate
        env:
          A: ${{ secrets.FOURSQUARE_API_KEY }}
          B: ${{ secrets.FLICKR_API_KEY }}
        run: |
          [ -n "$A" ] && echo "fsq=yes" >> "$GITHUB_OUTPUT" || echo "fsq=no" >> "$GITHUB_OUTPUT"
          [ -n "$B" ] && echo "flickr=yes" >> "$GITHUB_OUTPUT" || echo "flickr=no" >> "$GITHUB_OUTPUT"
          echo "Foursquare key: $([ -n "$A" ] && echo present || echo MISSING)"
          echo "Flickr key:     $([ -n "$B" ] && echo present || echo MISSING)"
          if [ -n "$A" ] || [ -n "$B" ]; then echo "on=true" >> "$GITHUB_OUTPUT"; else echo "on=false" >> "$GITHUB_OUTPUT"; fi

      - if: steps.gate.outputs.on == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - if: steps.gate.outputs.on == 'true'
        run: npm ci

      - name: Backfill photos (vision-gated)
        id: run
        if: steps.gate.outputs.on == 'true'
        env:
          FOURSQUARE_API_KEY: ${{ secrets.FOURSQUARE_API_KEY }}
          FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLUGS: ${{ github.event.inputs.slugs }}
          LIMIT: ${{ github.event.inputs.limit || '300' }}
          AUDIT_ALL: ${{ github.event.inputs.audit_all == 'false' && '' || '1' }}
        run: |
          set -o pipefail
          node scripts/backfill-photos-alt.mjs | tee /tmp/alt.log
          s=$(grep '^ALT_SUMMARY' /tmp/alt.log | tail -1)
          # NOTE the leading space in ' fixed=' — 'unfixed=' CONTAINS 'fixed=',
          # and the greedy match once reported 교체 완료 164장 when real fixed=0.
          echo "fixed=$(echo "$s" | sed 's/.* fixed=\([0-9]*\).*/\1/')" >> "$GITHUB_OUTPUT"
          echo "undrafted=$(echo "$s" | sed 's/.* undrafted=\([0-9]*\).*/\1/')" >> "$GITHUB_OUTPUT"
          echo "unfixed=$(echo "$s" | sed 's/.* unfixed=\([0-9]*\).*/\1/')" >> "$GITHUB_OUTPUT"
          echo "exhausted=$(echo "$s" | sed 's/.* exhausted=\([0-9]*\).*/\1/')" >> "$GITHUB_OUTPUT"
          # Post lists for the Telegram report (user standing request: always
          # say WHICH posts) — first 15 each.
          # REPORTING MUST NEVER KILL THE RUN (a grep killed run #5, a head/sed
          # SIGPIPE killed run #6 after 118 successful fixes). No pipes that can
          # break: awk consumes all input and caps at 15 lines itself.
          set +e
          set +o pipefail
          awk '/✅ [a-z0-9-]+:/ { sub(/^ *✅ /,"• "); sub(/:.*/,""); print; if (++n==15) exit }' /tmp/alt.log > /tmp/fl.txt
          awk '/🚫 [a-z0-9-]+:/ { sub(/^ *🚫 /,"• "); sub(/:.*/,""); print; if (++n==15) exit }' /tmp/alt.log > /tmp/ul.txt
          awk '/⏸️  [a-z0-9-]+:/ { sub(/^ *⏸️  /,"• "); sub(/:.*/,""); print; if (++n==15) exit }' /tmp/alt.log > /tmp/rl.txt
          { echo "fixedlist<<EOF_FL"; cat /tmp/fl.txt; echo "EOF_FL"; } >> "$GITHUB_OUTPUT"
          { echo "unfixedlist<<EOF_UL"; cat /tmp/ul.txt; echo "EOF_UL"; } >> "$GITHUB_OUTPUT"
          { echo "exhaustedlist<<EOF_RL"; cat /tmp/rl.txt; echo "EOF_RL"; } >> "$GITHUB_OUTPUT"
          true

      # Discover large-card floor is 1200px. The scan caches probes per
      # slug+url, so a nightly run only network-probes new/changed heroes;
      # the upgrade step then tries vision-verified ≥1200px photos of the
      # SAME venue for the due queue entries. No wider photo → the post
      # keeps its hero (small hero beats no hero — never drafted, never
      # retired) and retries in a week. continue-on-error: a hiccup here
      # must not lose the backfill's fixes waiting in the commit step below.
      - name: Scan hero widths (Discover queue)
        id: scan
        if: steps.gate.outputs.on == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/scan-hero-widths.mjs | tee /tmp/scan.log
          s=$(grep '^WIDTH_SCAN_SUMMARY' /tmp/scan.log | tail -1)
          echo "queuetotal=$(echo "$s" | sed 's/.* queue_total=\([0-9]*\).*/\1/')" >> "$GITHUB_OUTPUT"
          echo "queuednew=$(echo "$s" | sed 's/.* queued_new=\([0-9]*\).*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Upgrade narrow heroes (queue, vision-gated)
        id: width
        if: steps.gate.outputs.on == 'true'
        continue-on-error: true
        env:
          FOURSQUARE_API_KEY: ${{ secrets.FOURSQUARE_API_KEY }}
          FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QUEUE: '1'
          QUEUE_LIMIT: '15'
        run: |
          set -o pipefail
          node scripts/upgrade-hero-width.mjs | tee /tmp/width.log
          s=$(grep '^WIDTH_SUMMARY' /tmp/width.log | tail -1)
          echo "upgraded=$(echo "$s" | sed 's/.* upgraded=\([0-9]*\).*/\1/')" >> "$GITHUB_OUTPUT"
          echo "nowider=$(echo "$s" | sed 's/.* nowider=\([0-9]*\).*/\1/')" >> "$GITHUB_OUTPUT"

      # New heroes need their self-hosted 640px thumbs or downstream pages
      # (crowd tool cards, region tiles) render BLANK — user caught this live.
      - name: Rebuild photo-wall thumbnails
        if: steps.gate.outputs.on == 'true'
        run: node scripts/build-wall.mjs

      # Last word before the commit: no post may ship live wearing a hero the
      # verdict store has judged MISMATCH. On 2026-08-08 three quarantined
      # posts came back with their draft line removed and the SAME judged-wrong
      # photo — a re-verification of the same image had passed by chance.
      # Whatever path produces that state, it dies here, not in production.
      - name: Re-quarantine stored-MISMATCH heroes
        if: steps.gate.outputs.on == 'true'
        run: node scripts/requarantine-mismatches.mjs

      # A FUTURE event with no photo is publishable by policy (events are the
      # site's best-performing pages; the date/venue/tickets answer the query),
      # but the script enforcing that policy was never wired into any cron —
      # so when the photo search gave up on an event, it stayed quarantined
      # anyway. 22 future events (EuroVolley Istanbul, three snooker opens,
      # F1 Madrid…) sat unpublished until a hand-run on 2026-08-15. Runs after
      # the re-quarantine step: they never touch the same post (this releases
      # only HERO-LESS events; that pulls heroes recorded as MISMATCH).
      - name: Release photoless future events
        if: steps.gate.outputs.on == 'true'
        run: node scripts/release-photoless-events.mjs

      # Two posts wearing one photo. The set that prevents this read heroes with
      # a regex that could not see a folded scalar, so ~113 heroes were invisible
      # to it and Taiyuan + Wuhan shared a snooker table (2026-08-19). The reader
      # is fixed (lib/hero-url.mjs); this re-resolves whatever slipped through,
      # vision-gated, and no-ops in seconds on a clean night. Nothing is deleted
      # or drafted — a post with no verified replacement keeps the photo it has.
      - name: Re-resolve duplicate heroes (vision-gated)
        if: steps.gate.outputs.on == 'true'
        run: node scripts/reresolve-dupe-heroes.mjs

      - name: Commit fixes
        if: steps.gate.outputs.on == 'true'
        run: |
          git config user.name "content-bot"
          git config user.email "bot@users.noreply.github.com"
          # photo-retry.json is the 7-night retirement clock, retired-posts.json
          # feeds the 301 map, and retirement deletes i18n translations — none
          # were staged, so every night's counts died with the runner (the clock
          # never advanced in CI) and a firing retirement would have shipped the
          # post deletion WITHOUT its redirect: a 404 where a 301 was promised.
          git add src/content/posts src/content/i18n public/wall data/wall.json data/visual-audit.json data/photo-retry.json data/retired-posts.json data/hero-width-queue.json
          if git diff --staged --quiet; then
            echo "No photo changes."
          else
            git commit -m "fix: vision-verified hero photos from alt sources ($(date -u +%Y-%m-%d))"
            bash scripts/git-push-retry.sh
          fi

      - name: Notify Telegram
        if: always() && steps.gate.outputs.on == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          FIXED: ${{ steps.run.outputs.fixed }}
          UNDRAFTED: ${{ steps.run.outputs.undrafted }}
          UNFIXED: ${{ steps.run.outputs.unfixed }}
          FIXED_LIST: ${{ steps.run.outputs.fixedlist }}
          UNFIXED_LIST: ${{ steps.run.outputs.unfixedlist }}
          EXHAUSTED: ${{ steps.run.outputs.exhausted }}
          EXHAUSTED_LIST: ${{ steps.run.outputs.exhaustedlist }}
          W_UPGRADED: ${{ steps.width.outputs.upgraded }}
          W_NOWIDER: ${{ steps.width.outputs.nowider }}
          W_QUEUE: ${{ steps.scan.outputs.queuetotal }}
          K_FSQ: ${{ steps.gate.outputs.fsq }}
          K_FLICKR: ${{ steps.gate.outputs.flickr }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          {
            echo "🖼️ Wander Atlas — 대체 소스 사진 교체"
            # A missing source is the difference between "no photo exists" and
            # "we never looked there", and the owner cannot tell those apart
            # from a count of failures. Say it every run.
            # Flickr moved API keys behind a PRO subscription (checked
            # 2026-08-08) — the key line stays only if one ever appears.
            # Openverse (keyless, free) now covers Flickr's CC photos instead.
            if [ "${K_FSQ:-no}" != "yes" ]; then
              echo "🔑 사진 출처 상태: 포스퀘어 ❌꺼짐 · 오픈버스 켜짐(키 불필요)"
              echo "   (꺼진 출처는 아예 찾아보지 않습니다 — 사진을 못 구한 게 아니라 안 본 것입니다)"
            fi
            if [ "$JOB_STATUS" != "success" ]; then
              echo "❌ 실행 실패 — GitHub Actions 로그를 확인해 주세요."
            else
              echo "✅ 교체 완료: ${FIXED:-0}장 (전부 AI 시각 검증 통과)"
              echo "♻️ 재공개된 글: ${UNDRAFTED:-0}편"
              if [ -n "$FIXED_LIST" ]; then echo "📄 교체된 글:"; echo "$FIXED_LIST"; fi
              if [ "${UNFIXED:-0}" != "0" ]; then
                echo "⚠️ 합격 사진을 못 찾은 글: ${UNFIXED}편 — 계속 찾습니다. 글은 삭제되지 않습니다."
                if [ -n "$UNFIXED_LIST" ]; then echo "$UNFIXED_LIST"; fi
              fi
              if [ "${EXHAUSTED:-0}" != "0" ] && [ -n "${EXHAUSTED:-}" ]; then
                echo "⏸️ 사진 탐색 중단: ${EXHAUSTED}편 — 7일간 어느 무료 사진 출처에도 없어 매일 재시도를 멈춥니다(예전에는 이 시점에 글을 삭제했습니다). 글은 격리 상태로 그대로 남아 있고, 공개할지는 사람이 판단합니다."
                if [ -n "$EXHAUSTED_LIST" ]; then echo "$EXHAUSTED_LIST"; fi
              fi
              # 디스커버 대형카드(1200px) 미달 히어로 업그레이드 큐 — 교체 실패는
              # 정상 상태(더 큰 사진이 없으면 기존 사진 유지)라 결과가 있을 때만 알림.
              if [ -n "${W_QUEUE:-}" ] && [ "${W_QUEUE:-0}" != "0" ]; then
                echo "📐 디스커버 대형사진 큐: ${W_QUEUE}편 대기 · 오늘 ${W_UPGRADED:-0}편을 1200px 이상으로 교체(AI 시각 검증 통과), ${W_NOWIDER:-0}편은 더 큰 사진이 없어 유지(1주 뒤 재시도)"
              elif [ -n "${W_UPGRADED:-}" ] && [ "${W_UPGRADED:-0}" != "0" ]; then
                echo "📐 디스커버 대형사진: ${W_UPGRADED}편 교체 완료 — 큐 비움"
              fi
            fi
          } > /tmp/msg.txt
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode "text@/tmp/msg.txt" >/dev/null || true
