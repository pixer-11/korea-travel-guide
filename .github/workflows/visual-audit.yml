name: visual-audit
# Vision-based hero-image validation: LOOKS at each venue post's hero with a vision
# model and flags images that don't match the venue (empty plate, wrong building,
# wrong city, unrelated subject). Resumable via data/visual-audit.json. Weekly sweep
# + manual dispatch. Sends a Korean Telegram warning when mismatches are found.
on:
  schedule:
    # DAILY, not weekly (2026-08-03). Weekly × 150-post cap could not keep up
    # with 16-20 posts published a day: the un-checked backlog never emptied,
    # and 239 posts were still waiting when the owner found a Bangkok street
    # stall heading a rooftop-club guide. Daily + no cap means the queue is
    # normally just that day's new posts (~20 Haiku calls, pennies), and a
    # wrong photo is caught the night after it publishes instead of never.
    - cron: '40 12 * * *'  # 21:40 KST daily — after publish + translations
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max posts to check this run (0 = all remaining)'
        required: false
        default: '0'
      slugs:
        description: 'Specific slugs (comma-separated); blank = resumable venue posts'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - name: Visual audit
        run: |
          if [ -n "${{ github.event.inputs.slugs }}" ]; then
            node scripts/visual-audit.mjs --slugs "${{ github.event.inputs.slugs }}"
          else
            node scripts/visual-audit.mjs
          fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUDIT_LIMIT: ${{ github.event.inputs.limit || '0' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Commit audit state
        run: |
          git config user.name "content-bot"
          git config user.email "bot@users.noreply.github.com"
          # src/content/posts too: the audit now quarantines a mismatched hero
          # on the spot, and staging only the JSON would have thrown that away
          # with the runner — the same omission that kept the retirement clock
          # from ever advancing (fixed 2026-08-01).
          git add data/visual-audit.json src/content/posts
          if git diff --staged --quiet; then
            echo "No audit changes."
          else
            git commit -m "chore: visual-audit results ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main && git push
          fi
