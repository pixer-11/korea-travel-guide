name: mailerlite-fields
# One-shot, idempotent: ensures the custom fields the signup forms post
# (region, lang, signup_source, itinerary_url) exist in MailerLite. Run it
# via workflow_dispatch whenever a new field is added to the setup script.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/setup-mailerlite-fields.mjs
      - .github/workflows/mailerlite-fields.yml
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '20' }
      - run: node scripts/setup-mailerlite-fields.mjs
        env:
          MAILERLITE_API_TOKEN: ${{ secrets.MAILERLITE_API_TOKEN }}
