name: Quality audit (intl venues)

# Daily audit that fixes defects which only surface for non-English venues:
#   - non-Latin place.address  → re-fetched English address
#   - food/trendy venues with a landmark-fallback hero → real Google Places photo
#
# ONE run a day, AFTER venue-photos has had first claim on the Places quota.
# It used to run 3x/day with no per-run cap and tried every venue post, draining
# the whole daily GetPlaceRequest allowance so venue-photos could never self-host
# a single real photo. Photo replacement now belongs to venue-photos.yml; this job
# only fixes non-Latin addresses, capped by PLACES_LIMIT.
# CHAINED to publish, not to a clock. GitHub has delayed the publish cron by up
# to 3h51m, so a fixed 22:40 slot could beat it — and this job spends the SAME
# Places Details budget publish needs, uncapped, draining the fresh window before
# a single post is written. workflow_run makes the order structural.
#
# LAST IN THE CHAIN (2026-08-05): publish → backfill-details → backfill → this.
# All three Places consumers used to fire off the same publish completion into
# one `places-bulk` group, and GitHub cancels the request that is WAITING when a
# newer one arrives — so one of the three was destroyed every day, silently.
# Ordering them by trigger removes the contention outright; this goes last
# because a quality pass over posts the two backfills just edited is the pass
# worth having.
on:
  workflow_run:
    workflows: ['Backfill countries to target']
    types: [completed]
  workflow_dispatch:

# Same group as backfill-details: both fire when publish completes, both call
# backfill-place-details, and in separate groups they ran in PARALLEL — 40+80
# against the ~100/day Details cap, editing the same alphabetical posts and
# losing one side's work to the rebase race.
concurrency:
  group: places-bulk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit:
    # A failed or cancelled publish must not chain a quota-spending run, and a
    # publish on a feature branch must not spend main's budget.
    # 'skipped' is the NORMAL outcome upstream — backfill's gate stands down on
    # any day the phase is not 'country'. Requiring 'success' here would mean
    # this audit ran only on country-fill days, which is most days never.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion != 'failure' &&
       github.event.workflow_run.conclusion != 'cancelled' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

# The 40-post backfill step was removed 2026-08-01: backfill-details.yml already
# runs the same script with --limit 80 in the same post-publish window, so this
# duplicate spent the shared ~100/day Details cap twice and raced its commits.

      - name: Run audit
        id: audit
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          # `|| true` is deliberate — a Places 429 mid-run is not a build
          # failure. But it equally swallowed a CRASH, and since nothing is
          # staged after one, `committed` stays 0 and the Telegram step below is
          # gated on committed == '1' — so a dead quality audit sent NO message
          # at all, every day, with the job showing green and job-failure-alert
          # never firing (found 2026-08-06). Record the distinction.
          out=$(node scripts/quality-audit.mjs --apply 2>&1) || echo "QUALITY_AUDIT_CRASHED" >> /tmp/qa-crash.txt
          echo "$out"
          res=$(printf '%s\n' "$out" | grep -oE 'AUDIT_RESULT addr=[0-9]+ img=[0-9]+' | tail -1)
          addr=$(printf '%s' "$res" | grep -oE 'addr=[0-9]+' | cut -d= -f2)
          img=$(printf '%s' "$res" | grep -oE 'img=[0-9]+' | cut -d= -f2)
          echo "addr=${addr:-0}" >> "$GITHUB_OUTPUT"
          echo "img=${img:-0}" >> "$GITHUB_OUTPUT"

      - name: Validate content (gate — never commit a regression)
        # continue-on-error mirrors publish.yml: a PRE-EXISTING content issue used
        # to abort here, discarding every Places call already made and skipping
        # both the commit and the Telegram notice, silently, day after day.
        id: validate
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/validate-content.mjs 2>&1 | tee /tmp/qa-validate.log

      - name: Rebuild hero photo-wall (heroes may have changed)
        run: node scripts/build-wall.mjs

      - name: Commit fixes
        id: commit
        run: |
          git config user.name "content-bot"
          git config user.email "bot@users.noreply.github.com"
          # data/quality-audit-skip.json is the "tried this venue, Google has
          # nothing, rest 30 days" ledger, added after four zero-fix days in
          # August. It was never staged, so it died with the runner every night
          # and the job re-asked the same unanswerable venues forever: 30
          # consecutive commits reading "0 addresses + 0 images", spending this
          # job's entire 15% share of the daily Places Details budget for
          # nothing. Same class as data/visual-audit.json (fixed 09-09) and
          # og-width-probes (09-10) — a tool that remembers nothing repeats
          # itself.
          git add src/content/posts public/venue-photos public/wall data/wall.json data/places-budget.json data/quality-audit-skip.json
          if git diff --staged --quiet; then
            echo "committed=0" >> "$GITHUB_OUTPUT"
            echo "No quality fixes this run (all clean, or quota not ready)."
          else
            git commit -m "fix: audit intl venues — ${{ steps.audit.outputs.addr }} addresses + ${{ steps.audit.outputs.img }} images ($(date -u +%Y-%m-%d))"
            bash scripts/git-push-retry.sh
            echo "committed=1" >> "$GITHUB_OUTPUT"
          fi

      # A crash has to speak even though nothing was committed — that was the
      # exact silence: no commit, no message, green job, nobody told.
      - name: Warn if the audit crashed
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          [ -s /tmp/qa-crash.txt ] || exit 0
          TXT='🚨 품질 점검이 실행 중 오류로 멈췄습니다 — 주소·사진 정비가 오늘은 돌지 않았습니다. GitHub Actions 로그를 확인해 주세요.'
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$TXT" >/dev/null || true

      # 내용 검증이 실패해도 이 작업은 계속 돈다(예전 결함을 만나면 그날 정비 전체가
      # 버려졌기 때문). 그런데 실패했다는 말은 어디에도 가지 않았다 — 로그만 알았다.
      - name: Warn if content validation failed
        if: steps.validate.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          {
            echo "🧾 품질 점검 중 내용 검증이 실패했습니다 (정비 자체는 계속 진행됨)"
            echo "글에 구조적 문제가 남아 있다는 뜻입니다."
            echo
            tail -c 1000 /tmp/qa-validate.log
          } > /tmp/qa-val-msg.txt
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"             --data-urlencode chat_id="$TELEGRAM_CHAT_ID"             --data-urlencode "text@/tmp/qa-val-msg.txt" >/dev/null || true

      - name: Notify Telegram
        if: steps.commit.outputs.committed == '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADDR: ${{ steps.audit.outputs.addr }}
          IMG: ${{ steps.audit.outputs.img }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          if [ "${ADDR:-0}" = "0" ] && [ "${IMG:-0}" = "0" ]; then
            MSG="🧹 Wander Atlas 품질 점검 — 전화번호·영업시간 등 장소 세부정보를 정비했어요."
          else
            MSG="🧹 Wander Atlas 품질 점검 — 장소 글에서 주소 ${ADDR}건 + 사진 ${IMG}장을 수정했어요."
          fi
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode text="$MSG" > /dev/null || true
