name: Gallery patrol (weekly in-body photo retry)

# The second (in-body) photo is attempted once at publish time and never
# again; hit rate there is ~60-70%. This weekly patrol retries the one-photo
# venue posts through the IDENTICAL verification gate (see
# scripts/backfill-gallery.mjs — cadence is new, the bar is not).
# Commit-after-repair is in-job, per the 2026-08-14 lesson: a repair that
# runs without committing may as well not have run.

on:
  schedule:
    - cron: '10 21 * * 6' # Sat 21:10 UTC = Sun 06:10 KST, clear of the 04:35 photo patrol
  workflow_dispatch:
    inputs:
      limit:
        description: 'Posts to try this run'
        default: '40'
        required: false

permissions:
  contents: write

jobs:
  patrol:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Retry in-body photos (vision-gated)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FOURSQUARE_API_KEY: ${{ secrets.FOURSQUARE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GALLERY_LIMIT: ${{ github.event.inputs.limit || '40' }}
        run: node scripts/backfill-gallery.mjs

      - name: Commit & push
        run: |
          git config user.name "content-bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/content/posts data/gallery-retry.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "content: weekly in-body photo patrol ($(date -u +%Y-%m-%d))"
            bash scripts/git-push-retry.sh
          fi

      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=🖼️⚠️ 본문 사진 주간 순찰 실패 — Actions 로그 확인 필요: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null || true
