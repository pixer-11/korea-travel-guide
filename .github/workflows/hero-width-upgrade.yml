name: Hero width upgrade (Discover)

# Manual-only: swaps a live post's correct-but-narrow hero for a ≥1200px photo
# of the SAME venue (Google Discover large-card minimum). Vision-gated per
# candidate; posts with no wider verified photo keep their current hero — this
# never drafts, never retires. Runs here (not locally) because the
# Foursquare/Flickr keys only exist as repo secrets.
on:
  workflow_dispatch:
    inputs:
      slugs:
        description: 'Comma-separated slugs (required)'
        required: true

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Upgrade heroes (vision-gated, width-probed)
        id: run
        env:
          FOURSQUARE_API_KEY: ${{ secrets.FOURSQUARE_API_KEY }}
          FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLUGS: ${{ github.event.inputs.slugs }}
        run: |
          set -o pipefail
          node scripts/upgrade-hero-width.mjs | tee /tmp/width.log
          s=$(grep '^WIDTH_SUMMARY' /tmp/width.log | tail -1)
          echo "upgraded=$(echo "$s" | sed 's/.* upgraded=\([0-9]*\).*/\1/')" >> "$GITHUB_OUTPUT"
          echo "nowider=$(echo "$s" | sed 's/.* nowider=\([0-9]*\).*/\1/')" >> "$GITHUB_OUTPUT"
          # Reporting must never kill the run (see alt-photos.yml history).
          set +e
          set +o pipefail
          awk '/✅ [a-z0-9-]+:/ { sub(/^ *✅ /,"• "); sub(/:.*/,""); print; if (++n==20) exit }' /tmp/width.log > /tmp/fl.txt
          { echo "upgradedlist<<EOF_FL"; cat /tmp/fl.txt; echo "EOF_FL"; } >> "$GITHUB_OUTPUT"
          true

      - name: Rebuild photo-wall thumbnails
        run: node scripts/build-wall.mjs

      - name: Commit
        run: |
          git config user.name "content-bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/content/posts public/wall data/wall.json
          if git diff --staged --quiet; then
            echo "No hero changes."
          else
            git commit -m "feat: Discover-eligible heroes — same venue, >=1200px, vision-verified ($(date -u +%Y-%m-%d))"
            bash scripts/git-push-retry.sh
          fi

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          UPGRADED: ${{ steps.run.outputs.upgraded }}
          NOWIDER: ${{ steps.run.outputs.nowider }}
          UPGRADED_LIST: ${{ steps.run.outputs.upgradedlist }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          {
            echo "🖼️ Wander Atlas — 디스커버용 대형 사진 교체"
            if [ "$JOB_STATUS" != "success" ]; then
              echo "❌ 실행 실패 — GitHub Actions 로그를 확인해 주세요."
            else
              echo "✅ 더 큰 사진(1200px 이상)으로 교체: ${UPGRADED:-0}편 (전부 AI 시각 검증 통과)"
              echo "⏸️ 더 큰 사진이 없어 기존 사진 유지: ${NOWIDER:-0}편"
              if [ -n "$UPGRADED_LIST" ]; then echo "📄 교체된 글:"; echo "$UPGRADED_LIST"; fi
            fi
          } > /tmp/msg.txt
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode "text@/tmp/msg.txt" >/dev/null || true
